<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PsicTok</title>

<style>

html,body{

margin:0;
padding:0;

height:100%;
background:#000;
overflow:hidden;

font-family:Arial;

}

#feed{

height:100vh;
overflow-y:scroll;

scroll-snap-type:y mandatory;

}

.page{

height:100vh;
width:100vw;

position:relative;

scroll-snap-align:start;

background:black;

display:flex;
justify-content:center;
align-items:center;

}

video{

width:100%;
height:100%;

object-fit:contain;

background:black;

}

.info{

position:absolute;

left:20px;
bottom:25px;

color:white;

text-shadow:0 0 8px black;

z-index:100;

}

.info h2{

margin:0;
font-size:30px;

}

.info p{

margin:5px 0 0 0;

font-size:20px;

}

#fin{

height:100vh;

display:flex;

justify-content:center;
align-items:center;

font-size:50px;

color:white;

scroll-snap-align:start;

}

</style>

</head>

<body>

<div id="feed">

<div class="page">

<video
playsinline
preload="metadata"
src="np1.mp4">
</video>

<div class="info">

<h2>Neuropsicología</h2>

<p>Lóbulos frontales</p>

</div>

</div>



<div class="page">

<video
playsinline
preload="metadata"
src="np2.mp4">
</video>

<div class="info">

<h2>Neuropsicología</h2>

<p>Memoria</p>

</div>

</div>



<div id="fin">

Hasta acá llegamos

</div>

</div>



<script>

const videos=document.querySelectorAll("video");

function pausarTodo(){

videos.forEach(v=>{

v.pause();

});

}

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

const video=entry.target;

if(entry.isIntersecting && entry.intersectionRatio>0.6){

pausarTodo();

video.play().catch(()=>{});

}

});

},

{

threshold:0.6

});

videos.forEach(video=>{

observer.observe(video);

});



videos.forEach(video=>{

video.onclick=()=>{

if(video.paused)

video.play();

else

video.pause();

};

});

</script>

</body>

</html>

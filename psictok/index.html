<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neuropsicología Shorts</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

#container{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

video{
    max-width:100%;
    max-height:100%;
    cursor:pointer;
}

#overlay{
    position:absolute;
    top:25px;
    left:25px;
    color:white;
    text-shadow:0 0 8px black;
}

#overlay h1{
    font-size:28px;
    margin-bottom:10px;
}

#overlay h2{
    font-size:20px;
    font-weight:normal;
}

#fin{
    display:none;
    color:white;
    text-align:center;
}

#fin h1{
    font-size:48px;
    margin-bottom:20px;
}

#fin p{
    font-size:24px;
}
</style>

</head>

<body>

<div id="container">

<div id="overlay">
<h1>Neuropsicología</h1>
<h2 id="titulo"></h2>
</div>

<video id="video" playsinline></video>

<div id="fin">
<h1>Hasta acá llegamos</h1>
<p>Buen estudio.</p>
</div>

</div>

<script>

const videos=[
{
archivo:"np1.mp4",
titulo:"Lóbulos frontales"
},
{
archivo:"np2.mp4",
titulo:"Memoria"
}
];

let actual=0;

const video=document.getElementById("video");
const titulo=document.getElementById("titulo");
const overlay=document.getElementById("overlay");
const fin=document.getElementById("fin");

function cargar(i){

if(i>=videos.length){

video.style.display="none";
overlay.style.display="none";
fin.style.display="block";
return;

}

actual=i;

video.src=videos[i].archivo;
titulo.textContent=videos[i].titulo;

video.load();

video.play().catch(()=>{});

}

video.addEventListener("ended",()=>{

cargar(actual+1);

});

video.addEventListener("click",()=>{

if(video.paused)
video.play();
else
video.pause();

});

window.addEventListener("wheel",(e)=>{

if(e.deltaY>0){

if(actual<videos.length-1)
cargar(actual+1);
else
cargar(videos.length);

}

if(e.deltaY<0){

if(actual>0)
cargar(actual-1);

}

});

window.addEventListener("keydown",(e)=>{

if(e.key==="ArrowDown"){

if(actual<videos.length-1)
cargar(actual+1);
else
cargar(videos.length);

}

if(e.key==="ArrowUp"){

if(actual>0)
cargar(actual-1);

}

if(e.code==="Space"){

e.preventDefault();

if(video.paused)
video.play();
else
video.pause();

}

});

cargar(0);

</script>

</body>
</html>

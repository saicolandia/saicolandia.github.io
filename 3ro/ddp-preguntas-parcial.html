<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDP · Preguntas de parcial</title>
<style>
:root{
  --accent:#4f46e5;
  --bg:#fafaf9; --surface:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4;
  --ok:#15803d; --bad:#b91c1c;
  --r:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
}
:root[data-theme=dark]{
  --bg:#131211; --surface:#1d1b1a; --text:#f5f5f4; --muted:#a8a29e; --line:#2e2b29;
  --ok:#4ade80; --bad:#f87171;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.6 var(--sans);-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:1.25rem 1rem 4rem}
.muted{color:var(--muted)}
#bar-wrap{position:sticky;top:0;height:3px;background:var(--line);z-index:5}
#bar{height:100%;width:0;background:var(--accent);transition:width .4s}
header{text-align:center;padding:2.5rem 0 1.5rem;position:relative}
header h1{font:600 clamp(1.6rem,6vw,2.25rem)/1.2 var(--serif);margin:.75rem 0 .25rem}
header p{margin:0;color:var(--muted)}
#theme{position:absolute;top:.75rem;right:0;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;width:44px;height:44px;font-size:1.1rem;cursor:pointer}
.emoji{display:block;font-size:clamp(2.75rem,11vw,4.5rem);line-height:1;transition:transform .25s}
.card:hover .emoji,.flip:hover .emoji{transform:scale(1.08) rotate(-3deg)}
nav{display:flex;gap:.5rem;overflow-x:auto;padding:.25rem 0 1rem;scrollbar-width:none}
.pill{flex:none;min-height:44px;padding:0 1rem;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap}
.pill[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;text-align:center}
.card h3{font:600 1.1rem/1.3 var(--serif);margin:.75rem 0 .25rem}
.card p{margin:0;color:var(--muted)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* flip */
.flip{display:grid;border:0;background:none;padding:0;min-height:11rem;perspective:900px;cursor:pointer;font:inherit;color:inherit}
.face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:1.25rem;text-align:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s}
.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.flip[aria-pressed=true] .front{transform:rotateY(-180deg)}
.flip[aria-pressed=true] .back{transform:rotateY(0)}

/* accordion */
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:.75rem}
summary{display:flex;align-items:center;gap:.9rem;min-height:56px;padding:.5rem 1.1rem;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary .emoji{font-size:2rem}
details[open] summary{color:var(--accent)}
details p{margin:0;padding:0 1.1rem 1.1rem}

/* quiz */
.quiz .card{text-align:left;margin-bottom:1rem}
.quiz .card .emoji,.quiz .card h3{text-align:center}
.opt{display:block;width:100%;min-height:44px;margin-top:.5rem;padding:.6rem 1rem;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.fb{margin:.75rem 0 0;color:var(--muted)}
.tally{text-align:right;margin:0 0 .5rem}


h2.sec{font:600 1.15rem/1.3 var(--serif);margin:1.75rem 0 .75rem;color:var(--accent)}
.lead{color:var(--muted);margin:0 0 1rem}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:1rem}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
th,td{padding:.7rem .85rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-weight:600;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
td:first-child{font-weight:600;color:var(--accent);white-space:nowrap}
.formula{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center;justify-content:center;padding:1.5rem 1rem;margin-bottom:1rem;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);font:600 clamp(1.05rem,4.5vw,1.5rem) var(--serif)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 .4rem .1rem}
details ul{margin:0;padding:0 1.1rem 1.1rem 2.4rem}
details li{margin-bottom:.4rem}
details p+ul{margin-top:-.4rem}
details b{color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:.5rem;margin-top:2rem}
.card p+p{margin-top:.5rem}
.card.t{text-align:left}
.card.t h3{text-align:left}
.card.t .emoji{margin-bottom:.25rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const em = (x, cls = "emoji") => h("span", { class: cls }, x);
// texto con <b> permitido: se arma con nodos, sin innerHTML
const rich = s => s.split(/(<b>.*?<\/b>)/).filter(Boolean).map(t => t.startsWith("<b>") ? h("b", {}, t.slice(3, -4)) : t);

function applyTheme(dark) {
  root.dataset.theme = dark ? "dark" : "light";
  const p = PALETTE[DATA.accent] || PALETTE.indigo;
  root.style.setProperty("--accent", dark ? p[1] : p[0]);
}
applyTheme(matchMedia("(prefers-color-scheme: dark)").matches);
$("#theme").onclick = () => applyTheme(root.dataset.theme !== "dark");
document.title = DATA.title;
$("#h-emoji").textContent = DATA.emoji;
$("#h-title").textContent = DATA.title;
$("#h-sub").textContent = DATA.subtitle;

const R = {
  h: b => h("h2", { class: "sec" }, b.text),
  p: b => h("p", { class: "lead" }, b.text),
  cards: b => h("div", { class: "grid", style: "margin-bottom:1rem" }, ...b.items.map(i =>
    h("article", { class: "card t" }, em(i.e), h("h3", {}, i.t), h("p", {}, i.x)))),
  acc: b => h("div", {}, ...b.items.map(i => {
    const d = h("details", {}, h("summary", {}, em(i.e), i.t));
    if (i.o) d.open = true;
    if (i.x) d.append(h("p", {}, i.x));
    if (i.l) d.append(h("ul", {}, ...i.l.map(t => h("li", {}, ...rich(t)))));
    return d;
  })),
  table: b => h("div", { class: "wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, ...b.cols.map(c => h("th", {}, c)))),
    h("tbody", {}, ...b.rows.map(r => h("tr", {}, ...r.map(c => h("td", {}, c))))))),
  formula: b => h("div", { class: "formula", role: "img", "aria-label": "NP sobre DM por DM sobre x, da NP con significación fálica" },
    ...b.parts.map(p => Array.isArray(p) ? h("span", { class: "frac" }, h("span", {}, p[0]), h("span", {}, p[1])) : h("span", {}, p)))
};

const nav = $("#nav"), view = $("#view"), bar = $("#bar"), seen = new Set(), N = DATA.sections.length;
const pill = (i, txt) => { const b = h("button", { class: "pill", "aria-current": "false" }, txt); b.onclick = () => show(i); return b; };
DATA.sections.forEach((s, i) => nav.append(pill(i, `${s.emoji} ${s.title}`)));
function show(i) {
  seen.add(i);
  [...nav.children].forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
  nav.children[i].scrollIntoView({ inline: "center", block: "nearest" });
  const s = DATA.sections[i];
  const pager = h("div", { class: "pager" });
  pager.append(i > 0 ? pill(i - 1, "← " + DATA.sections[i - 1].title) : h("span"),
               i < N - 1 ? pill(i + 1, DATA.sections[i + 1].title + " →") : h("span"));
  view.replaceChildren(...s.blocks.map(b => R[b.type](b)), pager);
  bar.style.width = (seen.size / N * 100) + "%";
  scrollTo({ top: 0 });
}
show(0);
</script>
</body>
</html>

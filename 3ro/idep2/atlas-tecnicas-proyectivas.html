<style>
:root{--paper:#EFE6D2;--ink:#2A211B;--c1:#B5472B;--c2:#D9A441;--c3:#3E6B5A;--on1:#fff;--on2:#2A211B;--on3:#fff;

.t{top:140px;right:30px;border:48px solid transparent;border-bottom:84px solid var(--c3);border-top:0;width:0;height:0}

.em{font-size:2.6rem;line-height:1}
.mk{width:14px;align-self:stretch;flex:none}
.acc{border:var(--b);margin-bottom:.8rem;background:rgba(255,255,255,.5)}

.acc ul,.mod ul{padding:0 1rem .6rem 2rem}.acc li,.mod li{margin-bottom:.35rem}
.acc h3,.mod h3{font:800 .8rem var(--f);text-transform:uppercase;padding:.2rem 1rem}
.mod h3{padding:.6rem 0 .2rem}.mod ul{padding-left:1.2rem}
.sub{display:flex;gap:.5rem;flex-wrap:wrap;padding:0 1rem .8rem}
.note{margin:.4rem 1rem 1rem;padding:.6rem;border-left:8px solid var(--c1);font-size:.9rem}
dialog{border:var(--b);background:var(--paper);color:var(--ink);padding:1rem;width:min(92vw,640px);max-height:86vh;overflow:auto;box-shadow:8px 8px 0 var(--ink)}
dialog::backdrop{background:rgba(42,33,27,.6)}
dialog h2{font:800 1.4rem var(--f);text-transform:uppercase;margin-bottom:.2rem;padding-right:3rem}
.x{position:absolute;top:.6rem;right:.6rem}
.card{perspective:900px;height:300px;cursor:pointer;margin:1rem 0}
.card>div{position:relative;height:100%;transform-style:preserve-3d;transition:transform .5s}
.card.flip>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.2rem;gap:.6rem;font-weight:700;font-size:1.1rem;overflow:auto}
.face .em{font-size:4.5rem}
.back{transform:rotateY(180deg);background:var(--ink);color:var(--paper);font-weight:400;font-size:1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0}
.btn{border:var(--b);padding:.6rem 1rem;font:800 .85rem var(--f);text-transform:uppercase;cursor:pointer;background:var(--c2);color:var(--on2)}
.btn.g{background:var(--paper);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.8rem;border:var(--b);background:rgba(255,255,255,.5);font:600 1rem var(--f);cursor:pointer;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.4rem}.grid .opt{margin:0;padding:.6rem;font-size:.92rem}
.opt.ok{background:var(--c3);color:var(--on3)}.opt.no{background:var(--c1);color:var(--on1)}
.fb{margin:.8rem 0;padding:.8rem;border-left:8px solid var(--ink)}
.bar{height:12px;border:var(--b);margin:.5rem 0}.bar i{display:block;height:100%;background:var(--c1)}
.qh{font-size:1.2rem;font-weight:800;margin:.5rem 0}
blockquote{border:var(--b);background:var(--c2);color:var(--on2);padding:.9rem;margin:.6rem 0 1rem;font-weight:600}
blockquote small{display:block;font-weight:800;text-transform:uppercase;font-size:.75rem;margin-bottom:.3rem}
.nb{display:inline-block;min-width:1.7rem;height:1.7rem;line-height:1.5rem;text-align:center;border:var(--b);border-radius:50%;background:var(--c1);color:var(--on1);font-weight:800;margin-right:.5rem}
button:focus-visible,.card:focus-visible{outline:4px solid var(--c3);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

arjetas estímulo)."}, {"t": "BEN", "c": "rol", "x": "Prohibición estricta de rotar las tarjetas o usar regla/goma en exceso."}, {"t": "BEN", "c": "indic", "x": "Integración de la forma, rotación, distorsión, perseveración, colisión y superposición."}, {"t": "CD", "c": "consigna", "x": "Catexias + y -: 'Si no pudieras ser persona, ¿qué es lo que más/menos te gustaría ser? ¿Por qué?' (Pasando por reinos animal, vegetal e inanimado)."}, {"t": "CD", "c": "clas", "x": "Verbal pura, sin sostén perceptual externo."}, {"t": "CD", "c": "momento", "x": "NUNCA administrar al inicio ni como cierre de sesión/proceso para resguardar al Yo."}, {"t": "CAT", "c": "clas", "x": "Verbal combinada con estímulos pictóricos semi-estructurados (10 láminas con figuras de animales en situaciones humanas)."}, {"t": "CAT", "c": "indic", "x": "Ansiedades (castración, desamparo, pérdida de amor) y mecanismos de defensa."}, {"t": "CAT", "c": "consigna", "x": "Consigna verbal: 'Te voy a mostrar unas láminas, quisiera que me hagas un cuento con cada una; me decís qué pasa antes, qué pasa ahora y cómo termina.'"}, {"t": "TRO", "c": "clas", "x": "Verbal combinada con estímulos pictóricos de diverso grado de estructuración, sombreado y color (13 láminas: Series A, B, C y Blanc)."}, {"t": "TRO", "c": "rol", "x": "Presentación ordenada por series (A1, B1, C1, A2, B2, C2, A3, B3, C3, AG, BG, CG, Blanc)."}, {"t": "TRO", "c": "indic", "x": "Sistemas tensionales (diádicos, triádicos, grupales)."}], "cards": [{"u": "g1", "emoji": "✏️", "frente": "¿Quiénes son los autores de Dibujo Libre?", "dorso": "W. Wolff, P. Elkisch, N. Álvarez"}, {"u": "g1", "emoji": "✏️", "frente": "¿En qué momento de la batería se administra Dibujo Libre?", "dorso": "Apertura de la batería gráfica (primer gráfico de la serie). Permite evaluar la reacción espontánea sin estructuración temática previa ni condicionantes."}, {"u": "g1", "emoji": "✏️", "frente": "¿Cuál es la consigna de Dibujo Libre?", "dorso": "1. Consigna verbal: 'En esta hoja dibuja lo que quieras.' (Hoja neutra/vertical). 2. Interrogatorio: 'Hablame de tu dibujo' / '¿Qué dibujaste?'."}, {"u": "g1", "emoji": "✏️", "frente": "¿Qué indicadores clave analiza Dibujo Libre?", "dorso": "Emplazamiento, tamaño, presión y trazo. · Grado de humanización y completud. · Fantasías de enfermedad y curación (en niños). · Asociaciones verbales singulares (no interpretación salvaje)."}, {"u": "g1", "emoji": "🏠", "frente": "¿Quiénes son los autores de HTP?", "dorso": "J. Buck, E. Hammer, R. Frank de Verthelyi"}, {"u": "g1", "emoji": "🏠", "frente": "¿En qué momento de la batería se administra HTP?", "dorso": "Inicio de la batería gráfica estructurada (tras Dibujo Libre o de entrada en adultos). Secuencia graduada por reactividad proyectiva creciente."}, {"u": "g1", "emoji": "🏠", "frente": "¿Cuál es la consigna de HTP?", "dorso": "1. 'Dibuja una casa' (hoja horizontal). 2. 'Dibuja un árbol' (hoja vertical). 3. 'Dibuja una persona' (hoja vertical). 4. Interrogatorio estandarizado post-gráfico."}, {"u": "g1", "emoji": "🏠", "frente": "¿Qué indicadores clave analiza HTP?", "dorso": "Casa: actitud ante el hogar, contención y accesibilidad (aberturas). · Árbol: fortaleza yoica profunda (tronco), energía vital (copa) y enraizamiento. · Persona: autoimagen consciente, límites y contacto interpersonal."}, {"u": "g1", "emoji": "👥", "frente": "¿Quiénes son los autores de T2P?", "dorso": "J. Bernstein, R. Frank de Verthelyi"}, {"u": "g1", "emoji": "👥", "frente": "¿En qué momento de la batería se administra T2P?", "dorso": "Tramo medio de la batería gráfica (posterior al HTP o Dibujo Libre). Evalúa la díada antes de pasar al grupo familiar."}, {"u": "g1", "emoji": "👥", "frente": "¿Cuál es la consigna de T2P?", "dorso": "1. 'Dibuja dos personas cualesquiera.' 2. Nombres y edades de las figuras. 3. 'Escribe una historia que diga qué les ocurre, qué piensan y sienten.' 4. Título de la historia."}, {"u": "g1", "emoji": "👥", "frente": "¿Qué indicadores clave analiza T2P?", "dorso": "Análisis intra-figura (humanización, identidades) e inter-figura (kinesia, contacto, distancia). · Coherencia del relato verbal (tres tiempos). · Modalidad vincular proyectada (simetría, dependencia, hostilidad)."}, {"u": "g1", "emoji": "☔", "frente": "¿Quiénes son los autores de PBLL?", "dorso": "A. Abrams, S. Querol"}, {"u": "g1", "emoji": "☔", "frente": "¿En qué momento de la batería se administra PBLL?", "dorso": "Posterior al gráfico de la Persona (HTP o T2P). Permite el análisis comparativo intra-sujeto ante una situación de estrés simulado."}, {"u": "g1", "emoji": "☔", "frente": "¿Cuál es la consigna de PBLL?", "dorso": "Consigna verbal: 'Dibuja una persona bajo la lluvia.' (Hoja entregada en posición vertical). Sin definir el tipo de lluvia ni elementos de protección."}, {"u": "g1", "emoji": "☔", "frente": "¿Qué indicadores clave analiza PBLL?", "dorso": "Comparación directa con la figura humana previa (cambios de tamaño, trazo, ubicación). · Tipo de lluvia (copiosa, gotas, ráfagas). · Elementos de protección (paraguas adecuado/dañado/ausente, impermeables, charcos). · Mecanismos de defensa (maníacos, aislamiento, inhibición, descompensación)."}, {"u": "g1", "emoji": "👨‍👩‍👧", "frente": "¿Quiénes son los autores de FKA / FKP?", "dorso": "R. Burns & S. Kaufman, L. Corman, R. Verthelyi"}, {"u": "g1", "emoji": "👨‍👩‍👧", "frente": "¿En qué momento de la batería se administra FKA / FKP?", "dorso": "Cierre de la serie gráfica por su elevada reactividad emocional e implicación directa con la trama vincular del grupo primario."}, {"u": "g1", "emoji": "👨‍👩‍👧", "frente": "¿Cuál es la consigna de FKA / FKP?", "dorso": "FKA: 'Dibuja a tu familia haciendo algo...' FKP: '...tal como la imaginas dentro de 5 años.' (Corman: 'Imagina una familia que tú inventes y dibújala'). + Interrogatorio catamnésico."}, {"u": "g1", "emoji": "👨‍👩‍👧", "frente": "¿Qué indicadores clave analiza FKA / FKP?", "dorso": "Kinesia (acciones individuales, conjuntas o de exclusión). · Emplazamiento, tamaño relativo, omisiones y adiciones. · Asignación de roles y fantasías de prospección (FKP). · Plano gráfico, de estructuras formales y del contenido (Corman)."}, {"u": "g1", "emoji": "🔷", "frente": "¿Quiénes son los autores de Bender?", "dorso": "L. Bender, E. Koppitz"}, {"u": "g1", "emoji": "🔷", "frente": "¿En qué momento de la batería se administra Bender?", "dorso": "Al inicio de la batería gráfica (como prueba objetiva de baja ambigüedad) o al final como momento de contención y descompresión de ansiedad."}, {"u": "g1", "emoji": "🔷", "frente": "¿Cuál es la consigna de Bender?", "dorso": "Consigna verbal: 'Te voy a mostrar unas tarjetas que tienen unos dibujos; quiero que los copies en esta hoja lo más parecido posible.'"}, {"u": "g1", "emoji": "🔷", "frente": "¿Qué indicadores clave analiza Bender?", "dorso": "Integración de la forma, rotación, distorsión, perseveración, colisión y superposición. · Orden espacial y manejo del espacio en la hoja. · Indicadores de maduración perceptivo-motora (Koppitz) e indicadores emocionales/orgánicos."}, {"u": "g2", "emoji": "💭", "frente": "¿Quiénes son los autores de Desiderativo?", "dorso": "J. Bernstein, G. Celener, E. Braude"}, {"u": "g2", "emoji": "💭", "frente": "¿En qué momento de la batería se administra Desiderativo?", "dorso": "Tramo final de la batería psicodiagnóstica (post-gráficos, pre-láminas o antes de cerrar). NUNCA administrar al inicio ni como cierre de sesión/proceso para resguardar al Yo."}, {"u": "g2", "emoji": "💭", "frente": "¿Cuál es la consigna de Desiderativo?", "dorso": "Catexias + y -: 'Si no pudieras ser persona, ¿qué es lo que más/menos te gustaría ser? ¿Por qué?' (Pasando por reinos animal, vegetal e inanimado). Infancia: 'Si no pudieras ser nene/a...'"}, {"u": "g2", "emoji": "💭", "frente": "¿Qué indicadores clave analiza Desiderativo?", "dorso": "1.ª Disociación Instrumental (aceptación del 'como si' sin respuestas humanas/abstractas). · 2.ª Disociación Instrumental (polarización + y -). · Identificación Proyectiva y Racionalización Desiderativa. · Tiempos de reacción y análisis de la fortaleza yoica."}, {"u": "g3", "emoji": "🐻", "frente": "¿Quiénes son los autores de CAT-A?", "dorso": "L. Bellak"}, {"u": "g3", "emoji": "🐻", "frente": "¿En qué momento de la batería se administra CAT-A?", "dorso": "Etapa de láminas temáticas verbales (posterior a los gráficos y al Desiderativo infantil; indicado entre los 3 y 10 años)."}, {"u": "g3", "emoji": "🐻", "frente": "¿Cuál es la consigna de CAT-A?", "dorso": "Consigna verbal: 'Te voy a mostrar unas láminas, quisiera que me hagas un cuento con cada una; me decís qué pasa antes, qué pasa ahora y cómo termina.'"}, {"u": "g3", "emoji": "🐻", "frente": "¿Qué indicadores clave analiza CAT-A?", "dorso": "Tema principal, héroe principal, necesidades y presiones del entorno. · Concepción del mundo y figuras parentales/fraternas. · Conflictos centrales (oralidad, analidad, rivalidad, Edipo). · Ansiedades (castración, desamparo, pérdida de amor) y mecanismos de defensa."}, {"u": "g3", "emoji": "🖼️", "frente": "¿Quiénes son los autores de TRO?", "dorso": "H. Phillipson"}, {"u": "g3", "emoji": "🖼️", "frente": "¿En qué momento de la batería se administra TRO?", "dorso": "Etapa final de pruebas temáticas por láminas en adolescentes y adultos (tras la batería gráfica y el Cuestionario Desiderativo)."}, {"u": "g3", "emoji": "🖼️", "frente": "¿Cuál es la consigna de TRO?", "dorso": "Consigna verbal: 'Le voy a mostrar unas láminas; invente una historia diciendo qué ocurre, qué ocurrió antes, cómo termina y qué sienten y piensan los personajes.' (Lámina en blanco: imaginar imagen y relato)."}, {"u": "g3", "emoji": "🖼️", "frente": "¿Qué indicadores clave analiza TRO?", "dorso": "Percepción de la lámina (omisiones, adiciones, distorsiones del estímulo). · Appercepción y coherencia narrativa en tres tiempos. · Sistemas tensionales (diádicos, triádicos, grupales). · Contexto de realidad (Series A, B, C) y ansiedades/defensas dominantes."}, {"u": "gd", "emoji": "🌗", "frente": "Prueba de Realidad (Freud)", "dorso": "Dispositivo yoico que discrimina estímulos internos (fantasía) de externos (percepción). Evalúa límites Yo / no-Yo (neurosis vs psicosis)."}, {"u": "gd", "emoji": "🌗", "frente": "Juicio de Realidad", "dorso": "Certeza y congruencia lógica en la interpretación del mundo sin distorsiones ni pensamiento mágico."}, {"u": "gd", "emoji": "🌗", "frente": "Adaptación a la Realidad", "dorso": "Ajuste normativo cultural y sostenimiento de roles."}, {"u": "gd", "emoji": "🔗", "frente": "Plano Intrasubjetivo", "dorso": "Matriz de relaciones de objeto internas, identificaciones primarias/secundarias y autonomía yoica."}, {"u": "gd", "emoji": "🔗", "frente": "Plano Intersubjetivo", "dorso": "Reconocimiento del otro en su alteridad (ajenidad), dinámicas familiares y pares."}, {"u": "gd", "emoji": "🔗", "frente": "Plano Transubjetivo", "dorso": "Inserción en significados socioculturales e instituciones."}], "dim": [{"t": "Dimensión 1: Contacto con la Realidad", "e": "🌗", "sub": [{"t": "Prueba de Realidad (Freud)", "d": "Dispositivo yoico que discrimina estímulos internos (fantasía) de externos (percepción). Evalúa límites Yo / no-Yo (neurosis vs psicosis)."}, {"t": "Juicio de Realidad", "d": "Certeza y congruencia lógica en la interpretación del mundo sin distorsiones ni pensamiento mágico."}, {"t": "Adaptación a la Realidad", "d": "Ajuste normativo cultural y sostenimiento de roles."}], "gr": ["Gráficos: Conservación de la Gestalt, precisión formal, contornos continuos y grado de humanización.", "Desiderativo: 1.ª Disociación Instrumental (aceptar el 'como si' simbólico y tolerar la angustia de pérdida de la representación humana sin desestructuración yoica)."], "cat": ["CAT-A / TRO: Ajuste perceptivo a los estímulos de las láminas, coherencia lógica en la narrativa y estructuración temporal en tres tiempos (pasado, presente, futuro).", "Devolución (Unidad V): Capacidad del consultante para escu <script>

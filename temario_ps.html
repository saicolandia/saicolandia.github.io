posición frente a objetos sociales específicos en respuesta a un contexto. La RS, en cambio, es un universo mental global que no depende de una interacción inmediata, sino que la precede y determina.\n• Estereotipo: Se distinguen por su grado de dinamismo. Los estereotipos son fórmulas rígidas de \"economía mental\". Las RS, aunque poseen un núcleo central estable, son dinámicas y se enriquecen constantemente mediante la comunicación y la interacción social.\n• Percepción social: La percepción suele describirse como una instancia mediadora entre el estímulo y el concepto. En la teoría de las RS, esta distinción desaparece: el concepto y la percepción se engendran recíprocamente, pues el objeto percibido ya es el objeto representado.\n• Imagen: A menudo se reduce la imagen a una \"copia\" o reflejo pasivo de la realidad. La RS es una reconstrucción activa que dota de sentido a la información, transformando lo abstracto en algo concreto y figurativo a través del proceso de objetivación.3. Diferenciación con conceptos sociológicos y científicosLa RS ocupa un lugar intermedio entre los procesos individuales y las estructuras sociales globales.\n• Conocimiento Científico: La ciencia busca la verdad y la exactitud mediante métodos rigurosos. El \"hombre de la calle\" busca, a través de las RS, no quedar fuera del circuito social, pudiendo comunicar y entender lo que sucede en su mundo cotidiano de forma accesible. La RS \"vulgariza\" el conocimiento científico para hacerlo manejable.\n• Ideología: La RS se sitúa en un nivel de mayor concreción que la ideología. Se considera que las RS son el concepto que operacionaliza y hace accesible el estudio de las ideologías dominantes en una sociedad, permitiendo observar cómo estas se traducen en cogniciones sociales específicas.\n• Sentido Común: La RS es la forma en que se manifiesta el saber de sentido común en las sociedades modernas. A diferencia del conocimiento mítico, el sentido común de las RS está dinamizado por el flujo constante de información de los medios de comunicación de masas y la interacción cotidiana.4. Las Representaciones Sociales como \"Doble Sistema\"Para diferenciarla definitivamente de procesos puramente cognitivos o sociológicos, se postula que la RS funciona como un doble sistema que permite la coexistencia de lo estable y lo móvil:\n1. Sistema Central (Núcleo): Vinculado a la memoria colectiva y los valores del grupo, garantizando la estabilidad y el consenso.\n2. Sistema Periférico: Vinculado a las experiencias individuales y los contextos inmediatos, permitiendo la adaptación y la flexibilidad ante la realidad cambiante", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Funciones de las representaciones sociales.", "desarrollo": "Las representaciones sociales (RS) desempeñan un papel fundamental en las prácticas y en la dinámica de las relaciones sociales, respondiendo primordialmente a cuatro funciones esenciales que permiten a los individuos y grupos navegar su realidad cotidiana.1. Funciones de saber: Comprensión y explicación de la realidadEsta función permite a los actores sociales adquirir conocimientos e integrarlos en un marco de referencia que les resulte asimilable y coherente con sus valores y sistemas cognitivos previos. Actúan como un saber práctico de sentido común que define el marco de referencia común necesario para la comunicación social, facilitando el intercambio, la transmisión y la difusión de la información dentro de un grupo. En esencia, buscan convertir lo extraño o desconocido en algo familiar y no amenazante para el sujeto.2. Funciones identitarias: Definición y protección del grupoLas representaciones tienen la función de situar a los individuos y grupos en el campo social, permitiendo la elaboración de una identidad social y personal gratificante. Esto ayuda a salvaguardar la especificidad de los grupos y a mantener una imagen positiva de los mismos, especialmente en procesos de comparación social. Mediante esta función, el grupo ejerce un control social sobre sus miembros y define los límites de lo que es propio frente a lo ajeno.3. Funciones de orientación: Guía para la acciónLas RS funcionan como un sistema de pre-decodificación de la realidad, determinando anticipaciones y expectativas que guían los comportamientos. Al preceder a la interacción social, la representación interviene directamente en la definición de la finalidad de una situación, estableciendo qué tipo de relaciones y gestiones cognitivas son pertinentes para el sujeto. De este modo, la representación no es una reacción pasiva, sino una guía para la acción que orienta las relaciones sociales.4. Funciones justificadoras: Justificación de posturas y conductasEsta función interviene principalmente después de la acción, permitiendo a los individuos explicar y justificar sus decisiones y comportamientos en una situación dada. Es particularmente visible en las relaciones intergrupales, donde las RS pueden utilizarse para justificar comportamientos hostiles hacia otros grupos o para perpetuar y legitimar la diferenciación y la distancia social.5. Funciones desde la perspectiva estructuralDesde el enfoque estructural de la teoría, se identifican funciones adicionales según la organización interna de la representación:\n• Del Núcleo Central: Ejerce una función generadora, que crea o transforma la significación de los demás elementos, y una función organizadora, que determina la naturaleza de los vínculos entre todos los componentes de la representación.\n• De los Elementos Periféricos: Estos cumplen funciones de concreción (anclaje de la representación en la realidad inmediata), regulación (adaptación de la representación a las evoluciones del contexto) y defensa (protección del núcleo central actuando como un \"parachoques\" ante informaciones contradictorias).", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Factores que determinan su organización.", "desarrollo": "La organización de las representaciones sociales está influenciada por dos órdenes de factores: aquellos que afectan la organización intelectual del sujeto y los que se refieren a su determinación social, la cual se divide en central y lateral.A continuación, se desarrollan los factores que determinan la configuración de ambos tipos de determinación social:1. Factores de Organización IntelectualAntes de la determinación puramente social, existen tres factores que condicionan cómo se organiza internamente la representación:\n• Dispersión de la información: La cantidad y calidad de los datos sobre un objeto varían según el grupo social; nunca se posee toda la información necesaria o esta circula de forma desigual.\n• Presión a la inferencia: El grupo social exige a sus miembros tener una postura o conocimiento sobre ciertos eventos para no quedar excluidos de la comunicación social, lo que obliga a \"completar\" vacíos de información.\n• Grado de focalización: Se refiere al nivel de interés o implicación que el objeto despierta en el grupo; a mayor relevancia, más presión hay por generar juicios y comunicarse sobre él.2. Factores de la Determinación Social CentralEste tipo de determinación se vincula con la influencia de la sociedad global sobre la representación. Sus factores determinantes incluyen:\n• Condiciones socioeconómicas e históricas globales: Los factores macro de la sociedad definen el \"estado\" de la representación, marcando sus posibilidades de extensión y evolución en el tiempo.\n• Inserción en redes de información: El nivel sociocultural y económico del grupo condiciona el acceso a la información científica o técnica, lo que determina qué contenidos se integran en el saber común (por ejemplo, la vulgarización del conocimiento varía entre sectores rurales y urbanos).\n• Estructura de control social: Esta determinación tiene un peso mayor en contextos sociales caracterizados por el totalitarismo y la inmovilidad social, donde las normas globales se imponen con mayor fuerza sobre los individuos.3. Factores de la Determinación Social LateralEsta forma de determinación reconoce que la representación no es solo un producto de la estructura global, sino también de las particularidades del grupo y del sujeto. Sus factores clave son:\n• Autonomía del colectivo particular: Los grupos tienen un margen de independencia dentro del sistema social para imprimir sus propias huellas en la representación, lo que genera contenidos heterogéneos y dinámicos.\n• Historia e identidad individual: Al representarse un objeto, el sujeto singular no es un receptor pasivo; este utiliza su propia historia y experiencias para construir el objeto y, en el proceso, reafirmar su propia identidad.\n• Relación sujeto-objeto: El núcleo de la representación se ve determinado por el tipo de vínculo que el grupo mantiene con el objeto y el sistema de valores y normas que constituyen su entorno inmediato.\n• Contexto de libertad social: La determinación lateral cobra mayor relevancia en sociedades con altos grados de democracia y movilidad, donde se permite una mayor diversidad de tomas de posición individuales.Relación DialécticaLa organización final de la representación es el resultado de una relación dinámica y dialéctica entre ambas determinaciones. Mientras que la central aporta la base común, colectiva y estable (relacionada con el núcleo central), la lateral permite la adaptación, la flexibilidad y la integración de las experiencias cotidianas a través del sistema periférico de la representación.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Procesos de formación de las representaciones sociales: la objetivación y el anclaje.", "desarrollo": "La formación de las representaciones sociales es un proceso mediante el cual se muestra la interdependencia entre la actividad psicológica y las condiciones sociales de su ejercicio. Según Serge Moscovici, este proceso se realiza a través de dos mecanismos fundamentales e indisociables que funcionan como el anverso y el reverso de una misma moneda: la objetivación y el anclaje.A continuación, se desarrolla cada uno de estos procesos:1. La ObjetivaciónLa objetivación se define como la conversión de un ente abstracto en un ente concreto. Es el proceso que permite materializar lo intangible y plasmar conceptos complejos en figuras tangibles y comprensibles. Este mecanismo comprende tres fases u operaciones mentales:\n• Selección y descontextualización de los elementos: En esta etapa, el grupo retiene de manera selectiva una parte de la información disponible sobre un objeto (por ejemplo, una teoría científica). Esta selección no es aleatoria, sino que está bajo el filtro de las normas y valores del grupo. Los elementos son disociados de su contexto original, adquiriendo una autonomía que facilita su utilización por parte del individuo.\n• Formación del núcleo figurativo: La información seleccionada se organiza en una estructura de imágenes que permite visualizar lo abstracto. Este núcleo es un esquema simple, concreto y gráfico que constituye el sustrato de toda representación. Un ejemplo clásico es cómo el público simplificó el psicoanálisis en un esquema de \"Inconsciente/Represión/Consciente\" para entender conceptos complejos.\n• Naturalización: Es la fase final donde los elementos de la representación, al materializarse y estructurarse en el núcleo, dejan de ser meros conceptos para convertirse en \"seres de naturaleza\" con existencia real. Adquieren un \"estatuto de evidencia\" para el sujeto; por ejemplo, la gente empieza a hablar del inconsciente como si fuera una entidad física que está \"inquicta\" o \"agresiva\".2. El AnclajeEl anclaje no es un proceso separado de la objetivación, sino que ambos se alimentan recíprocamente. Mientras la objetivación se ocupa de la \"forma\" o figura, el anclaje se refiere a la atribución de significados que corresponden a esa figura.Sus funciones principales son:\n• Familiarización de lo extraño: Su objetivo primordial es convertir lo desconocido o amenazador en algo familiar y manejable, integrándolo en el sistema de categorías preexistente del grupo.\n• Integración en redes de significados: Permite que el nuevo objeto se inserte dentro de una red de significaciones previas, remodelando el sistema de representaciones ya existente para dar cabida a lo nuevo.\n• Instrumento de interpretación y acción: El anclaje convierte a la representación en un sistema interpretativo que guía la conducta y las relaciones sociales. Funciona como un código común que permite a los miembros de un grupo clasificar personas o eventos y comunicarse de manera coherente.En resumen, la objetivación dota a la representación de una cara figurativa (la imagen), mientras que el anclaje le proporciona su cara simbólica (el significado), permitiendo que el conocimiento de sentido común sea a la vez innovador y arraigado en la memoria social.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Enfoques procesual y estructural para el estudio de las representaciones sociales: similitudes y diferencias.", "desarrollo": "El estudio de las representaciones sociales (RS) se ha desarrollado principalmente a través de dos grandes perspectivas: el enfoque procesual (o escuela clásica) y el enfoque estructural (o escuela de Aix-en-Provence). Ambos comparten la premisa de que las RS son sistemas de interpretación de la realidad que guían la acción, pero difieren en su énfasis teórico y metodológico.A continuación, se desarrollan las similitudes y diferencias entre ambos enfoques:1. Similitudes entre ambos enfoques\n• Objeto de estudio común: Ambos consideran que una representación social es un conjunto organizado de cogniciones (informaciones, creencias, opiniones y actitudes) compartido por los miembros de un grupo respecto a un objeto.\n• Superación del dualismo sujeto-objeto: Las dos perspectivas abandonan la distinción clásica entre un universo exterior \"objetivo\" y uno interior \"subjetivo\", entendiendo que la realidad es siempre representada y reconstruida por el sujeto.\n• Reconocimiento de un \"doble sistema\": Ambas admiten que las RS poseen una naturaleza dual: son a la vez estables y móviles, así como rígidas y flexibles. Este consenso permite entender que la representación tiene una base común colectiva y estable, pero también una parte móvil alimentada por la experiencia individual.\n• Finalidad práctica: Coinciden en que las RS funcionan como una \"guía para la acción\", permitiendo a los individuos dar sentido a sus conductas y adaptarse a su entorno social e ideológico.\n2. Diferencias fundamentales\nEnfoque Procesual (Clásico)\nReferente principal: Denise Jodelet y Serge Moscovici\nÉnfasis teórico: Se centra en el aspecto constituyente del pensamiento (los procesos de formación).\nVisión del objeto: Define el objeto como instituyente; le interesa el ser humano como productor de sentidos.\nFoco de análisis: Privilegia lo social, la cultura, la historia y las interacciones sociales globales.\nMetodología: Cualitativa y hermenéutica: entrevistas en profundidad, análisis de contenido y observación.\nNaturaleza del saber: Ve el conocimiento como algo versátil, diverso y caleidoscópico.\n\nEnfoque Estructural (Aix)\nReferente principal: Jean-Claude Abric y Claude Flament.\nÉnfasis teórico: Se centra en el aspecto constituido (el producto o estructura resultante).\nVisión del objeto: Define el objeto como instituido; le interesa cómo se organizan internamente los contenidos.\nFoco de análisis: Privilegia el funcionamiento cognitivo y el aparato psíquico.\nMetodología: Experimental y cuantitativa: técnicas multivariadas, análisis de similitud y métodos para extraer el núcleo central.\nNaturaleza del saber: Ve la representación como una estructura jerarquizada y estable organizada alrededor de un núcleo.\n3. El concepto de \"Doble Naturaleza\" como nexoAunque existe una separación heurística entre ambos, las fuentes advierten que no debe caerse en una falsa dicotomía. El enfoque estructural ha aportado la Teoría del Núcleo Central, que explica la estabilidad de la representación a través de un sistema central (vinculado a la memoria social) y un sistema periférico (vinculado al contexto inmediato). Por su parte, el enfoque procesual permite comprender cómo ese núcleo se ha ido gestando mediante procesos de objetivación y anclaje en la interacción cara a cara.En resumen, mientras que el enfoque procesual se pregunta \"cómo y por qué\" se construye el sentido común en un contexto histórico, el enfoque estructural se pregunta \"cómo se organiza\" ese conocimiento para resistir al cambio y guiar el comportamiento cotidiano.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Las dimensiones de estudio de las representaciones sociales.", "desarrollo": "El estudio de las representaciones sociales (RS) identifica tres dimensiones fundamentales que constituyen el universo de creencias de este tipo de conocimiento: la actitud, la información y el campo de representación. Estas dimensiones permiten analizar cómo se organiza y manifiesta el saber de sentido común en un grupo social.A continuación, se desarrolla cada una de estas dimensiones:1. La actitudEs la dimensión que aparece con mayor frecuencia en los discursos y suele ser la primera en manifestarse.\n• Definición: Se refiere a la orientación global, ya sea positiva o negativa, favorable o desfavorable, que el sujeto tiene hacia el objeto de la representación.\n• Función: Representa el componente afectivo y evaluativo. Aunque una persona carezca de información detallada sobre un tema, generalmente posee una actitud que guía su posición frente a él.2. La informaciónEsta dimensión se relaciona con el bagaje de conocimientos que un grupo posee sobre un objeto social determinado.\n• Cantidad y calidad: La información se evalúa en función de su extensión (qué tanto se sabe) y su calidad (qué tan precisos son esos datos).\n• Factores condicionantes: La cantidad de información disponible varía según la pertenencia a un grupo, el nivel sociocultural y el acceso a las redes de comunicación. Por ejemplo, la información sobre una teoría científica se \"vulgariza\" de forma distinta entre diferentes estratos sociales.3. El campo de representaciónEs la dimensión que alude a la unidad organizada y estructurada de la representación.\n• Organización del contenido: No se refiere solo a tener datos (información), sino a cómo esos datos se jerarquizan y cobran sentido en un \"modelo figurativo\" o imagen mental.\n• Estructura: Se refiere al contenido concreto y limitado de las proposiciones sobre el objeto y a la forma en que este contenido se organiza. Las fuentes señalan que si no existe una organización o campo estructurado, estrictamente no se puede hablar de una representación social del objeto, sino de opiniones dispersas.\n• Relación con la información: Existe una interdependencia entre estas dimensiones; por ejemplo, se ha observado que a medida que el sujeto posee más información sobre el objeto, el campo de representación se enriquece y su estructura se vuelve más clara.Integración de las dimensionesEstas tres dimensiones no funcionan de forma aislada. La representación social es una unidad integradora que combina actitudes, opiniones, esquemas de información y sistemas de valores. Mientras que las ciencias buscan la exactitud, las RS utilizan estas dimensiones para permitir que los individuos comprendan su realidad cotidiana y \"no queden fuera del circuito social\", facilitando la comunicación y la toma de posición ante eventos que los rodean.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "La teoría del núcleo central.", "desarrollo": "La Teoría del Núcleo Central, desarrollada principalmente por Jean-Claude Abric y la Escuela de Aix-en-Provence, constituye el eje fundamental del enfoque estructural de las representaciones sociales,. Esta teoría postula que toda representación está organizada alrededor de un núcleo central que determina tanto su significación como su organización interna,.A continuación, se desarrollan los componentes y funciones esenciales de esta teoría:1. Definición y naturaleza del núcleo centralEl núcleo central es el elemento (o conjunto de elementos) que otorga coherencia y sentido global a la representación,. Se caracteriza por ser:\n• Estable y rígido: Es el componente que más resiste al cambio; cualquier modificación en él implica una transformación completa de la representación,,.\n• Consensuado: Está profundamente anclado en la memoria colectiva y en el sistema de valores compartidos por el grupo, definiendo su homogeneidad,.\n• Independiente del contexto inmediato: A diferencia de otros elementos, su origen se remonta al contexto global (histórico y social) del grupo.2. Funciones fundamentales del núcleoAbric asigna al núcleo central dos funciones esenciales que rigen el sistema representacional:\n• Función generadora: Es el elemento mediante el cual se crea o transforma la significación de los demás elementos de la representación. A través del núcleo, los demás componentes adquieren un sentido y un valor específico,.\n• Función organizadora: El núcleo determina la naturaleza de los vínculos que unen entre sí a todos los elementos de la representación, actuando como el principio unificador y estabilizador,.3. Dimensiones del núcleo centralDependiendo de la naturaleza del objeto y de la finalidad de la situación, el núcleo puede presentar dos dimensiones:\n• Dimensión normativa: Relacionada con aspectos socioafectivos, sociales o ideológicos. En esta dimensión se insertan las normas, los valores y los estereotipos del grupo,.\n• Dimensión funcional: Vinculada a situaciones de finalidad operativa o tareas específicas. Aquí se privilegian los elementos más importantes para la realización práctica de una acción,.4. Relación con el sistema periféricoEl núcleo central no existe de forma aislada; está rodeado y protegido por los elementos periféricos, los cuales funcionan como un \"doble sistema\",:\n• Dependencia: Los elementos periféricos están determinados por el núcleo; su presencia y valor dependen de la significación central,.\n• Adaptación y flexibilidad: Mientras el núcleo es estable, la periferia es móvil y permite integrar experiencias individuales e informaciones nuevas del contexto inmediato,,.\n• Función de defensa (Parachoques): El sistema periférico protege al núcleo central de contradicciones o informaciones externas que puedan amenazarlo, absorbiendo las primeras transformaciones antes de que el núcleo se vea afectado,.En conclusión, la identificación del núcleo central es lo que permite diferenciar verdaderamente una representación de otra. Dos representaciones pueden compartir el mismo contenido, pero si su núcleo central es distinto, su organización y significación global serán radicalmente diferentes.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Aproximaciones metodológicas en el estudio de las representaciones sociales.", "desarrollo": "El estudio de las representaciones sociales (RS) se caracteriza por una pluralidad metodológica que depende de los supuestos epistemológicos y ontológicos de la investigación. La elección de un método no es solo técnica, sino que responde a si se busca aprehender el proceso de construcción del sentido (pensamiento constituyente) o el producto ya organizado (pensamiento constituido).De acuerdo con las fuentes, se distinguen tres grandes aproximaciones o escuelas con sus respectivas metodologías:1. El Enfoque Procesual (Escuela Clásica)Liderado por Denise Jodelet y basado en la propuesta original de Moscovici, este enfoque se centra en el aspecto constituyente de las representaciones.\n• Fundamento: Utiliza un abordaje hermenéutico donde el ser humano es visto como un productor de sentidos.\n• Metodología: Recurre por excelencia a técnicas cualitativas que permiten acceder al material discursivo.\n• Técnicas principales: Entrevistas en profundidad, análisis de contenido de discursos espontáneos o inducidos (conversaciones, prensa, literatura) y observación.\n• Objetivo: Analizar los procesos sociales de construcción en la interacción cara a cara y el significado histórico-social de los contenidos.2. El Enfoque Estructural (Escuela de Aix-en-Provence)Desarrollado principalmente por Jean-Claude Abric, se centra en el aspecto constituido, es decir, en la estructura y organización de la representación.\n• Fundamento: Se apoya en la Teoría del Núcleo Central, postulando que para entender una RS es obligatorio identificar tanto su contenido como su estructura jerárquica.\n• Metodología: Utiliza prioritariamente el método experimental y análisis estadísticos.\n• Técnicas principales:\n    ◦ Asociación libre de palabras y cuestionarios estructurados.\n    ◦ Técnicas de jerarquización (como el tris o clasificación de ítems).\n    ◦ Análisis multivariados, análisis de similitud y de correspondencia para extraer el núcleo central y los elementos periféricos.3. El Enfoque Sociológico (Escuela de Ginebra)Representado por Willem Doise, este enfoque se interesa por las condiciones de producción y circulación de las representaciones.\n• Foco: Analiza cómo las inserciones sociales de los individuos y las relaciones intergrupales determinan las tomas de posición y la dinámica de las representaciones en el campo social.Comparativa y Tendencias Regionales\n• Similitudes: Ambos enfoques principales (procesual y estructural) reconocen que la RS es un conjunto organizado de cogniciones y que funciona como una guía para la acción. La separación entre ellos es más heurística que real, ya que el \"doble sistema\" de las RS (estables y móviles) hace que ambos abordajes sean pertinentes y complementarios.\n• Diferencias Geográficas: Existe una marcada diferencia en la aplicación de estos métodos según la región:\n    ◦ Europa: Concentra la mayor producción (más del 90%) y se inclina mayoritariamente hacia el enfoque estructural y cuantitativo.\n    ◦ América Latina: (Especialmente México, Brasil y Venezuela) tiene un énfasis mayor en el enfoque procesual y las técnicas cualitativas.En conclusión, la tendencia actual sugiere la triangulación metodológica (combinar múltiples técnicas y teorías) como la vía más eficaz para garantizar una comprensión profunda y totalizadora del objeto de estudio.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Definición de influencia social.", "desarrollo": "La influencia social se define como las diversas maneras en que las personas son afectadas por las presiones reales e imaginarias de los demás. En su sentido más específico, se refiere a los procesos que están en la base de las modificaciones o reestructuraciones de las percepciones, juicios, opiniones y comportamientos de un individuo o grupo, provocadas por el conocimiento de las posturas de otros sujetos.Este fenómeno puede analizarse a través de diferentes dimensiones y grados de presión:\n• Continuo de la influencia: La influencia no es un proceso estático, sino que varía según el grado de presión ejercido sobre el objetivo, moviéndose desde la conformidad (tendencia a cambiar el comportamiento para ser consistente con las normas de un grupo), pasando por el cumplimiento (cambios producidos por peticiones directas), hasta la obediencia (cambio de conducta producido por las órdenes de una autoridad).\n• Influencia \"automática\": En ocasiones, los seres humanos son vulnerables a influencias sutiles que ocurren sin que se den cuenta, como la imitación espontánea de gestos o estados de ánimo de otros (efecto camaleón), lo cual facilita las interacciones sociales.\n• Perspectiva tradicional vs. moderna: Tradicionalmente, se estudió como un proceso asimétrico donde una mayoría imponía una visión uniforme sobre un individuo para lograr su adaptación. No obstante, planteamientos posteriores, como los de Moscovici, la definen como un proceso simétrico de interacción que incluye la acción y reacción tanto de la fuente como del blanco, permitiendo que incluso las minorías activas generen innovación y cambio social al introducir nuevas ideas o modificar actitudes tradicionales.\n• Persuasión: Es una forma específica de influencia social que busca el cambio de actitudes mediante la transmisión de mensajes elaborados. Su eficacia depende de la interacción entre la fuente (credibilidad, atractivo), el contenido del mensaje y las características del receptor.En resumen, la influencia social es un proceso de interacción fundamental para comprender la formación y reorganización de las actitudes, así como el funcionamiento de la propaganda y la oposición pública en la sociedad. Se basa en la sensibilidad de los individuos a las fuerzas del grupo y a las calidades estructurales de la oposición social, destacándose factores como la unanimidad y el apoyo social como fuentes determinantes de poder.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Modelos de análisis de la influencia social: genético y funcionalista.", "desarrollo": "Los modelos de análisis de la influencia social han evolucionado significativamente, pasando de una visión centrada en el control social a una que contempla el cambio y la innovación. Esta transición se articula principalmente a través de dos modelos: el funcionalista y el genético (o interaccionista), propuestos por Serge Moscovici.1. El Modelo FuncionalistaEste modelo dominó la psicología social tradicional y se fundamenta en la idea de que la influencia social tiene como fin último el control social y la adaptación del individuo al grupo.\n• Visión del sistema social: Considera los sistemas sociales como datos preestablecidos y acabados. En este marco, el cambio solo es aceptable si ayuda al sistema a recuperar su equilibrio o estabilidad.\n• Asimetría de la influencia: La influencia se ejerce en una sola dirección: de la mayoría (o de quienes poseen el poder y el estatus) hacia la minoría o el individuo. Se asume que quienes están en una posición inferior deben adaptarse a las normas de la mayoría para ser funcionales.\n• Dependencia y Poder: El factor principal de la influencia es la dependencia. El grupo mayoritario impone una visión uniforme de la realidad, y el individuo se conforma para evitar el rechazo o la desviación.\n• Procesos principales: Se centra en el estudio del conformismo y la normalización, donde la minoría es vista como un elemento \"desviado\" que debe ser integrado o corregido.2. El Modelo Genético (o Interaccionista)Propuesto por Moscovici en la década de 1970, este modelo rompe con la visión tradicional al enfocarse en la innovación y el cambio social iniciados por minorías activas.\n• Visión del sistema social: Los sistemas sociales no son absolutos ni estáticos, sino que resultan de la confrontación y la negociación constante entre diferentes agentes sociales.\n• Simetría de la influencia: La influencia se define como un proceso simétrico de interacción. Esto implica que todo miembro del grupo, independientemente de su posición, es simultáneamente emisor y receptor potencial de influencia.\n• Estilo de comportamiento: A diferencia del modelo funcionalista, el éxito de la influencia no depende del poder o la fuerza numérica, sino de la consistencia y el estilo de comportamiento adoptado por la fuente. Una minoría que mantiene una postura firme, coherente y decidida puede generar conflicto y obligar a la mayoría a reevaluar sus propios juicios.\n• Proceso de Conversión: Mientras que la mayoría suele lograr un conformismo público e inmediato, la minoría tiende a producir una conversión. Este es un cambio profundo, privado y a menudo latente o postergado, que transforma la estructura de respuesta del individuo frente a la realidad.\n\nComparación de Efectos\nInfluencia Mayoritaria (Funcionalista)\nObjetivo: Adaptación y equilibrio social\nNaturaleza: Asimétrica (Mayoría → Individuo)\nBase del éxito: Poder, estatus y dependencia\nResultado: Conformismo (público y manifiesto)\n\nInfluencia Minoritaria (Genética)\nObjetivo: Innovación y cambio social\nNaturaleza: Simétrica (Interacción mutua)\nBase del éxito: Estilo de comportamiento y consistencia\nResultado: Conversión (privada y latente)\n\nEl paso del modelo funcionalista al genético permitió a la psicología social entender que el cambio social no es solo un error del sistema, sino un proceso activo donde las minorías, mediante el conflicto y la negociación, logran transformar las normas establecidas.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "La influencia social como un continuum de presión social.", "desarrollo": "La influencia social no se manifiesta como una serie de procesos aislados, sino como un continuo de presión social que varía según el grado de fuerza que se ejerce sobre el individuo. En este espectro, las personas pueden oscilar entre rendirse a la influencia o resistirse a ella, dependiendo de si la presión es implícita o explícita.Este continuo se divide principalmente en tres formas de influencia, cada una con su contraparte en términos de resistencia:1. Conformidad (Presión Implícita)Se sitúa en el nivel de menor presión directa. Es la tendencia de los individuos a modificar sus percepciones, opiniones y conductas para que sean consistentes con las normas de un grupo.\n• Naturaleza: La presión suele ser implícita; no hay una orden o petición directa, sino una necesidad del individuo de ser aceptado o de tener la razón (influencia normativa e informativa).\n• Resistencia: La contraparte es la independencia, donde el sujeto mantiene sus propias convicciones a pesar de las presiones del grupo.2. Cumplimiento (Presión Directa)Representa un nivel intermedio en el continuo. Ocurre cuando se producen cambios en el comportamiento a raíz de peticiones directas.\n• Naturaleza: A diferencia de la conformidad, aquí la presión es explícita. Se utilizan diversas estrategias (como la técnica del \"pie en la puerta\" o la \"puerta en la cara\") para lograr que el blanco acceda a un favor o propuesta.\n• Resistencia: Se manifiesta a través de la asertividad, que es la capacidad de las personas para mantenerse firmes y decir que no ante las peticiones de los demás.3. Obediencia (Presión de Autoridad)Se ubica en el extremo de mayor presión social. Se define como el cambio de comportamiento producido por las órdenes directas de una autoridad.\n• Naturaleza: Es la forma más poderosa de influencia. Como demostraron los estudios de Milgram, los individuos pueden llegar a actuar en contra de su propia conciencia bajo la presión de una figura de autoridad legítima o percibida.\n• Resistencia: La respuesta en este nivel es la rebeldía o el desafío, donde el individuo se niega a cumplir órdenes que considera injustas o inmorales, rompiendo con la jerarquía establecida.Factores que Determinan el ImpactoSegún la teoría del impacto social, la influencia total ejercida en este continuo depende de tres variables críticas relacionadas con la fuente de presión:\n• Fuerza: Determinada por el estatus, la capacidad o la relación de la fuente con el objetivo (ej. una autoridad tiene más fuerza que un par).\n• Inmediatez: La proximidad física y temporal de la fuente con respecto al individuo; cuanto más cerca está la fuente, mayor es su impacto.\n• Número: El impacto aumenta a medida que crece el número de fuentes de influencia, aunque este efecto tiende a estabilizarse después de cierto punto.En conclusión, este continuo revela que la conducta humana no es puramente maleable ni totalmente inflexible, sino que responde a un equilibrio dinámico entre las fuerzas externas de presión y la capacidad individual de resistencia.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Conformidad: Los estudios de Sheriff y de Asch, la influencia informativa y normativa.", "desarrollo": "La conformidad se define como la tendencia de las personas a cambiar sus percepciones, opiniones y conductas de manera que sean consistentes con las normas de un grupo. Los estudios clásicos de Muzafer Sherif y Solomon Asch son fundamentales para entender este proceso, ya que ilustran cómo la presión grupal afecta al individuo en diferentes niveles de ambigüedad de la realidad.1. El estudio de Muzafer Sherif (1936): La formación de normasSherif analizó cómo se desarrollan las normas en grupos pequeños utilizando una tarea perceptiva ambigua basada en el efecto autocinético (una ilusión óptica donde un punto luminoso inmóvil en una habitación oscura parece moverse).\n• Metodología: Los participantes primero juzgaron el movimiento de la luz estando solos. Sus estimaciones iniciales variaron considerablemente entre sí. Posteriormente, se integraron en grupos de tres donde cada uno anunciaba su juicio en voz alta.\n• Resultados: Al interactuar, las estimaciones individuales convergieron gradualmente hasta establecer una norma grupal común. Incluso cuando volvieron a realizar la tarea solos días después, mantuvieron la norma establecida por el grupo.\n• Conclusión: Ante una realidad física ambigua e inestable, los individuos utilizan a los demás como fuente de información para construir un marco de referencia.2. El estudio de Solomon Asch (1951): Presión de grupoA diferencia de Sherif, Asch diseñó una tarea donde la realidad física era clara y sin ambigüedades, para observar si la gente se conformaría incluso cuando el grupo estaba evidentemente equivocado.\n• Metodología: Colocó a un \"sujeto crítico\" en un grupo de cómplices (generalmente 7 u 8 personas) que habían sido instruidos para dar respuestas incorrectas y unánimes en 12 de las 18 pruebas de comparación de longitud de líneas.\n• Resultados: A pesar de que la respuesta correcta era obvia, los sujetos críticos estuvieron de acuerdo con la mayoría incorrecta en aproximadamente un 37% de las ocasiones. El 75% de los participantes se conformó al menos una vez.\n• Conclusión: Las personas pueden actuar en contra de la evidencia de sus propios sentidos debido al impulso de no parecer distintos o \"defectuosos\" ante los ojos de la mayoría.3. Influencia Informativa vs. NormativaA partir de estos estudios, los psicólogos distinguen dos razones principales por las que la gente se conforma:\n• Influencia Informativa: Ocurre cuando una persona considera que los juicios de los demás son correctos y los adopta porque tiene el deseo de estar en lo cierto.\n    ◦ Estudio asociado: Sherif (situación ambigua).\n    ◦ Efecto: Produce una conformidad privada (o conversión), donde el individuo cambia realmente sus creencias internas de forma duradera.\n• Influencia Normativa: Ocurre cuando el individuo se conforma por el temor a las consecuencias sociales negativas de parecer desviado (como el rechazo o el ridículo).\n    ◦ Estudio asociado: Asch (situación clara).\n    ◦ Efecto: Produce una conformidad pública (o cumplimiento), un cambio superficial de conducta sin una modificación real de las opiniones privadas.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Diferentes tipos de conformidad: pública y privada. Las tácticas de influencia social.", "desarrollo": "La conformidad se manifiesta a través de dos niveles distintos de profundidad, dependiendo de si el cambio en el individuo es interno o puramente externo: la conformidad privada y la conformidad pública.Conformidad Pública y PrivadaEstos dos tipos de conformidad se derivan de dos fuentes de influencia social: la informativa y la normativa.\n• Conformidad Privada (Conversión): Ocurre cuando un individuo cambia sus creencias internas y llega a estar verdaderamente convencido de que los demás tienen la razón. Este fenómeno suele asociarse con la influencia informativa, donde el deseo de estar en lo cierto lleva a una aceptación profunda y duradera de la postura ajena. Los estudios de Sherif sobre la formación de normas en situaciones ambiguas ilustran este cambio, ya que los participantes mantenían la norma grupal incluso cuando volvían a estar solos.\n• Conformidad Pública (Cumplimiento): Es un cambio superficial de conducta, donde la persona asiente ante el grupo para congraciarse o evitar el rechazo social, pero mantiene en secreto sus opiniones originales. Este tipo de conformidad es impulsado por la influencia normativa y el temor a las consecuencias negativas de parecer \"desviado\". En los experimentos de Asch, por ejemplo, la conformidad de los sujetos disminuía drásticamente cuando se les permitía escribir sus respuestas en privado en lugar de decirlas en voz alta, demostrando que su cambio era meramente externo.Tácticas de Influencia Social (Cumplimiento)Más allá de las normas grupales implícitas, existen estrategias específicas para lograr el cumplimiento, definido como los cambios conductuales producidos por peticiones directas. Los expertos en influencia utilizan diversas tácticas de peticiones secuenciales que funcionan como \"trampas\" psicológicas:\n• Técnica del pie en la puerta: Consiste en empezar con una petición muy pequeña a la que la persona no pueda negarse, para luego realizar la petición real, mucho más grande. Su eficacia se basa en la autopercepción: la persona llega a verse a sí misma como alguien cooperativo y desea mantener esa imagen siendo consistente con la segunda solicitud.\n• Técnica del amago (bola baja): El persuasor asegura un acuerdo con una petición, pero luego revela costos ocultos que incrementan el tamaño de la misma. Una vez que el individuo ha tomado una decisión y se ha comprometido mentalmente con ella, es mucho más difícil que se eche atrás, a pesar de las nuevas condiciones desfavorables.\n• Técnica de la puerta en la cara: Se inicia con una solicitud inicial desmesurada que seguramente será rechazada, para luego proseguir con una petición más modesta que parece una concesión. Esta táctica se apoya en la norma de reciprocidad, que nos impulsa a responder con otra concesión ante quien parece haber cedido por nosotros.\n• Técnica de \"eso no es todo\": El persuasor comienza con una petición grande, pero antes de recibir una respuesta, reduce su tamaño ofreciendo un descuento o una bonificación adicional. Al igual que la anterior, esta técnica utiliza el contraste perceptivo para que la oferta final parezca mucho más atractiva de lo que realmente es.Además de estas tácticas, la norma de reciprocidad actúa como una regla fundamental del comportamiento social, obligándonos a retribuir los favores que otros nos han hecho, lo cual puede ser explotado para generar un sentimiento de deuda en el blanco de influencia.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Persuasión: principales modelos de análisis, características de la fuente, el mensaje y el receptor.", "desarrollo": "La persuasión se define como la principal forma de cambiar las actitudes a través de la comunicación, donde un emisor transmite un mensaje relativamente elaborado a un grupo de personas con el fin de que realicen determinadas conductas o abandonen otras.1. Principales modelos de análisisLa psicología social ha desarrollado diversos enfoques para comprender este proceso:\n• Grupo de la Universidad de Yale: Pionero en el estudio sistemático de la persuasión, propone que para cambiar la conducta es necesario cambiar previamente los pensamientos o creencias, lo cual ocurre si el receptor recibe incentivos que acompañen al mensaje. El proceso se divide en cuatro etapas críticas: atención, comprensión, aceptación y retención.\n• Teoría de la respuesta cognitiva: Postula que el receptor no es persuadido directamente por la fuente, sino por sus propias respuestas cognitivas (mensajes autogenerados) que surgen al comparar lo que dice la fuente con sus conocimientos y actitudes previas.\n• Modelo Heurístico: Sostiene que muchas veces somos persuadidos sin un análisis profundo, dejándonos llevar por reglas de decisión aprendidas (heurísticos), como \"se puede confiar en los expertos\" o \"a la gente parecida le gustan cosas semejantes\".\n• Modelo de la Probabilidad de Elaboración (ELM): Integra los enfoques anteriores al proponer que existen dos estrategias o rutas para procesar un mensaje:\n    ◦ Ruta Central: Análisis crítico y exhaustivo de los argumentos. Ocurre cuando hay alta motivación y capacidad. El cambio resultante es más duradero y resistente.\n    ◦ Ruta Periférica: Cambio de actitud basado en elementos externos (atractivo de la fuente, número de argumentos) sin un procesamiento profundo del contenido. Se utiliza cuando la motivación o capacidad son bajas.2. Características de la Fuente persuasivaLa eficacia de la fuente depende fundamentalmente de dos rasgos principales:\n• Credibilidad: Basada en la competencia percibida (educación, ocupación, fluidez) y la sinceridad (falta de afán de lucro o hablar en contra de su propio interés). La importancia de la credibilidad disminuye a medida que aumenta la implicación del receptor en el tema.\n• Atractivo: Facilita que se preste atención al mensaje y puede generar un proceso de identificación, además de asociarse erróneamente con la honestidad (efecto halo).\n• Poder: Capacidad de la fuente para administrar recompensas y castigos. Su influencia suele generar cambios manifiestos o aparentes, pero no necesariamente internos.\n• Semejanza: La pertenencia al mismo grupo social o la semejanza de actitudes aumentan la atracción y la capacidad de influencia.3. El MensajeEl contenido y la forma del mensaje son determinantes para el éxito persuasivo:\n• Racionales vs. Emotivos: Los mensajes racionales (evidencia) funcionan mejor con actitudes basadas en la cognición, mientras que los emotivos (afecto) son más eficaces para actitudes basadas en el afecto.\n• Miedo y amenaza: Son eficaces si el mensaje provoca temor, pero sobre todo si asegura que las consecuencias negativas ocurrirán si no se siguen las recomendaciones y si el receptor se siente con la auto-eficacia necesaria para adoptar la solución.\n• Unilaterales o bilaterales: Los mensajes bilaterales (que incluyen y rebaten la posición contraria) son generalmente más efectivos, especialmente con audiencias instruidas o familiarizadas con el tema.\n• Calidad y cantidad: Si el receptor usa la ruta periférica, la cantidad de argumentos prima; si usa la ruta central, la calidad es decisiva (añadir argumentos débiles puede ser perjudicial).\n• Información estadística vs. ejemplos: Los ejemplos vivos y detallados suelen tener un impacto mayor que los promedios o estadísticas.\n• Efectos de orden: Existe el efecto primacía (mayor influencia de lo primero) cuando los mensajes son seguidos y la medición se demora, y el efecto recencia (influencia de lo último) cuando hay pausa entre mensajes y la medición es inmediata.4. El ReceptorLas características del destinatario modulan el impacto de la comunicación:\n• Modelo de McGuire: La persuasión es el resultado de la recepción (atención/comprensión) y la aceptación. Factores como la inteligencia pueden aumentar la recepción pero disminuir la aceptación, ya que el sujeto tiene más capacidad para rebatir los argumentos.\n• Autoestima: Existe una relación curvilínea; las personas con niveles moderados de autoestima suelen ser las más fáciles de persuadir.\n• Grado de implicación: A mayor relevancia personal del tema, el receptor tenderá a procesar el mensaje por la ruta central, fijándose más en la calidad de los argumentos que en señales periféricas como el prestigio de la fuente.\n• Discrepancia: La eficacia es mayor cuando existe una discrepancia moderada entre la posición del mensaje y la del receptor. Si la discrepancia es extrema, el mensaje suele ser rechazado.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "El experimento de Milgram y la obediencia a la autoridad, características del experimento, sus variaciones experimentales.", "desarrollo": "El experimento de Stanley Milgram sobre la obediencia a la autoridad, realizado inicialmente en la Universidad de Yale, es uno de los estudios más significativos y polémicos de la psicología social. Su objetivo era investigar hasta qué punto un individuo común es capaz de infligir dolor a otra persona simplemente porque se lo ordena una autoridad.Características del experimentoEl diseño experimental se presentaba falsamente como un estudio sobre los efectos del \"refuerzo negativo\" en la memoria y el aprendizaje.\n• Participantes: En cada sesión participaban dos personas: el sujeto real (denominado \"profesor\") y un cómplice del investigador (el \"alumno\" o víctima).\n• Procedimiento: El \"alumno\" era atado a una silla con electrodos en otra habitación. El \"profesor\" se sentaba frente a un generador de descargas eléctricas con 30 interruptores que iban desde los 15 voltios hasta los 450 voltios.\n• La tarea: El profesor debía leer pares de palabras; cada vez que el alumno cometía un error, el profesor debía administrarle una descarga, aumentando el nivel de voltaje con cada fallo sucesivo.\n• El conflicto: A medida que las descargas aumentaban, el alumno (que en realidad no recibía corriente) fingía malestar creciente: a los 120 voltios se quejaba verbalmente, a los 150 exigía que lo liberaran y a los 285 emitía gritos de agonía.\n• Las órdenes: Si el sujeto dudaba, el experimentador utilizaba frases estandarizadas como: \"Por favor, continúe\", \"El experimento requiere que usted prosiga\" o \"No tiene otra elección, tiene que seguir adelante\".Hallazgos fundamentalesLos resultados fueron sorprendentes para la época: a pesar del evidente sufrimiento de la víctima, una gran parte de los sujetos continuó administrando descargas hasta el nivel máximo de 450 voltios. Cerca de las dos terceras partes de los participantes cayeron en la categoría de \"obedientes\".Milgram concluyó que la esencia de la obediencia radica en un proceso de despersonalización y desplazamiento de la responsabilidad:\n• Estado de agente: El individuo deja de verse a sí mismo como responsable de sus actos y se percibe como un mero agente de la autoridad legítima.\n• Absorción técnica: El sujeto se concentra tanto en la ejecución técnica de la tarea (leer bien las palabras, mover los interruptores con cuidado) que pierde de vista las consecuencias morales de su acción.\n• Desvalorización de la víctima: Muchos sujetos justificaron su conducta criticando a la víctima, afirmando que era \"tan estúpida\" que merecía el castigo por sus errores.Variaciones experimentalesEl estudio se repitió con miles de personas y en diversas universidades, introduciendo variaciones para observar qué factores afectaban la obediencia. Una variación notable mencionada en las fuentes es la siguiente:\n• Fragmentación de la acción: En esta condición, el sujeto ingenuo no accionaba directamente el interruptor de descarga, sino que desempeñaba un papel subsidiario, como girar una llave maestra antes de que otro \"profesor\" (cómplice) emitiera el shock.\n• Resultado de la variación: En esta situación de \"cadena de mando\", la obediencia aumentó drásticamente: 37 de cada 40 adultos llegaron hasta el nivel más elevado. Esto demuestra que es psicológicamente más fácil ignorar la responsabilidad cuando uno se encuentra lejos de las consecuencias finales de la acción y la tarea está fragmentada.Este experimento refuerza la idea de la \"banalidad del mal\" (concepto de Hannah Arendt), sugiriendo que personas comunes, sin hostilidad particular, pueden convertirse en agentes de un proceso destructivo bajo la presión de una estructura burocrática o de autoridad.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Razones por las que la gente obedece.", "desarrollo": "La obediencia a la autoridad no suele ser producto de una personalidad malvada, sino de una serie de procesos psicológicos y situacionales que Stanley Milgram identificó en sus investigaciones:\n• Factores encadenantes: Existen elementos que \"atan\" al sujeto a la situación, como la cortesía, el deseo de cumplir con la promesa inicial de ayudar y el embarazo o temor que genera el retirarse de una obligación contraída.\n• Estado de agente: El individuo experimenta un ajuste mental donde deja de verse como responsable de sus actos para percibirse como un instrumento de la autoridad legítima. En este estado, el sujeto siente que \"cumple con su deber\", desplazando toda la iniciativa y responsabilidad al experimentador.\n• Absorción en el rol técnico: El sujeto se concentra tanto en realizar la tarea de manera competente y eficiente (leer bien las palabras, mover los interruptores con precisión) que pierde de vista las consecuencias morales de su acción.\n• Contra-antropomorfismo: Se atribuye una cualidad impersonal a instituciones humanas, viendo al \"experimento\" o a la \"autoridad\" como una fuerza que trasciende el deseo humano y que debe seguir su curso independientemente del sufrimiento causado.\n• Fragmentación de la acción: Es psicológicamente más fácil ignorar la responsabilidad cuando el individuo es solo un eslabón subsidiario en una cadena de mando; al no ser quien acciona directamente el castigo final, el sentido de responsabilidad se evapora.\n• Desvalorización de la víctima: Los sujetos a menudo desvalorizan severamente a la víctima tras haber actuado contra ella, viéndola como \"estúpida\" o \"indigna\" para justificar psicológicamente el trato brutal.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "La influencia de las minorías.\nDefinición de minorías activas.", "desarrollo": "A diferencia de la mayoría, que suele basar su poder en el número y busca la adaptación del individuo, las minorías actúan como agentes de innovación y cambio social.\n• Definición de minorías activas: Se considera minoría activa a cualquier persona o subgrupo que defienda una posición diferente de la generalmente admitida, aunque carezca de fuerza numérica, poder o competencia para imponer su punto de vista. Para ejercer influencia, deben ser reconocidas por la mayoría y poseer una alta motivación para hacerse visibles.\n• Proceso de Conversión: Mientras que la mayoría logra un \"conformismo\" (cambio público y superficial), la minoría busca la conversión, que es un cambio privado, profundo y a menudo latente. Este efecto suele ser postergado; el individuo puede oponerse inicialmente a la minoría, pero con el tiempo ocurre una transformación profunda de su estructura de respuesta.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Características del estilo de comportamiento de la minoría.", "desarrollo": "El éxito de una minoría no depende de la dependencia o el poder, sino de su estilo de comportamiento al expresar su punto de vista. Según Moscovici, un estilo consistente atrae la atención y es un paso necesario para la influencia.\n1. Consistencia: Es la característica fundamental y se divide en dos tipos:\n    ◦ Sincrónica (unanimidad): Todos los miembros de la minoría expresan la misma postura en un momento dado.\n    ◦ Diacrónica (repetición): El grupo mantiene su posición de manera firme y constante a través de las diversas situaciones y el tiempo.\n2. Autonomía: El comportamiento debe ser percibido como independiente de presiones externas, demostrando que la minoría actúa por convicción y principios.\n3. Firmeza y Confianza: La minoría debe mostrar seguridad en la validez de sus argumentos, lo que obliga a la mayoría a sentarse, prestar atención y reflexionar sobre sus propias posturas.\n4. Flexibilidad: Aunque debe ser firme en sus convicciones, no debe ser percibida como rígida o dogmática; la capacidad de negociar o mostrar flexibilidad en la interacción puede facilitar que la mayoría acepte la innovación.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Modelo de Hollander y los créditos idiosincráticos.", "desarrollo": "El modelo de Hollander (1958), también conocido como la teoría del crédito idiosincrásico, propone una estrategia de influencia social distinta a la de la consistencia minoritaria, centrada en cómo los individuos pueden alcanzar posiciones de liderazgo o desafiar las normas de un grupo sin ser ignorados,.A continuación, se desarrollan sus conceptos fundamentales:1. Definición de Créditos IdiosincráticosLos créditos idiosincráticos son definidos como \"créditos\" interpersonales o \"puntos ganados\" que un individuo obtiene al observar y seguir fielmente las normas de un grupo,. Funcionan como una reserva de buena voluntad y confianza que el grupo deposita en el sujeto.2. El proceso de influencia: \"Primero conformarse, luego disentir\"A diferencia de los modelos que sugieren que una minoría debe ser consistente y firme desde el inicio para influir, Hollander sugiere un enfoque secuencial:\n• Fase de Conformidad Inicial: Para ganar influencia en una mayoría, las personas deben primero conformarse escrupulosamente a las normas vigentes,. Esto permite al individuo demostrar que es un miembro competente y de pleno derecho, lo que le asegura una posición de estatus o liderazgo dentro del grupo,.\n• Acumulación de Créditos: A medida que el individuo actúa de acuerdo con la corriente dominante, va acumulando estos créditos idiosincráticos.\n• Fase de Innovación: Una vez que el sujeto ha acumulado suficiente crédito, cuenta con un \"excedente\" que le permite introducir elementos nuevos, desviarse de las normas o proponer cambios sin perder su estatus,. En este punto, el grupo se vuelve tolerante hacia su disidencia debido a la confianza ganada previamente.3. Diferencias con otros modelosEl modelo de Hollander se distingue principalmente del enfoque de consistencia de Moscovici:\n• Moscovici: Sostiene que las minorías obtienen influencia mediante un estilo de comportamiento firme, persistente y consistente desde el principio para desafiar la norma.\n• Hollander: Advierte que desafiar a un grupo sin ser aceptado primero conlleva el riesgo de que las opiniones del disidente sean simplemente ignoradas. Su modelo describe una innovación que ocurre \"desde arriba\", facilitada por la posición de liderazgo alcanzada mediante la conformidad previa.En resumen, para Hollander, la clave de la influencia social efectiva radica en una integración previa exitosa; la conformidad inicial es el \"pago\" necesario para obtener el derecho posterior a la innovación y al cambio social dentro del sistema,.", "status": "Not started"}, {"unidad": "UNIDAD 6. Influencia social", "tema": "Mecanismos de resistencia e innovación.", "desarrollo": "Los procesos de innovación y los mecanismos de resistencia son elementos centrales en la dinámica de la influencia social, particularmente cuando se analiza cómo las minorías logran introducir cambios frente a una mayoría que intenta mantener el statu quo.1. La Innovación como proceso de cambioLa innovación se define como un proceso de influencia social cuyo motor es generalmente una minoría activa que se esfuerza por crear o introducir nuevas ideas y formas de comportamiento, o bien por modificar actitudes y modos de pensar tradicionales. A diferencia del conformismo, que busca la adaptación al sistema, la innovación parte de la desviación y busca transformar la realidad social.El resultado característico de la innovación es la conversión, un cambio que ocurre principalmente a nivel privado, latente y mediato. Esto implica que, aunque el individuo no asienta públicamente ante la minoría para evitar ser visto como \"diferente\", experimenta una transformación profunda en su estructura de respuesta ante el objeto de juicio.2. Mecanismos de resistencia de la mayoríaFrente a la amenaza que supone la ruptura del consenso por parte de una minoría, la mayoría despliega estrategias de resistencia para desprestigiar a la fuente y recuperar el dominio de la situación:\n• Psicologización: Consiste en explicar el discurso conflictivo de la minoría atribuyéndole características psicológicas negativas o patológicas a sus miembros. Por ejemplo, se ha utilizado históricamente para invalidar al feminismo etiquetando a sus integrantes como \"frustradas\", \"locas\" o \"resentidas\". Este mecanismo desvía la atención del mensaje ideológico hacia las supuestas taras personales de la fuente, negando la objetividad y el realismo de sus propuestas.\n• Denegación: A diferencia de la psicologización, esta estrategia se enfoca en el contenido del mensaje. Se basa en negarle cualquier verosimilitud a las afirmaciones de la minoría, calificándolas de \"irrazonables\", \"utópicas\" o \"contrarias al sentido común\". Aunque disminuye la influencia inmediata, a largo plazo puede terminar reforzando la influencia de la minoría al mantener el conflicto vivo.3. Mecanismos de resistencia del receptor (Persuasión)Desde la psicología de la persuasión, se identifican procesos que permiten a los individuos resistirse a los mensajes que intentan cambiar sus actitudes:\n• Teoría de la inoculación: Propone que la exposición previa de una persona a formas debilitadas de argumentos contrarios a su posición estimula sus defensas y la hace más resistente a ataques persuasivos futuros.\n• Distracción: Los elementos distractores pueden interferir con el aprendizaje de los argumentos de un mensaje, reduciendo su impacto. Sin embargo, si el mensaje es fácil de rebatir, la distracción puede aumentar la persuasión al impedir que el receptor genere contraargumentos.\n• Prevención: El simple hecho de advertir al receptor que se le intentará persuadir incrementa su resistencia, ya que lo motiva a elaborar contraargumentos de forma anticipada.4. Factores que favorecen el éxito de la innovaciónPara que una minoría venza la resistencia y logre innovar, debe manejar estratégicamente su comportamiento:\n• Consistencia: Es el factor de éxito más crítico. La minoría debe ser consistente diacrónicamente (mantener su mensaje a través del tiempo) y sincrónicamente (unanimidad total entre sus miembros). La repetición constante atrae la atención y obliga a la mayoría a reflexionar sobre sus propias posturas.\n• Créditos idiosincráticos: Según el modelo de Hollander, una forma de innovar \"desde adentro\" es conformarse primero a las normas grupales para ganar estatus y confianza (créditos). Una vez acumulada esta \"buena voluntad\", el líder o miembro destacado tiene más libertad para desviarse de la norma y proponer cambios sin ser rechazado.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Determinación social central y lateral.", "desarrollo": "En la teoría de las representaciones sociales, se distinguen dos formas fundamentales de determinación social que inciden en su formación y naturaleza: la central y la lateral. Estas formas explican cómo las estructuras macro de la sociedad y las dinámicas particulares de los grupos moldean el conocimiento de sentido común.A continuación se desarrollan ambos conceptos:1. Determinación social centralEsta forma de determinación se refiere a la influencia de las condiciones socioeconómicas e históricas de la sociedad global sobre la representación. Sus características principales son:\n• Contexto macro: Relaciona globalmente los factores económicos y sociales con el estado de la representación social.\n• Impacto en la evolución: Define las posibilidades de extensión, evolución e interacción de una representación en un momento dado, aunque no necesariamente determina su organización interna completa.\n• Condicionamiento de la información: El contenido de la representación varía según el nivel sociocultural y económico del grupo, lo que condiciona la cantidad y calidad de la información a la que tienen acceso sus miembros.\n• Vínculo con el control social: Esta determinación central adquiere mayor peso en contextos caracterizados por un alto grado de totalitarismo e inmovilidad social.2. Determinación social lateralA diferencia de la anterior, la determinación lateral reconoce que la representación no es solo un producto de la sociedad global, sino que el colectivo particular y el individuo singular imprimen en ella sus propias huellas. Se destaca por:\n• Heterogeneidad y dinamismo: Las representaciones no son uniformes, sino totalidades dinámicas y heterogéneas en su contenido y estilo, reflejando el estado específico de la colectividad que las produce.\n• Autonomía grupal e individual: Reconoce un espacio de autonomía para los grupos dentro del sistema social y para los individuos dentro de sus grupos de pertenencia. Al representarse un objeto, el sujeto no solo construye dicho objeto, sino que también se construye y unifica a sí mismo dentro de su historia.\n• Vínculo con la libertad social: Esta determinación cobra mayor relevancia a medida que aumenta el grado de democracia y la movilidad dentro de una sociedad.Relación entre ambas determinacionesLa relación entre la determinación central y la lateral es de naturaleza dinámica y dialéctica. Mientras que la determinación central establece los marcos generales y las limitaciones impuestas por la estructura social y económica global, la lateral permite la adaptación, la diversificación y la expresión de la identidad propia de los grupos y sujetos, permitiendo que las representaciones sociales sean herramientas versátiles para interpretar la realidad cotidiana.", "status": "Not started"}];

// Normalize text for rendering
function formatDesarrollo(text) {
  if (!text) return '';
  // Split into lines, detect bullet lines (starts with •, ◦, or "    ◦")
  const lines = text.split('\n');
  let html = '';
  for (let line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    if (trimmed.startsWith('•') || trimmed.startsWith('◦')) {
      const content = trimmed.replace(/^[•◦]\s*/, '');
      html += `<div class="bullet">${escHtml(content)}</div>`;
    } else {
      html += `<p>${escHtml(trimmed)}</p>`;
    }
  }
  return html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Build data structure
const UNITS = [];
const unitMap = {};
RAW.forEach((item, idx) => {
  item.id = idx;
  if (!unitMap[item.unidad]) {
    unitMap[item.unidad] = { name: item.unidad, items: [] };
    UNITS.push(unitMap[item.unidad]);
  }
  unitMap[item.unidad].items.push(item);
});

// State: persisted in localStorage
const STORAGE_KEY = 'ps_temario_v2';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) {}

function getStatus(id) { return state[id] || 'pending'; }
function setStatus(id, val) { state[id] = val; localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

// Active unit index
let activeUnit = 0;
let searchQuery = '';

// Build tabs
function buildTabs() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = '';
  UNITS.forEach((u, i) => {
    const shortName = u.name.replace(/UNIDAD \d+\.\s*/i, '').replace('Actitudes prejuicio y discriminación', 'Actitudes').replace('Representaciones sociales', 'Representaciones').replace('Influencia social', 'Influencia').replace('Identidad y socialización', 'Identidad');
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === activeUnit ? ' active' : '');
    btn.textContent = 'U' + (i+3) + '. ' + shortName;
    btn.addEventListener('click', () => {
      activeUnit = i;
      searchQuery = '';
      document.getElementById('search').value = '';
      render();
    });
    bar.appendChild(btn);
  });
}

// Render content
function render() {
  buildTabs();
  const main = document.getElementById('main');
  // Remove old unit sections
  main.querySelectorAll('.unit-section').forEach(el => el.remove());
  const emptyMsg = document.getElementById('empty-msg');

  const query = searchQuery.trim().toLowerCase();
  let totalVisible = 0;

  UNITS.forEach((unit, ui) => {
    if (!query && ui !== activeUnit) return;

    const sec = document.createElement('div');
    sec.className = 'unit-section visible';

    if (query) {
      const label = document.createElement('div');
      label.className = 'unit-title';
      label.textContent = unit.name;
      sec.appendChild(label);
    }

    let unitVisible = 0;
    unit.items.forEach(item => {
      if (query && !item.tema.toLowerCase().includes(query) && !item.desarrollo.toLowerCase().includes(query)) return;
      unitVisible++;
      totalVisible++;
      sec.appendChild(buildCard(item, query));
    });

    if (unitVisible > 0) main.appendChild(sec);
  });

  emptyMsg.classList.toggle('visible', totalVisible === 0 && !!query);
  updateProgress();
}

function buildCard(item, query) {
  const status = getStatus(item.id);
  const card = document.createElement('div');
  card.className = 'card' + (status === 'done' ? ' done' : '') + (status === 'in-progress' ? ' in-progress' : '');
  card.dataset.id = item.id;

  const temaText = query ? highlight(item.tema, query) : escHtml(item.tema);

  card.innerHTML = `
    <div class="card-header">
      <button class="status-btn ${status === 'done' ? 'done' : status === 'in-progress' ? 'in-progress' : ''}" data-id="${item.id}" title="Cambiar estado">
        ${status === 'done' ? '<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
        ${status === 'in-progress' ? '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="3" height="8" rx="1" fill="white"/><rect x="6" y="1" width="3" height="8" rx="1" fill="white"/></svg>' : ''}
      </button>
      <div class="card-tema">${temaText}</div>
      <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    ${item.desarrollo ? `<div class="desarrollo">
      <div class="desarrollo-text">${query ? highlightHtml(formatDesarrollo(item.desarrollo), query) : formatDesarrollo(item.desarrollo)}</div>
      <div class="status-row">
        <button class="status-pill pill-pending" data-id="${item.id}" data-val="pending">Pendiente</button>
        <button class="status-pill pill-progress" data-id="${item.id}" data-val="in-progress">En progreso</button>
        <button class="status-pill pill-done" data-id="${item.id}" data-val="done">Estudiado ✓</button>
      </div>
    </div>` : ''}
  `;

  // Toggle open/close
  card.querySelector('.card-header').addEventListener('click', (e) => {
    if (e.target.closest('.status-btn')) return;
    card.classList.toggle('open');
  });

  // Status button (cycle)
  card.querySelector('.status-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const id = parseInt(e.currentTarget.dataset.id);
    const cur = getStatus(id);
    const next = cur === 'pending' ? 'in-progress' : cur === 'in-progress' ? 'done' : 'pending';
    setStatus(id, next);
    render();
  });

  // Status pills
  card.querySelectorAll('.status-pill').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.id);
      setStatus(id, btn.dataset.val);
      render();
    });
  });

  return card;
}

function highlight(text, query) {
  const escaped = escHtml(text);
  const re = new RegExp('(' + regEscape(query) + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function highlightHtml(html, query) {
  // Only highlight in text nodes (between tags)
  const re = new RegExp('(' + regEscape(query) + ')', 'gi');
  return html.replace(/>([^<]+)</g, (m, p1) => '>' + p1.replace(re, '<mark>$1</mark>') + '<');
}

function regEscape(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function updateProgress() {
  const done = RAW.filter(item => getStatus(item.id) === 'done').length;
  document.getElementById('progress-pill').textContent = done + ' / ' + RAW.length;
}

// Search
document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

// Init
render();
</script>
</body>
</html>

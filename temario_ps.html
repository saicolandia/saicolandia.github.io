<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Temario — Psicología Social</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --border: #2a2f42;
    --accent: #7c6af7;
    --accent2: #a89cf8;
    --text: #e8e6f0;
    --muted: #8b8fa8;
    --done: #34c983;
    --progress: #f0a040;
    --radius: 14px;
    --radius-sm: 8px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent2);
  }
  .progress-pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--done);
    background: rgba(52,201,131,.12);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: .45;
    pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px 9px 36px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }

  /* UNIT TABS */
  .tabs-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 11px 10px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--accent2);
    border-bottom-color: var(--accent);
  }

  /* MAIN CONTENT */
  .main {
    padding: 16px;
    max-width: 700px;
    margin: 0 auto;
  }

  .unit-section { display: none; }
  .unit-section.visible { display: block; }

  .unit-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    padding-top: 4px;
  }

  /* TEMA CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .card.done {
    border-color: rgba(52,201,131,.25);
  }
  .card.in-progress {
    border-color: rgba(240,160,64,.25);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px 14px 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .card-header:active { background: var(--surface2); }

  .status-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .status-btn:hover { border-color: var(--accent); }
  .status-btn.done {
    border-color: var(--done);
    background: var(--done);
  }
  .status-btn.in-progress {
    border-color: var(--progress);
    background: var(--progress);
  }
  .status-btn svg { display: none; }
  .status-btn.done svg, .status-btn.in-progress svg { display: block; }

  .card-tema {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text);
  }
  .card.done .card-tema { color: var(--muted); text-decoration: line-through; }

  .chevron {
    flex-shrink: 0;
    color: var(--muted);
    transition: transform .25s;
  }
  .card.open .chevron { transform: rotate(180deg); }

  /* DESARROLLO */
  .desarrollo {
    display: none;
    padding: 0 14px 16px 52px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .card.open .desarrollo { display: block; }
  .desarrollo-text {
    font-size: 13.5px;
    line-height: 1.65;
    color: #bdbbd0;
  }
  .desarrollo-text p { margin-bottom: .8em; }
  .desarrollo-text p:last-child { margin-bottom: 0; }
  .desarrollo-text strong { color: var(--text); font-weight: 600; }
  .desarrollo-text .bullet {
    display: flex;
    gap: 8px;
    margin-bottom: .5em;
  }
  .desarrollo-text .bullet::before {
    content: "•";
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* STATUS ACTIONS row */
  .status-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .status-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .status-pill:active { opacity: .7; }
  .pill-pending { background: rgba(139,143,168,.15); color: var(--muted); }
  .pill-progress { background: rgba(240,160,64,.15); color: var(--progress); }
  .pill-done { background: rgba(52,201,131,.15); color: var(--done); }

  /* SEARCH HIGHLIGHT */
  mark {
    background: rgba(124,106,247,.35);
    color: var(--accent2);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 48px 16px;
    color: var(--muted);
    font-size: 14px;
    display: none;
  }
  .empty.visible { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Psicología Social</h1>
    <span class="progress-pill" id="progress-pill">0 / 41</span>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input type="search" id="search" placeholder="Buscar tema…">
  </div>
</div>

<div class="tabs-bar" id="tabs-bar"></div>

<div class="main" id="main">
  <div class="empty" id="empty-msg">No se encontraron temas.</div>
</div>

<script>
const RAW = [{"unidad": "UNIDAD 3. Identidad y socialización", "tema": "Concepto de identidad en las diferentes corrientes.", "desarrollo": "El concepto de identidad varía significativamente entre las corrientes de la psicología social y la sociología, aunque todas coinciden en que no es una estructura innata, sino un producto de la interacción social.A continuación, se desarrolla el concepto según las fuentes proporcionadas:1. Interaccionismo Simbólico (George Mead)Para Mead, la identidad o persona es un emergente social que surge a través de la comunicación y el lenguaje.\n• El Sí Mismo como objeto: El individuo se convierte en persona cuando adquiere la capacidad de ser un objeto para sí mismo, es decir, cuando puede percibirse desde la perspectiva de los demás.\n• El Gesto Vocal y el Símbolo Significante: La identidad surge cuando el sujeto utiliza el gesto vocal para despertar en sí mismo la misma reacción que provoca en el otro. Esto permite \"adoptar el papel del otro\" y regular la propia conducta.\n• Estructura dual (Yo y Mí): La identidad está compuesta por dos fases:\n    ◦ El \"Mí\": Representa el conjunto de actitudes de los otros organizadas e incorporadas al individuo; es el reflejo de la estructura social.\n    ◦ El \"Yo\": Es la reacción del individuo ante esas actitudes sociales; es el principio de la acción, el impulso y la creatividad que permite cambiar la estructura social.\n• Etapas de desarrollo: Se construye pasando por el Juego (donde el niño adopta roles aislados de otros significativos) y el Deporte (donde incorpora la actitud de todo el grupo o \"otro generalizado\").2. Sociología Fenomenológica (Berger y Luckmann)Estos autores definen la identidad como un elemento clave de la realidad subjetiva que se halla en una relación dialéctica con la sociedad.\n• Entidad reflejada: El individuo no nace con identidad, sino que la adquiere mediante la internalización de los roles y actitudes de sus otros significativos (padres) durante la socialización primaria. La identidad es una \"entidad reflejada\" porque refleja las actitudes que los otros adoptaron inicialmente hacia el sujeto.\n• Identidad objetiva vs. subjetiva: Existe una dialéctica entre la identidad objetivamente atribuida (cómo me definen los demás basándose en mi ubicación social) y la identidad subjetivamente asumida (cómo me apropio yo de esa definición).\n• Estabilidad y cambio: Una vez que se forma el otro generalizado en la conciencia, la identidad adquiere estabilidad y continuidad. Sin embargo, puede ser modificada o transformada (re-socialización) a través de nuevos procesos sociales.3. Enfoque Dramatúrgico y Estigma (Erving Goffman)Goffman analiza la identidad en relación con el manejo de la imagen y el estigma. Distingue tres niveles fundamentales de identidad:\n• Identidad Social: Se basa en las categorías y atributos que la sociedad asigna a las personas.\n    ◦ Identidad social virtual: Las demandas y expectativas normativas que le imputamos a un extraño basándonos en sus apariencias.\n    ◦ Identidad social real: La categoría y los atributos que se puede demostrar que el individuo efectivamente posee.\n• Identidad Personal: Se refiere a la unicidad del individuo. Se construye mediante marcas de identidad (nombre, registros, imagen física) y una historia vital única que permite diferenciar a esa persona de todas las demás en el mundo.\n• Identidad del Yo (Identidad para sí): Es la dimensión puramente subjetiva y reflexiva. Es el sentido de la propia situación, carácter y continuidad que el individuo construye como resultado de sus diversas experiencias sociales.En resumen, mientras Mead se enfoca en la emergencia cognitiva del sí mismo a través del lenguaje, Berger y Luckmann destacan la internalización dialéctica de la estructura social, y Goffman pone el acento en la gestión de la información y las categorías sociales en la interacción cotidiana.", "status": "Not started"}, {"unidad": "UNIDAD 3. Identidad y socialización", "tema": "La sociología del conocimiento y las características de la realidad de la vida cotidiana.", "desarrollo": "La sociología del conocimiento se define como el análisis de los procesos por los cuales la realidad se construye socialmente. Su foco no es el pensamiento teórico o intelectual, sino el \"conocimiento\" que orienta la conducta en la vida cotidiana, es decir, lo que la gente común \"sabe\" sobre su mundo en el día a día.A continuación, se desarrollan las características fundamentales de la realidad de la vida cotidiana según Berger y Luckmann:1. La realidad por excelencia (Suprema realidad)La vida cotidiana se presenta como una realidad interpretada por los hombres y que para ellos tiene el significado subjetivo de un mundo coherente. Se la considera la \"suprema realidad\" porque se impone a la conciencia de manera masiva, urgente e intensa. Aunque existen otras realidades (como el mundo de los sueños o el juego), la conciencia siempre regresa a la vida cotidiana como su punto de referencia primordial.2. El mundo intersubjetivoA diferencia de los sueños, la realidad cotidiana es un mundo compartido con otros. Esta intersubjetividad establece que el mundo es tan real para los demás como lo es para uno mismo. Se basa en una correspondencia continua entre los significados propios y los ajenos, permitiendo un \"sentido común\" sobre la realidad.3. Una realidad ordenada y objetivadaLa vida cotidiana se presenta ya ordenada en pautas que parecen independientes de la aprehensión del individuo. Esta organización es posible gracias al lenguaje, que proporciona las objetivaciones necesarias (nombres, categorías, conceptos) para que los objetos y las relaciones adquieran un sentido comprensible y estable.4. La actitud natural (Realidad dada por establecida)La vida cotidiana se aprehende mediante una actitud natural, lo que significa que se toma como algo evidente y normal por sí mismo. No requiere verificaciones adicionales; sencillamente está ahí como una facticidad imperiosa. El individuo suspende cualquier duda sobre ella para poder actuar rutinariamente.5. Estructura temporal y espacial\n• Espacialidad: La realidad se organiza alrededor del \"aquí\" del cuerpo del individuo. El interés del sujeto es más intenso en las zonas directamente accesibles a su manipulación corporal y se vuelve menos urgente a medida que se aleja espacialmente.\n• Temporalidad: Es una propiedad intrínseca de la conciencia y se presenta como una estructura coercitiva. El individuo posee un tiempo limitado (\"mi muerte es inevitable\") y debe sincronizar sus proyectos con el tiempo oficial de la sociedad (calendarios, relojes), que le impone secuencias preestablecidas (\"lo primero es lo primero\").6. Sectores rutinarios y problemáticosLa realidad de la vida cotidiana se divide en:\n• Sectores de rutina: Aspectos que no presentan problemas y se manejan automáticamente mientras las rutinas prosigan sin interrupción.\n• Sectores problemáticos: Aparecen cuando ocurre algo inesperado que interrumpe la rutina. La realidad de la vida cotidiana busca integrar el sector problemático dentro de lo que ya es no problemático para restaurar el orden.7. El lenguaje como vehículo de trascendenciaEl lenguaje es el instrumento más importante para objetivar y preservar la experiencia en la vida cotidiana. Tiene la capacidad de trascender el \"aquí y ahora\", permitiendo hablar de personas ausentes, del pasado o de proyectos futuros. Además, permite la creación de símbolos que remiten a realidades que no son de la vida cotidiana (como la religión, la filosofía o el arte), integrándolas nuevamente en el mundo cotidiano de forma significativa.", "status": "Not started"}, {"unidad": "UNIDAD 3. Identidad y socialización", "tema": "Características de la interacción social en la vida cotidiana", "desarrollo": "La interacción social en la vida cotidiana presenta una serie de características fundamentales que permiten la construcción y el mantenimiento de la realidad compartida. Según las fuentes, estas son sus dimensiones principales:1. La situación \"cara a cara\" como prototipoLa experiencia más importante de los otros ocurre en la situación \"cara a cara\", que es el tipo ideal de interacción del cual se derivan todas las demás formas. En este encuentro:\n• Sincronía de presentes: El \"aquí y ahora\" de cada individuo gravita sobre el otro, produciendo un intercambio continuo de expresividad.\n• Máximo de síntomas: La subjetividad del otro es accesible mediante un máximo de síntomas (gestos, miradas, tono de voz), lo que hace que el otro sea \"decididamente próximo\".\n• Reciprocidad y espejo: La interacción es flexible; cada acto es una respuesta a las actitudes del otro, funcionando como un espejo que refleja las intenciones mutuas.2. Esquemas tipificadores y anonimatoA pesar de la proximidad física, la interacción se organiza mediante esquemas tipificadores. Aprehendemos al otro como un \"hombre\", un \"cliente\" o un \"tipo jovial\".\n• Negociación de tipificaciones: Estos esquemas son valederos hasta nuevo aviso y se modifican continuamente durante el intercambio social si el otro no encaja en la categoría imputada.\n• Continuum de anonimato: La interacción social se vuelve progresivamente más anónima a medida que se aleja de la situación cara a cara. Por ejemplo, interactuar con un \"amigo íntimo\" es menos anónimo que hacerlo con el \"típico lector de un diario\".3. La estructura de la comunicación: Gestos y SímbolosDesde la perspectiva de George Mead, la interacción ocurre en dos niveles:\n• Conversación de gestos: Es una comunicación no consciente donde los individuos responden mecánicamente a las primeras etapas de los actos de los otros (como en una riña o combate).\n• Símbolos significantes: La interacción humana racional surge cuando el individuo puede \"adoptar el papel del otro\", despertando en sí mismo la misma reacción que provoca en su interlocutor. Esto permite regular la propia conducta basándose en el significado compartido.4. Gestión de la identidad y el estigmaEn la interacción cotidiana, la sociedad imputa a los individuos una identidad social virtual basada en las apariencias iniciales y demandas normativas.\n• Discrepancias: Cuando aparece un atributo desacreditador (estigma), se rompe la relación entre la persona y el estereotipo esperado, transformando la interacción en un \"contacto mixto\" donde el sujeto debe gestionar la información sobre su defecto para evitar el menosprecio.5. El diálogo como mantenimiento de la realidadEl vehículo más importante de la interacción para preservar la realidad subjetiva es el diálogo.\n• Aparato conversacional: La vida cotidiana implica la puesta en marcha de un aparato conversacional que mantiene, modifica y reconstruye continuamente lo que el individuo sabe de su mundo.\n• Validación de la identidad: La interacción con los otros significativos (como la familia o el \"coro\" de conocidos) es crucial para que el individuo siga confiando en que es quien cree ser.", "status": "Not started"}, {"unidad": "UNIDAD 3. Identidad y socialización", "tema": "Socialización primaria, socialización secundaria y alternación.", "desarrollo": "El proceso por el cual un individuo es inducido a participar en la dialéctica de la sociedad se denomina socialización, la cual se define como la inducción amplia y coherente de un sujeto en el mundo objetivo de una sociedad o en un sector de él. Según Berger y Luckmann, este proceso se divide en dos etapas fundamentales, a las que se suma un proceso de transformación radical denominado alternación.1. Socialización primariaEs la primera por la que el individuo atraviesa en la niñez y, por medio de ella, se convierte en miembro de la sociedad.\n• El papel de los otros significativos: El niño nace dentro de una estructura social objetiva en la cual encuentra a los otros significativos (generalmente los padres) que están encargados de su socialización. Estos adultos no solo seleccionan aspectos del mundo según su ubicación social, sino que también lo filtran a través de sus propias idiosincrasias individuales.\n• Carga afectiva: Se efectúa en circunstancias de enorme carga emocional. Sin esta adhesión emocional a los otros significativos, el proceso de aprendizaje sería difícil, si no imposible.\n• Identificación y el Yo: El niño se identifica con los otros significativos en una variedad de formas emocionales, y es a través de esta identificación que se vuelve capaz de identificarse a sí mismo. El \"yo\" es, por tanto, una entidad reflejada, pues refleja las actitudes que primeramente adoptaron para con él los otros significativos.\n• El Otro Generalizado: El paso decisivo ocurre cuando el niño abstrae los roles y actitudes de otros específicos hacia la generalidad de la norma. Por ejemplo, deja de entender que \"mamá está enojada conmigo ahora\" para comprender que \"uno no debe derramar la sopa\". Esta formación del otro generalizado implica la internalización de la sociedad en cuanto tal y de la realidad objetiva establecida en ella.\n• Finalización: La socialización primaria finaliza cuando el concepto del otro generalizado se ha establecido en la conciencia del individuo, quien se siente ahora miembro efectivo de la sociedad y en posesión subjetiva de un yo y un mundo.2. Socialización secundariaEs cualquier proceso posterior que induce al individuo ya socializado a nuevos sectores del mundo objetivo de su sociedad, centrándose en la internalización de \"submundos\" institucionales.\n• Conocimiento especializado: Se refiere a la adquisición de conocimientos específicos de \"roles\", lo que requiere un vocabulario y pautas de comportamiento de rutina dentro de un área institucional.\n• Anonimato y formalidad: A diferencia de la primaria, la socialización secundaria suele prescindir de una carga emocional intensa y procede con una dosis de identificación mutua mínima, propia de la comunicación entre seres humanos funcionales. Los roles son altamente anónimos y los funcionarios que los enseñan son, en principio, intercambiables.\n• Fragilidad de la realidad: La realidad subjetiva de la socialización secundaria es más frágil y menos arraigada en la conciencia que la de la primaria. Por ello, se hace necesario en muchos casos elaborar técnicas especiales (como rituales o procesos de iniciación) para producir la identificación e inevitabilidad requeridas.\n• Distancia del rol: Este proceso permite que el individuo establezca una distancia entre su yo total y el yo parcial específico del rol (por ejemplo, el de administrador o militar), algo que no sucede en la socialización primaria, donde el niño no tiene elección de mundo.3. AlternaciónLa alternación es un caso extremo de transformación donde el individuo \"permuta mundos\", produciendo un cambio casi total en su realidad subjetiva.\n• Re-socialización radical: Requiere procesos que se asemejan a la socialización primaria porque deben volver a atribuir acentos de realidad de manera radical y reproducir una identificación fuertemente afectiva con los nuevos elencos socializadores.\n• Estructura de plausibilidad: El requisito más importante es la existencia de una estructura de plausibilidad eficaz, es decir, una base social (comunidad) que sirva como \"laboratorio\" de transformación y que esté segregada del mundo exterior.\n• Desmantelamiento del pasado: La alternación exige desintegrar la anterior estructura nómica de la realidad subjetiva. El individuo debe volver a interpretar toda su biografía anterior bajo la fórmula: \"Entonces yo creía... ahora sé\".\n• Legitimación y ruptura: Se dispone de un aparato legitimador para toda la serie de transformaciones, el cual debe justificar no solo la nueva realidad, sino también el abandono y repudio de todas las realidades antiguas. El pasado es reinterpretado para armonizarlo con la nueva identidad, a menudo identificando la vida previa como una \"oscuridad\" frente a la nueva \"luz\".", "status": "Not started"}, {"unidad": "UNIDAD 3. Identidad y socialización", "tema": "La formación de la identidad y el proceso de socialización.", "desarrollo": "El proceso de formación de la identidad es indisociable del proceso de socialización, el cual se define como la inducción amplia y coherente de un individuo en el mundo objetivo de una sociedad o en un sector de él. La persona no nace con una identidad predefinida, sino que la construye a través de una serie de etapas y mecanismos de interacción social.1. Socialización Primaria: El Origen de la IdentidadLa socialización primaria es la primera etapa por la que atraviesa el individuo en la niñez y es el proceso mediante el cual se convierte en miembro de la sociedad.\n• Identificación afectiva: Este proceso ocurre en circunstancias de gran carga emocional, donde el niño se identifica con sus \"otros significativos\" (generalmente los padres).\n• La entidad reflejada: El niño no solo acepta los roles y actitudes de los demás, sino que al identificarse con ellos se vuelve capaz de identificarse a sí mismo. Por ello, el \"yo\" se considera una entidad reflejada, pues refleja las actitudes que inicialmente adoptaron hacia él sus socializadores.\n• El \"Otro Generalizado\": La formación de la identidad culmina cuando el niño realiza una abstracción progresiva que va de los roles de otros específicos a la generalidad de la norma social. Mead denomina a este punto la etapa del deporte (game), donde el niño incorpora la actitud de la comunidad en su conjunto, permitiendo una identidad coherente y continua.2. El Sí Mismo como Estructura Dual (George Mead)Para Mead, la persona completa es una estructura dual que surge de la internalización del proceso social de comunicación.\n• El \"Mí\": Representa el conjunto de actitudes de los otros que han sido organizadas e incorporadas al individuo, funcionando como el reflejo de la estructura social y el control moral.\n• El \"Yo\": Es la reacción del individuo ante las actitudes sociales; es el principio de la acción, el impulso y la creatividad que impide que la persona sea un mero reflejo pasivo de la sociedad.\n• Pensamiento reflexivo: La identidad surge cuando el individuo adquiere la capacidad de hacerse un objeto para sí mismo, despertando en su interior las mismas reacciones que provoca en los demás a través del lenguaje.3. Socialización Secundaria y Niveles de IdentidadUna vez establecida la base en la niñez, el individuo atraviesa procesos de socialización secundaria, que consisten en la internalización de submundos institucionales basados en conocimientos especializados y roles específicos.\n• Distancia del rol: A diferencia de la primaria, en esta etapa el individuo puede establecer una distancia entre su yo total y el yo parcial requerido por un rol determinado (como el de profesional o funcionario).\n• Niveles de identidad (Goffman): Erving Goffman complementa esta visión distinguiendo entre la identidad social (categorías imputadas por otros), la identidad personal (basada en la unicidad biográfica y marcas físicas) y la identidad del yo (el sentido subjetivo de la propia situación).\n• Gestión del estigma: La formación de la identidad también se ve afectada cuando existe una discrepancia entre lo que la sociedad espera (identidad social virtual) y lo que el individuo es (identidad social real), generando un estigma que el sujeto debe gestionar en su interacción diaria.4. La Dialéctica de la IdentidadFinalmente, la identidad es un fenómeno que surge de la relación dialéctica entre el individuo y la sociedad. Existe una tensión constante entre la identidad objetivamente atribuida (cómo nos definen los demás) y la identidad subjetivamente asumida (cómo nos apropiamos de esas definiciones). La identidad se forma mediante procesos sociales, pero una vez cristalizada, reacciona sobre la estructura social, manteniéndola, modificándola o incluso reformándola a través del pensamiento reflexivo y la acción creativa.", "status": "Not started"}, {"unidad": "UNIDAD 3. Identidad y socialización", "tema": "La identidad en el Interaccionismo simbólico.", "desarrollo": "Dentro del Interaccionismo Simbólico, principalmente a través del pensamiento de George Mead, la identidad (o \"persona\") no se considera una estructura biológica innata, sino un emergente social que surge mediante el lenguaje y la interacción dentro de un grupo.A continuación, se desarrollan los ejes centrales de esta perspectiva:1. El Surgimiento de la Persona (El Sí Mismo)La transformación del individuo biológico en una persona con espíritu ocurre cuando el sujeto adquiere la capacidad de tener conciencia de sí mismo, es decir, cuando puede convertirse en un objeto para sí.\n• El mecanismo del lenguaje: Este proceso es posible gracias a la intervención del lenguaje, específicamente mediante el gesto vocal.\n• Símbolos significantes: El lenguaje se compone de gestos que se vuelven \"símbolos significantes\" cuando el individuo es capaz de interpretar la significación de su propio gesto, despertando en sí mismo la misma reacción que provoca en el otro.\n• Adoptar el papel del otro: Gracias a estos símbolos, el ser humano puede \"adoptar el papel del otro\" para regular su propia conducta basándose en la reacción anticipada de los demás.2. Etapas en el Desarrollo de la IdentidadMead identifica dos fases cruciales en las que el niño aprende a incorporar las actitudes sociales para formar su persona:\n• Etapa del Juego (Play): En esta fase inicial, el niño adopta papeles de otros de manera aislada y sucesiva (por ejemplo, juega a ser médico o papá). Es una adopción de actitudes de personas específicas que han entrado en su vida.\n• Etapa del Deporte (Game): En el deporte, el individuo ya no adopta un solo papel, sino que debe ser capaz de adoptar el papel de todos los otros participantes involucrados en la actividad común. Para actuar con éxito, debe tener dentro de su persona la actividad organizada completa.\n• El Otro Generalizado: Esta etapa culmina en la formación del \"otro generalizado\", que representa la actitud de la comunidad o grupo social en su conjunto. Al internalizar esta actitud general, la persona adquiere una identidad coherente y una base para la conducta moral y racional.3. Instancias del Sí Mismo: El \"Yo\" y el \"Mí\"Mead describe la persona como una estructura dual compuesta por dos fases en interacción dialéctica:\n• El \"Mí\": Es el conjunto de actitudes de los otros que han sido organizadas e incorporadas a la propia persona. Representa la estructura social dentro del individuo y funciona como el mecanismo de control social y responsabilidad.\n• El \"Yo\": Es la reacción del individuo ante las actitudes sociales (ante el \"mí\"). Representa el principio de la acción, el impulso y la creatividad. Es la parte de la persona que introduce cambios y reconstruye la estructura social.\n• Interdependencia: Si la persona fuera solo el \"mí\", sería un mero reflejo pasivo de la sociedad; sin embargo, la interacción con el \"yo\" permite el pensamiento reflexivo, transformando al animal impulsivo en un hombre racional y moral.", "status": "Not started"}, {"unidad": "UNIDAD 3. Identidad y socialización", "tema": "Mead: características del sí mismo, el yo y el mí.", "desarrollo": "Para George Mead, el surgimiento de la persona y el espíritu es un proceso que depende enteramente de la interacción dentro de un grupo social. A continuación, se desarrollan las características del sí mismo y sus dos instancias fundamentales:1. Características del Sí Mismo (Self)\n• Emergente Social: Mead sostiene que el sí mismo no es una estructura biológica innata, sino un emergente social que surge a través del lenguaje.\n• El Sí Mismo como Objeto: La característica esencial de la persona es la capacidad de hacerse un objeto para sí mismo, es decir, de tener conciencia de sí y de su propia conducta.\n• Mecanismo del Gesto Vocal: Este proceso es posible gracias al gesto vocal, ya que este afecta al individuo que lo realiza de la misma manera que afecta a los demás (uno se oye hablar mientras los otros lo oyen).\n• Adoptar el papel del otro: Mediante el empleo de símbolos significantes, el individuo aprende a despertar en sí mismo la reacción que su gesto provoca en el otro, lo que le permite \"adoptar el papel del otro\" para regular su propia conducta posterior.\n• Relativismo Objetivo: Mead plantea que la experiencia privada solo adquiere sentido en comparación con la experiencia común o social; por lo tanto, el espíritu es la subjetivización de un proceso de comunicación que originalmente es externo y objetivo.2. El \"Mí\" (La Estructura Social)\n• Definición: El \"mí\" representa el conjunto de actitudes de los otros organizadas e incorporadas a la propia persona.\n• Reflejo de la Sociedad: Es la instancia que contiene la estructura social dentro del individuo, proporcionando la base para la estabilidad, la responsabilidad y la moralidad.\n• El Otro Generalizado: En el \"mí\" reside la actitud de la comunidad o grupo social en su conjunto, lo que Mead denomina el \"otro generalizado\".\n• Función de Control: Actúa como un mecanismo de control social, ya que el individuo evalúa sus propios impulsos basándose en las normas y expectativas que ha internalizado de su entorno.3. El \"Yo\" (La Acción y Creatividad)\n• Definición: El \"yo\" es el principio de la acción, el impulso y la creatividad individual.\n• Reacción al Mí: Es la respuesta del sujeto ante las actitudes sociales organizadas que componen el \"mí\".\n• Motor de Cambio: Mientras el \"mí\" busca la estabilidad, el \"yo\" es la instancia que introduce cambios, innovaciones y reconstrucciones en la estructura social.\n• Incertidumbre de la Acción: El \"yo\" es algo que nunca es totalmente predecible; es el individuo actuando en el presente antes de que esa acción sea integrada y evaluada por el \"mí\".Dinámica entre el Yo y el MíLa persona completa es una estructura dual producto de la interacción dialéctica entre ambas fases. Si el individuo fuera solo el \"mí\", sería un mero reflejo pasivo de la sociedad; si fuera solo el \"yo\", sería puro impulso sin dirección social. La unión de ambos permite el pensamiento reflexivo, donde el individuo puede dirigir su acción basándose en las consecuencias previstas, transformando así al animal impulsivo en un hombre racional y moral.", "status": "Not started"}, {"unidad": "UNIDAD 3. Identidad y socialización", "tema": "Los niveles de integración de la identidad para Goffman: la identidad social, personal y del yo", "desarrollo": "Erving Goffman propone tres niveles de integración para comprender la identidad, los cuales permiten analizar cómo un individuo se sitúa frente a la sociedad, especialmente cuando existe un estigma que deteriora su imagen pública.\n1. Identidad Social\nLa identidad social se refiere a las categorías y atributos que la sociedad establece para clasificar a las personas y tratarlas de manera rutinaria. Goffman distingue dos dimensiones dentro de este nivel:\n• Identidad social virtual: Son las demandas de carácter y las expectativas normativas que los demás imputan a un individuo basándose en las apariencias iniciales durante un encuentro.\n• Identidad social real: Se refiere a la categoría y los atributos que se puede demostrar que el individuo posee efectivamente. El estigma surge precisamente de la discrepancia entre estas dos identidades, cuando un atributo del individuo lo vuelve diferente de los demás y lo reduce, en la mente de los otros, a una persona \"inficionada y menospreciada\".\n2. Identidad PersonalEste nivel se centra en la unicidad del individuo, aquello que lo distingue positivamente de cualquier otro ser en el mundo. Se constituye a través de dos elementos principales:\n• Marcas positivas o soportes de la identidad: Son recursos estandarizados (como el nombre, la imagen fotográfica, las huellas dactilares o el conocimiento de la ubicación en una red de parentesco) que permiten la identificación administrativa y social de la persona.\n• Historia vital única: Es la combinación irrepetible de hechos biográficos que se adhieren al individuo a lo largo del tiempo. Mientras que la identidad social permite categorizar a alguien como \"un tipo de persona\", la identidad personal permite identificarlo como \"esta persona específica\".\n3. Identidad del Yo (o Identidad para sí)A diferencia de las anteriores, que dependen en gran medida de las definiciones de los otros, la identidad del yo es una cuestión subjetiva y reflexiva.\n• Se define como el sentido que el individuo construye de su propia situación, continuidad y carácter como resultado de las diversas experiencias sociales que atraviesa.\n• En este nivel es donde aparece la ambivalencia, ya que el individuo estigmatizado a menudo asume los estándares de identidad de la sociedad \"normal\" pero siente la presión de no poder adaptarse plenamente a ellos. Esto genera un conflicto interno sobre cómo se percibe a sí mismo frente a cómo lo perciben y clasifican los demás.En resumen, estos tres niveles permiten a Goffman analizar cómo el individuo navega entre las expectativas sociales (identidad social), su unicidad biográfica (identidad personal) y su propia vivencia interna (identidad del yo).", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Modelos uni y multidimensionales en el estudio de las actitudes.", "desarrollo": "El estudio de las actitudes ha evolucionado desde una concepción compleja de múltiples elementos hacia una definición más sintética centrada en la evaluación. Los modelos uni y multidimensionales representan estas dos grandes etapas y enfoques teóricos.Modelo Multidimensional (Perspectiva de los tres componentes)Este enfoque, predominante antes de la década de 1990, sostiene que las actitudes son estructuras complejas integradas por tres componentes distintos que actúan de manera conjunta. Bajo esta perspectiva, una actitud no es solo lo que se siente, sino también lo que se piensa y cómo se está predispuesto a actuar. Los componentes son:\n• Componente Cognitivo: Se refiere a las creencias, ideas, conocimientos y opiniones que una persona tiene sobre el objeto de la actitud. Por ejemplo, las creencias sobre si el consumo de leche fortalece los huesos.\n• Componente Afectivo: Comprende las emociones, sentimientos y estados de ánimo (agrado, desagrado, odio, simpatía) que el objeto despierta en el individuo.\n• Componente Conductual (o Conativo): Incluye las intenciones de conducta y las predisposiciones a actuar de una manera determinada hacia el objeto, basándose en experiencias o intenciones previas.Modelo Unidimensional (Perspectiva de componente único)En las últimas décadas, muchos psicólogos sociales se han desplazado hacia una definición unidimensional o de componente único. En este modelo, el elemento central y definitorio de la actitud es la evaluación.\n• Definición: La actitud se entiende simplemente como una tendencia psicológica a evaluar un objeto, conducta o situación con algún grado de favorabilidad o desfavorabilidad.\n• Simplicidad conceptual: En lugar de considerar que los tres componentes son la actitud, este modelo define la actitud como el juicio evaluativo final (positivo o negativo) que resulta de dichos componentes.Síntesis Actual y Relación entre ModelosEl alejamiento del modelo multidimensional no implica que las creencias, los sentimientos o las conductas hayan perdido importancia. En la actualidad, se considera que estos tres elementos no constituyen la actitud en sí misma, sino que son sus antecedentes o fuentes.Como se ilustra en las fuentes, una actitud (evaluación única) puede formarse a partir de procesos cognitivos, afectivos o conductuales, ya sea de forma individual o combinada. Por ejemplo, se puede desarrollar una actitud positiva hacia un producto simplemente por haberlo visto muchas veces (proceso afectivo de mera exposición), sin necesidad de tener creencias previas sobre él.Finalmente, teorías modernas como la Teoría del Comportamiento Planeado utilizan esta base evaluativa (actitud) junto con otras variables, como la norma subjetiva y el control conductual percibido, para predecir de manera más precisa las intenciones y el comportamiento humano.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Modelos de formación de las actitudes: exposición, condicionamiento clásico y operante, modelo funcionalista, auto observación.", "desarrollo": "Los modelos de formación de las actitudes explican cómo los individuos adquieren tendencias evaluativas hacia diversos objetos a través de procesos de socialización y experiencias directas o indirectas.1. Efecto de la mera exposiciónEste modelo sostiene que la exposición repetida a un estímulo neutral puede, por sí sola, conducir a una actitud más positiva hacia dicho objeto. Según las investigaciones de Robert Zajonc, no se requiere de una creencia previa ni de la realización de una conducta para que este efecto ocurra; la simple familiaridad generada por la visión frecuente de un estímulo (como un rostro o caracteres extraños) aumenta el agrado hacia él. Este proceso parece tener una base evolutiva, donde lo familiar se percibe como seguro y lo desconocido como una posible amenaza.2. Condicionamiento ClásicoLas actitudes pueden formarse mediante el condicionamiento clásico, proceso en el cual un estímulo neutral (estímulo condicionado) se aparea con otro que provoca de forma natural una respuesta emocional (estímulo incondicionado).\n• Mecanismo: Tras apareamientos repetidos, el estímulo originalmente neutral llega a evocar por sí solo la respuesta emocional.\n• Evidencia: Estudios han demostrado que aparear nombres de nacionalidades con palabras de valencia positiva o negativa influye en la actitud final hacia esos grupos. Incluso se ha observado que este condicionamiento puede ocurrir de forma subliminal, es decir, sin que el individuo sea consciente de los estímulos presentados.3. Condicionamiento OperanteA diferencia del anterior, este modelo se centra en las consecuencias de la conducta o de la expresión de una actitud. Si la expresión de una actitud es reforzada (mediante aprobación o recompensas), la actitud se fortalece; si es castigada, la actitud tiende a debilitarse o cambiar. Este proceso es fundamental en la socialización infantil, donde los padres moldean las actitudes de sus hijos mediante el elogio o el reproche.4. Modelo FuncionalistaEl enfoque funcionalista sugiere que las personas forman actitudes para satisfacer necesidades psicológicas específicas. Según este modelo, las actitudes cumplen cuatro funciones principales:\n• Función Utilitaria: Ayuda a obtener recompensas y evitar castigos (vinculada al condicionamiento operante).\n• Función de Conocimiento: Permite organizar y estructurar el mundo de manera significativa, proporcionando un sentido de orden.\n• Función de Defensa del Yo: Protege a la persona de conflictos emocionales internos y de reconocer verdades desagradables sobre sí misma, resguardando la autoestima.\n• Función de Expresión de Valores: Permite manifestar aspectos centrales del autoconcepto y valores personales importantes.5. Auto observación (Teoría de la Autopercepción)Propuesta por Daryl Bem, la teoría de la autopercepción sostiene que a menudo inferimos nuestras propias actitudes observando nuestro comportamiento pasado y las circunstancias en las que ocurrió.\n• Proceso: Actuamos como observadores externos de nosotros mismos; si percibimos que realizamos una conducta de forma voluntaria (sin presiones externas claras), concluimos que debemos tener una actitud coherente con esa acción.\n• Aplicación: Este modelo es especialmente relevante cuando las actitudes iniciales son débiles, nuevas o ambiguas. A diferencia de la disonancia cognitiva, donde existe una tensión interna por actitudes firmes en conflicto, la autopercepción es un proceso puramente inferencial y tranquilo.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Relación entre actitud y comportamiento.", "desarrollo": "La relación entre la actitud y el comportamiento ha sido uno de los temas centrales en la psicología social, evolucionando desde una creencia en un vínculo directo hasta modelos complejos que consideran múltiples variables mediadoras.Evolución Histórica y DesafíosHasta finales de la década de 1960, se asumía que conocer las actitudes de una persona era suficiente para predecir su comportamiento. Sin embargo, investigaciones clásicas cuestionaron esta premisa:\n• Estudio de LaPiere (1934): Un sociólogo viajó con una pareja de chinos por EE. UU. y observó que casi todos los establecimientos los atendieron, a pesar de que meses después, el 90% de esos mismos dueños declararon por escrito que no aceptarían a clientes chinos.\n• Críticas de Wicker (1969): Sus investigaciones revelaron que las actitudes a menudo no eran predictores confiables de la conducta, lo que obligó a los investigadores a desarrollar modelos más sofisticados.Factores que Determinan la Consistencia Actitud-ComportamientoLa investigación moderna indica que varios factores influyen en qué tan bien una actitud predice una acción:\n• Nivel de especificidad: Las medidas de actitud deben coincidir en especificidad con el comportamiento que se desea predecir; las actitudes generales predicen mal conductas específicas.\n• Intensidad y accesibilidad: Las actitudes más fuertes, firmes y fácilmente accesibles en la memoria tienen un impacto mucho más poderoso en el comportamiento.\n• Autoconciencia: Las personas con alta autoconciencia privada actúan más de acuerdo con sus estándares internos y actitudes, mientras que aquellas con alta autoconciencia pública tienden a seguir normas externas.\n• Factores de tiempo: Cuanto menor sea el intervalo de tiempo entre la medición de la actitud y el comportamiento, mayor será la probabilidad de que coincidan.Modelos de Predicción: TAR y TCPPara \"salvar\" el concepto de actitud, Fishbein y Ajzen propusieron modelos donde la intención es el antecedente inmediato de la conducta.\n• Teoría de la Acción Razonada (TAR): Sostiene que la intención depende de la actitud (valoración personal) y la norma subjetiva (presión social percibida).\n• Teoría del Comportamiento Planeado (TCP): Añade el control conductual percibido, que es la autopercepción de la capacidad y recursos para realizar la conducta, especialmente útil en comportamientos que no están totalmente bajo control volitivo.Actitudes Explícitas e ImplícitasEl modelo del doble procesamiento distingue entre dos tipos de actitudes que guían el comportamiento de forma diferente:\n• Actitudes Explícitas: Predicen mejor los comportamientos deliberados y no habituales cuando hay altos recursos cognitivos y autocontrol.\n• Actitudes Implícitas: Son mejores predictores de comportamientos espontáneos, habituales o cuando la capacidad de autorregulación es baja.Influencia del Comportamiento sobre la ActitudLa relación es bidireccional. Según la Teoría de la Disonancia Cognitiva de Festinger, cuando una persona actúa de forma inconsistente con sus actitudes, experimenta una incomodidad psicológica que suele resolver cambiando su actitud para justificar su comportamiento pasado. Asimismo, la Teoría de la Autopercepción de Bem sugiere que, cuando nuestras actitudes son débiles, las inferimos simplemente observando nuestra propia conducta.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Teoría de la Acción Razonada y Teoría del Comportamiento Planeado, variables en ambos modelos.", "desarrollo": "Ambas teorías, desarrolladas por Martin Fishbein e Icek Ajzen, surgieron para \"salvar\" el concepto de actitud al demostrar que, si bien las actitudes no siempre predicen el comportamiento de forma directa, sí lo hacen a través de la mediación de la intención.1. Teoría de la Acción Razonada (TAR)Propuesta originalmente en 1980, esta teoría postula que el comportamiento humano está bajo el control volitivo (voluntad) del individuo. El antecedente inmediato de cualquier conducta es la intención de realizarla.Variables en la TAR:\n• Actitud: Es de naturaleza personal y se define como la valoración (positiva o negativa) que el individuo hace de los resultados de realizar un comportamiento específico. Se basa en creencias de comportamiento: lo que esperamos que suceda y la importancia que le damos a esa consecuencia.\n• Norma Subjetiva: Es de naturaleza social. Se refiere a la presión social percibida; es decir, lo que la persona cree que los \"otros importantes\" (familia, amigos, pareja) esperan que haga y su motivación para cumplir con esas expectativas.\n• Intención: Es la disposición de la persona para llevar a cabo el comportamiento, determinada por la combinación de la actitud y la norma subjetiva.2. Teoría del Comportamiento Planeado (TCP)En 1985, Ajzen extendió la TAR para incluir conductas que no están totalmente bajo el control de la voluntad (como las adicciones o conductas de alimentación), dando lugar a la TCP.Variable adicional en la TCP:\n• Control Conductual Percibido: Es la autopercepción de la capacidad, recursos y oportunidades que una persona cree tener para realizar la conducta. Esta variable se basa en creencias de control: factores ambientales o personales que pueden facilitar o dificultar la acción.Funcionamiento del modelo TCP: En este modelo, la intención ahora depende de tres factores: la actitud, la norma subjetiva y el control conductual percibido. Una característica distintiva es que el control conductual percibido puede influir en el comportamiento de dos maneras:\n1. Indirectamente: Aumentando o disminuyendo la intención conductual.\n2. Directamente: Influyendo en la conducta final cuando existen factores externos que escapan al control personal del individuo.\nActitud\nEvaluación del comportamiento.\nCreencias conductuales: Consecuencias esperadas y su valoración.\nNorma Subjetiva\nPresión social percibida.\nCreencias normativas: Expectativas de otros y motivación para complacerlos.\nControl Conductual\nPercepción de capacidad y recursos.\nCreencias de control: Factores que facilitan o limitan la acción.\nIntención\nDisposición para actuar.Resultante de las tres variables anteriores.\nConducta\nRespuesta manifiesta y observable.Consecuencia de la intención y el control percibido.\nEstos modelos han sido ampliamente utilizados para predecir comportamientos de salud, como el consumo de alcohol, tabaco, dietas y uso de preservativos.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Festinger y la Teoría de la disonancia cognitiva, factores que\nintervienen en la disonancia y resolución de la misma.", "desarrollo": "Leon Festinger propuso en 1957 la Teoría de la Disonancia Cognitiva, la cual sostiene que las personas tienen una fuerte necesidad de mantener consistencia entre sus pensamientos, actitudes y comportamientos. Cuando existe una inconsistencia entre dos cogniciones (conocimientos, opiniones o creencias sobre el medio, uno mismo o la propia conducta), se genera un estado de malestar psicológico denominado disonancia.Este estado de tensión funciona de manera análoga a un impulso físico como el hambre: el individuo se siente motivado a actuar para reducir la incomodidad y evitar situaciones que puedan incrementarla.Factores que intervienen en la magnitud de la disonanciaNo todas las inconsistencias producen el mismo grado de malestar. La magnitud de la disonancia depende de varios factores críticos:\n• Importancia de los elementos: Cuanto más importantes sean las cogniciones involucradas para la persona, mayor será el grado de disonancia. Por ejemplo, una inconsistencia en un valor moral central genera más tensión que una sobre una preferencia trivial.\n• Proporción de cogniciones: La magnitud depende de la relación entre el número de elementos disonantes y el número de elementos consonantes (que sí concuerdan entre sí) que el individuo tiene presentes.\n• Libertad de elección (Elección percibida): La disonancia es significativamente más alta cuando la persona siente que ha elegido realizar la conducta inconsistente de forma voluntaria.\n• Justificación insuficiente: Como demostró el experimento clásico de Festinger y Carlsmith, si una persona realiza una conducta contraria a sus creencias por una recompensa pequeña (justificación insuficiente), experimenta mayor disonancia y cambia más su actitud que si lo hace por una recompensa grande.Situaciones comunes que generan disonanciaLa disonancia suele brotar de tres contextos principales:\n1. Después de tomar una decisión: Al elegir entre alternativas, surge disonancia por los aspectos positivos de la opción rechazada y los negativos de la elegida.\n2. Disonancia por condescendencia forzada: Cuando se induce a alguien a decir o hacer algo contrario a su opinión privada mediante una recompensa o amenaza.\n3. Exposición a nueva información: Cuando nuevos datos contradicen creencias firmemente arraigadas.Resolución y reducción de la disonanciaPara recuperar la armonía interna, las personas emplean diversas estrategias de racionalización:\n• Cambiar la conducta: Alterar el comportamiento para que sea consistente con la actitud (por ejemplo, dejar de fumar).\n• Cambiar la cognición (actitud): Modificar la creencia original para que se ajuste a lo que se ha hecho (por ejemplo, decidir que fumar \"no es tan malo\").\n• Añadir nuevos elementos consonantes: Buscar información que justifique la conducta inconsistente (racionalización), como pensar que fumar ayuda a relajarse o a no subir de peso.\n• Trivialización: Restar importancia a la discrepancia, decidiendo que la inconsistencia no es relevante para el autoconcepto.\n• Autoafirmación: Enfocarse en otros aspectos positivos de uno mismo (como ser una buena persona o un buen profesional) para reducir el impacto de la inconsistencia en la autoestima.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Actitudes explícitas, implícitas y duales.", "desarrollo": "El desarrollo de estos conceptos se enmarca en el modelo del doble procesamiento, el cual postula que los seres humanos procesamos la información de dos maneras: una consciente, controlada y racional, y otra no consciente, automática e intuitiva. A partir de esta distinción, la psicología social diferencia entre actitudes explícitas, implícitas y duales.Actitudes ExplícitasSon aquellas actitudes que el individuo tiene de manera consciente y puede informar deliberadamente.\n• Proceso: Resultan de un proceso proposicional e intencional basado en razonamientos lógicos del tipo \"si... entonces\".\n• Justificación: Debido a su naturaleza racional, las personas pueden justificar sus actitudes explícitas mediante argumentos lógicos (por ejemplo, indicar que alguien les agrada por ser leal o responsable).\n• Medición y Predicción: Se evalúan a través de métodos directos como los autoinformes, escalas y cuestionarios. Son predictores eficaces de comportamientos deliberados y no habituales, especialmente cuando el sujeto posee altos niveles de autocontrol y recursos cognitivos.Actitudes ImplícitasSe definen como evaluaciones que se activan de forma automática en la memoria ante la presencia de un objeto, sin que la persona sea consciente de poseerlas.\n• Proceso: Son reacciones afectivas que resultan de un proceso asociativo entre un objeto y una valoración (positiva o negativa), formadas a menudo por huellas de experiencias pasadas no identificadas mediante la introspección.\n• Inconsciencia: Generalmente, el individuo no puede dar una explicación racional sobre ellas, atribuyendo el agrado o desagrado a una \"cuestión de piel\" que no puede evitar.\n• Medición: Dado que la introspección tiene límites, se utilizan métodos indirectos como el Test de Asociaciones Implícitas (IAT), tareas de priming o asociación de palabras, que requieren respuestas rápidas para impedir el control consciente.\n• Predicción: Prevalecen en conductas habituales o espontáneas que requieren poco esfuerzo cognitivo o cuando la capacidad de autorregulación es baja.Actitudes DualesEl concepto de actitudes duales se refiere a la posesión simultánea de actitudes contradictorias (una explícita y otra implícita) hacia el mismo objeto evaluativo.\n• Origen: Esta coexistencia ocurre porque las actitudes explícitas e implícitas pueden desarrollarse de forma independiente y estar sujetas a diferentes factores de influencia. Mientras que la actitud explícita puede ser moldeada por valores sociales de igualdad, la implícita puede haber sido formada por estereotipos culturales o experiencias tempranas.\n• Ejemplo: Una persona puede sentir rechazo hacia un grupo minoritario a nivel implícito (basado en prejuicios sociales inconscientes) pero, al mismo tiempo, mantener una actitud explícita positiva basada en el razonamiento de que está mal discriminar.\n• Dinámica: Ambas actitudes guían el comportamiento, pero bajo ciertas circunstancias (como la falta de tiempo para reflexionar o el cansancio) la actitud implícita puede predominar sobre la explícita.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Formas de medición de las actitudes.", "desarrollo": "La medición de las actitudes se divide fundamentalmente en dos grandes categorías dependiendo de si el objetivo es evaluar la parte consciente (explícita) o la parte automática (implícita) de la evaluación psicológica,.1. Métodos Directos (Medición de Actitudes Explícitas)Estos métodos parten del supuesto de que las personas son conscientes de sus propias actitudes y, por lo tanto, pueden informar sobre ellas de manera voluntaria.\n• Instrumentos comunes: Se utilizan autoinformes como escalas (por ejemplo, la Escala de Necesidad de Evaluar), cuestionarios y el diferencial semántico,.\n• Limitaciones: La validez de estos métodos se ve limitada por la capacidad de introspección del sujeto y por el sesgo de deseabilidad social, donde el individuo puede ocultar sus sentimientos reales para dar una imagen positiva de sí mismo ante los demás,.\n• Capacidad predictiva: Son excelentes predictores del comportamiento cuando este es deliberado y no habitual, y cuando la persona dispone de suficientes recursos cognitivos y autocontrol.2. Métodos Indirectos (Medición de Actitudes Implícitas)Surgieron para acceder a las actitudes no conscientes o \"huellas de la experiencia pasada\" que no se identifican mediante la introspección,. Estos métodos infieren la actitud a partir del desempeño del sujeto en tareas específicas que requieren respuestas rápidas para impedir el control consciente,.\n• Test de Asociaciones Implícitas (IAT): Es el método más popular y confiable,. Consiste en una tarea computarizada donde el participante clasifica estímulos (palabras o imágenes) en categorías de \"objeto\" (ej. joven vs. anciano) y \"atributos\" (ej. bueno vs. malo),. La velocidad y precisión al asociar ciertos conceptos revelan la actitud implícita del sujeto.\n• Tareas de Priming: Se basan en presentar un estímulo facilitador (prime) que influye automáticamente en el procesamiento de un estímulo posterior (target). Un ejemplo es el Procedimiento de Misatribución del Afecto (AMP), donde la valoración de un objeto (como una imagen) se proyecta erróneamente sobre un estímulo neutral (como un carácter chino).\n• Tareas de Asociación de Palabras: Se presenta un estímulo y el sujeto debe responder con la primera palabra que le venga a la mente; una mayor cantidad de asociaciones positivas o negativas hacia el objeto indica la dirección de la actitud,.\n• Medidas Fisiológicas y Conductuales: Incluyen la observación de respuestas no verbales como la dilatación de las pupilas, expresiones faciales sutiles (microexpresiones) o la excitación fisiológica ante el objeto.\n• Capacidad predictiva: Estos métodos son mejores predictores de comportamientos espontáneos y habituales, o de situaciones donde la capacidad de autorregulación del individuo es baja,.Complementariedad de los MétodosEn temas socialmente sensibles (como el prejuicio), suele haber una baja correlación entre los resultados de los métodos directos e indirectos,. Por ello, las fuentes recomiendan la aplicación conjunta de ambos tipos de evaluación, ya que se complementan para brindar una visión más completa de la estructura actitudinal del individuo y su probable comportamiento,.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Estereotipos, prejuicio y discriminación.", "desarrollo": "En el marco de la psicología social, los conceptos de estereotipo, prejuicio y discriminación están estrechamente relacionados, aunque representan dimensiones distintas del comportamiento y el pensamiento humano. Tradicionalmente, se han entendido como los tres componentes de una actitud: el estereotipo es el componente cognitivo, el prejuicio el afectivo y la discriminación el conductual.1. Estereotipos (Componente Cognitivo)Los estereotipos son esquemas o imágenes mentales que simplifican la realidad de un entorno complejo.\n• Definición: Son el conjunto de creencias sobre las características, atributos y roles de los miembros de un grupo social.\n• Función: Actúan como simplificadores cognitivos que permiten procesar información rápidamente y anticipar comportamientos en nuevas situaciones.\n• Contenido: Según el Modelo del Contenido de los Estereotipos, estos se organizan en dos dimensiones: afecto (cooperación) y competencia (estatus). Por ejemplo, grupos con bajo estatus suelen ser percibidos como menos competentes.\n• Mantenimiento: Tienden a preservarse debido a que las personas minimizan la información que los contradice o actúan de forma que confirman sus propias expectativas (profecías autocumplidas).2. Prejuicio (Componente Afectivo)El prejuicio es una actitud individual hacia un grupo y sus miembros, que generalmente tiene una connotación negativa.\n• Definición clásica: Gordon Allport lo definió como una antipatía basada en una generalización inflexible y errónea, dirigida a un grupo como un todo o a un individuo por pertenecer a él.\n• Propósito: Sirve para mantener relaciones jerárquicas de estatus entre grupos, proteger la autoestima o proveer ventajas materiales.\n• Evolución histórica: El concepto ha pasado por diversas etapas: desde ser visto como una \"respuesta natural\" de superioridad racial (antes de 1920), un mecanismo de defensa psicodinámico (1920-1960), una norma social aprendida (1960-1980), hasta el enfoque actual centrado en sesgos cognitivos y formas sutiles o implícitas de prejuicio.3. Discriminación (Componente Conductual)La discriminación es el comportamiento manifiesto que genera o mantiene desigualdades sociales.\n• Definición: Es el trato inapropiado o potencialmente injusto hacia personas basado en su pertenencia a un grupo determinado.\n• Formas de manifestación: No solo incluye acciones negativas dirigidas a dañar a un exogrupo (grupo ajeno), sino también el favoritismo endogrupal, que consiste en beneficiar injustamente a los miembros del propio grupo.\n• Intensidad: Las emociones determinan la gravedad de la discriminación; mientras que el disgusto puede llevar a la evitación, emociones más fuertes como el odio o el desprecio pueden justificar el daño físico o la exclusión sistemática.Relación entre los tres constructosExiste una retroalimentación constante entre ellos: los estereotipos promueven la discriminación al sesgar la percepción; a su vez, la discriminación percibida refuerza los estereotipos al intentar justificar la disparidad entre grupos basándose en los roles sociales que ocupan. Actualmente, se distingue entre formas explícitas (conscientes y declaradas) e implícitas (automáticas e inconscientes) de estos tres fenómenos, siendo las implícitas más difíciles de detectar en cuestionarios tradicionales.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Discriminación en términos psicológicos y en términos macrosociales.", "desarrollo": "La discriminación se define, en términos generales, como el componente conductual de las actitudes negativas hacia grupos sociales, manifestándose como un trato inapropiado o injusto hacia las personas debido a su pertenencia a un colectivo específico.La Discriminación en Términos PsicológicosDesde la psicología, la discriminación se aborda principalmente como un proceso individual e intrapsíquico. Se centra en cómo las evaluaciones internas de un sujeto se traducen en acciones manifiestas:\n• Vínculo con el Prejuicio y Estereotipos: La psicología entiende la discriminación como la ejecución de la predisposición afectiva (prejuicio) basada en creencias cognitivas (estereotipos).\n• Favoritismo Endogrupal: No siempre implica un daño directo al \"otro\"; a menudo se manifiesta como una tendencia a beneficiar injustamente a los miembros del propio grupo (endogrupo) por encima de los demás.\n• Papel de las Emociones: La intensidad de la conducta discriminatoria está ligada a la fuerza de la emoción subyacente. Emociones leves como el disgusto pueden llevar a la evitación social, mientras que emociones intensas como el odio, el miedo o el desprecio pueden motivar ataques activos o el deseo de infligir daño físico.\n• Procesos de Identidad: Sirve a funciones individuales como la mejora de la autoestima a través de la denigración de otros y la protección de la imagen personal.\n• Dimensión Implícita: La psicología moderna destaca que la discriminación puede ocurrir de forma automática e inconsciente (implícita), revelada por indicadores sutiles como el tono de voz o la distancia física, incluso cuando el individuo afirma no tener prejuicios.La Discriminación en Términos MacrosocialesDesde una perspectiva macrosocial o sociológica, el foco se desplaza del individuo hacia la estructura social, las instituciones y las relaciones de poder:\n• Mantenimiento de Jerarquías: La discriminación se entiende como un mecanismo para crear, mantener y reforzar las relaciones jerárquicas de estatus y los roles de poder entre diferentes grupos sociales.\n• Racismo Institucionalizado: Este enfoque analiza cómo la discriminación está imbuida en las reglas y prácticas de las instituciones (como el mercado laboral o el sistema legal), donde una sociedad entera puede actuar de forma discriminatoria simplemente siguiendo las normas sociales tradicionales.\n• Factores Económicos y de Clase: Se pone énfasis en las funciones que la discriminación desempeña a nivel grupal, como la provisión de ventajas materiales y económicas para el grupo dominante, la división del mercado laboral y la perpetuación de la brecha de clase.\n• Justificación del Sistema: A nivel macro, se observa que incluso los grupos en desventaja pueden llegar a aceptar ideologías que justifican su propia posición inferior debido a la socialización de normas culturales que racionalizan el statu quo.\n• Contexto Histórico y Político: La discriminación macrosocial se explica a través de procesos históricos de larga duración, como el colonialismo interno y la segregación institucional, que establecen patrones de comportamiento que los individuos adoptan para ser considerados \"buenos ciudadanos\" dentro de su cultura.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Relaciones intergrupales.", "desarrollo": "Las relaciones intergrupales se refieren a las interacciones, percepciones y comportamientos que los miembros de diferentes grupos sociales mantienen entre sí. El estudio de estas relaciones en las fuentes se centra en cómo la pertenencia grupal influye en el conflicto, la cooperación y el mantenimiento de las jerarquías sociales.A continuación, se desarrollan los puntos clave sobre este tema:1. La Categorización Social como DetonanteLas fuentes destacan que no es necesario un conflicto de intereses histórico para que surjan sesgos intergrupales.\n• Efecto de la mera categorización: Basta con que los individuos se perciban como miembros de grupos distintos para que aparezcan conductas competitivas y actitudes de favor hacia el propio grupo (endogrupo) en detrimento del ajeno (exogrupo).\n• Simplificación cognitiva: Este proceso es natural y universal; su objetivo es simplificar la complejidad del entorno social, permitiendo a las personas procesar información y anticipar comportamientos de manera rápida.2. Dinámicas de Poder y EstatusLas relaciones entre grupos no suelen ser simétricas, sino que están marcadas por la posición social:\n• Mantenimiento de jerarquías: El prejuicio y la discriminación actúan como mecanismos psicológicos destinados a crear o mantener relaciones jerárquicas de estatus entre los grupos.\n• Justificación del sistema: Tanto los grupos dominantes como, en ocasiones, los desaventajados, pueden aceptar ideologías que racionalizan el statu quo basándose en las cualidades percibidas de cada grupo (por ejemplo, ver a los grupos de alto estatus como más \"competentes\").\n• Favoritismo endogrupal: Una forma común de discriminación no es el ataque directo, sino la tendencia a beneficiar injustamente a los miembros del propio grupo.3. El Modelo del Contenido de los EstereotiposEste modelo explica las relaciones intergrupales basándose en dos dimensiones críticas:\n• Afecto (o Cordialidad): Basado en la percepción de cooperación o competencia. Si un grupo se percibe como cooperador, genera sentimientos de orgullo o lástima (si su competencia es baja).\n• Competencia: Basada en el estatus social. Los grupos de alto estatus son vistos como competentes, lo que puede generar admiración o envidia (si el afecto es bajo, como en el caso de grupos percibidos como rivales económicos).4. La Hipótesis del Contacto (Allport)Gordon Allport propuso que el contacto entre grupos puede reducir el prejuicio, pero advirtió que no cualquier tipo de contacto es efectivo.\n• Contacto casual: A menudo no ayuda e incluso puede reforzar los estereotipos previos, ya que las personas tienden a notar solo aquello que confirma sus prejuicios.\n• Condiciones para un contacto exitoso: Para que el contacto mejore las relaciones, deben cumplirse cuatro condiciones fundamentales:\n    1. Igualdad de estatus: Los miembros de ambos grupos deben interactuar en una situación donde tengan un rango similar.\n    2. Objetivos comunes: Trabajar juntos hacia una meta compartida (metas supraordenadas).\n    3. Cooperación intergrupal: La relación debe basarse en la ayuda mutua, no en la competición.\n    4. Apoyo institucional: El contacto debe contar con el respaldo de las leyes, las costumbres o las autoridades locales.5. Factores Sociales y EstructuralesFinalmente, las fuentes indican que las relaciones intergrupales están influenciadas por el contexto macrosocial. El racismo institucionalizado y las normas sociales tradicionales pueden dictar que la segregación o la discriminación sean vistas como comportamientos normales para ser un \"buen ciudadano\" en determinados contextos históricos, independientemente de la personalidad individual.", "status": "Not started"}, {"unidad": "UNIDAD 4. Actitudes prejuicio y discriminación", "tema": "Reducción de hostilidad intergrupal.", "desarrollo": "La reducción de la hostilidad intergrupal es uno de los desafíos más complejos de la psicología social, y las fuentes coinciden en que no basta con el simple acercamiento entre grupos para eliminar el prejuicio. De hecho, si el contacto no se produce bajo condiciones específicas, puede incluso reforzar los estereotipos negativos preexistentes.A continuación, se detallan las estrategias y factores clave para lograr una reducción efectiva de la hostilidad:1. La Hipótesis del Contacto (Gordon Allport)El modelo más influyente sostiene que el contacto entre grupos solo es eficaz si se cumplen cuatro condiciones fundamentales de manera conjunta:\n• Igualdad de estatus: Los miembros de ambos grupos deben interactuar en una situación donde tengan un rango o prestigio similar, especialmente en entornos laborales o educativos.\n• Objetivos comunes: La interacción debe estar dirigida hacia una meta compartida que interese a ambas partes.\n• Cooperación intergrupal: Se debe fomentar el trabajo en equipo en lugar de la competición; el éxito debe depender del esfuerzo conjunto.\n• Apoyo institucional: El contacto debe estar respaldado por la ley, las costumbres o el clima social imperante, lo que legitima la interacción positiva.2. Por qué falla el contacto casualLas fuentes advierten que el contacto casual o superficial (como cruzarse en la calle o en el transporte público) suele ser ineficaz. En estos casos, las personas tienden a realizar una percepción selectiva: se fijan solo en aquellos individuos o comportamientos que confirman sus estereotipos previos, ignorando la información que los contradice. Esto puede provocar que el contacto deje las actitudes \"peor que antes\" al validar las sospechas iniciales.3. Contextos eficaces de reducciónExisten entornos específicos donde se ha demostrado una mejora en las relaciones:\n• Contacto Residencial Integrado: Aunque inicialmente puede generar fricción, la convivencia en vecindarios o edificios integrados suele reducir el prejuicio a largo plazo, ya que facilita el conocimiento mutuo más allá del estereotipo.\n• Contacto Ocupacional: Trabajar con miembros de grupos minoritarios que desempeñan roles de igual o mayor estatus (como jefes o colegas profesionales) es uno de los métodos más potentes para cambiar las actitudes, ya que rompe la jerarquía social tradicional.\n• Proyectos de Buena Voluntad: Las actividades comunitarias organizadas con metas concretas son más útiles que los programas de instrucción teórica, que a menudo no logran modificar el sentimiento profundo.4. Mecanismos Psicológicos en la ReducciónLa hostilidad disminuye cuando se activan ciertos procesos internos:\n• Disonancia Cognitiva: Si una persona es inducida a cooperar con un miembro de otro grupo (conducta), sentirá una tensión interna si mantiene su prejuicio (actitud). Para reducir este malestar, es probable que termine cambiando su actitud para justificar su comportamiento cooperativo.\n• Reducción de la Ansiedad: El contacto genuino permite que el individuo se sienta seguro, reduciendo el miedo a lo desconocido y transformando la percepción de amenaza en una de familiaridad.\n• Modelo del Contenido de los Estereotipos: La hostilidad (basada en el desprecio o la envidia) puede mitigarse si se modifica la percepción de competencia y cordialidad del otro grupo, permitiendo que surjan emociones como la admiración o la simpatía.En conclusión, la reducción de la hostilidad requiere un diseño cuidadoso de la situación de contacto, asegurando que los individuos se vean obligados a depender unos de otros en un plano de igualdad y bajo el auspicio de normas sociales que favorezcan la integración.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Las representaciones sociales y el conocimiento de sentido común.", "desarrollo": "Las representaciones sociales (RS) se definen fundamentalmente como una forma de conocimiento específico: el saber de sentido común. Este tipo de conocimiento es elaborado socialmente y compartido por los miembros de un conjunto social, teniendo como fin último la construcción de una realidad común y la orientación de las conductas.A continuación, se desarrollan los aspectos clave de esta relación:1. Naturaleza del saber de sentido comúnEl conocimiento de sentido común, en el marco de las RS, es un sistema de interpretación de la realidad que rige las relaciones de los individuos con su entorno. Se caracteriza por ser:\n• Socialmente elaborado: Es un producto y, a la vez, un proceso de una actividad mental mediante la cual los grupos reconstituyen la realidad que enfrentan, otorgándole una significación específica.\n• Práctico y funcional: Se trata de una \"guía para la acción\" que permite a los actores sociales entender, explicar y dominar su entorno social, material e ideal.\n• Dinámico y versátil: A diferencia de sistemas más rígidos, el sentido común es caleidoscópico y se adapta a las experiencias vividas y a las evoluciones del contexto.2. Diferencias entre el conocimiento de sentido común y el científicoLas fuentes establecen una distinción clara entre estos dos tipos de saberes, señalando que sus objetivos son divergentes:\n• El objetivo del científico es generar conocimientos precisos y llegar a la verdad mediante métodos rigurosos.\n• El objetivo del \"hombre de la calle\" (sentido común) es, primordialmente, no quedar fuera del circuito social. Le interesa poder comentar lo que sucede en su mundo y dar explicaciones accesibles a los fenómenos cotidianos, estimulando y modelando la ciencia colectiva.\n• Lógica propia: Aunque se le ha llamado pensamiento \"ingenuo\", no es inferior a la lógica científica; simplemente sigue una lógica diferente orientada a la comunicación y a la utilidad práctica inmediata.3. Funciones de este conocimientoEl saber de sentido común cumple funciones esenciales para la dinámica social:\n• Funciones de saber: Permite a los sujetos adquirir e integrar nuevos conocimientos en un marco de referencia que les resulte asimilable y coherente con sus valores previos.\n• Familiarización: Una de sus tareas principales es convertir lo extraño o desconocido en algo familiar y no amenazador, integrándolo al sistema de categorías preexistente del grupo.\n• Comunicación social: Define el marco de referencia común que posibilita el intercambio y la transmisión de información dentro de una sociedad.4. La reconstrucción mental de la realidadLas representaciones sociales no son un simple reflejo pasivo de la realidad exterior, sino una reconstrucción mental de la misma. El individuo no es un receptor pasivo de información, sino un productor de sentidos que selecciona y transforma los datos del entorno según sus normas y valores. Este proceso permite que conceptos complejos (como teorías científicas o ideologías) se \"vulgaricen\" y se conviertan en elementos del saber común accesibles para todos.", "status": "Not started"}, {"unidad": "UNIDAD 5. Representaciones sociales", "tema": "Concepto de representación social y su diferenciación con otros conceptos cognitivos y sociológicos.", "desarrollo": "La representación social (RS) se define como una forma de conocimiento específico, el saber de sentido común, que es elaborado socialmente y compartido por los miembros de un grupo con un objetivo práctico: la construcción de una realidad común y la orientación de las conductas. No es un simple reflejo pasivo de la realidad, sino una organización significante y una reconstrucción mental de la misma, donde el sujeto y el objeto son indisociables.\n\n1. El concepto de Representación SocialLa RS funciona como un sistema de interpretación de la realidad que rige las relaciones de los individuos con su entorno físico y social. Se caracteriza por ser un sistema sociocognitivo que posee una doble lógica:\n• Lógica cognitiva: Posee una \"textura psicológica\" sometida a las reglas de los procesos cognitivos individuales.\n• Lógica social: Su puesta en práctica está determinada directamente por las condiciones sociales, históricas e ideológicas en las que se elabora.2. Diferenciación con conceptos cognitivosLas fuentes enfatizan que, aunque la RS integra elementos de otros constructos, no debe confundirse con ellos debido a su carácter integrador y dinámico.\n• Actitud: Mientras que la actitud se define como una orientación global (positiva o negativa) hacia un objeto, la RS es una unidad funcional más amplia. La actitud es solo uno de los componentes de la representación (su dimensión afectiva o de evaluación).\n• Opinión: La opinión es una fórmula mediante la cual el individuo fija una

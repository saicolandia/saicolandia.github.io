<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichero · Saicolandia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#241a14;
    --wood-mid:#3a2a1e;
    --wood-light:#513524;
    --wood-seam:#1a120d;
    --brass:#c9a227;
    --brass-bright:#e6c65c;
    --brass-dark:#7d5f18;
    --paper:#efe3c8;
    --paper-shadow:#d9c9a4;
    --ink:#2a2118;
    --ink-soft:#6b5c48;
    --panel-w:360px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--wood-dark);
    overflow:hidden;
  }

  .app{
    display:grid;
    grid-template-columns: var(--panel-w) 1fr;
    height:100vh;
  }

  /* ---------- CATÁLOGO (sidebar) ---------- */
  .catalog{
    position:relative;
    background:
      repeating-linear-gradient(180deg, var(--wood-mid) 0 3px, var(--wood-light) 3px 6px),
      linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    border-right:6px solid var(--wood-seam);
    overflow-y:auto;
    padding:22px 16px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--brass-dark) var(--wood-dark);
  }
  .catalog::-webkit-scrollbar{width:10px;}
  .catalog::-webkit-scrollbar-thumb{background:var(--brass-dark); border-radius:6px;}

  .catalog-header{
    text-align:center;
    padding:10px 8px 20px;
    margin-bottom:18px;
    border-bottom:2px solid var(--brass-dark);
  }
  .catalog-header .eyebrow{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.22em;
    color:var(--brass);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .catalog-header h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    color:#f4e9cf;
    margin:0;
    letter-spacing:.01em;
  }

  #accordion-list{ display:flex; flex-direction:column; gap:14px; }

  /* Cada asignatura = un cajón con placa de bronce */
  .drawer{ --accent:#8c3a3a; }

  .drawer-header{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    padding:13px 16px;
    border-radius:6px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.15)),
      var(--accent);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.25),
      inset 0 -2px 4px rgba(0,0,0,.35),
      0 3px 6px rgba(0,0,0,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .drawer-header:hover{ transform: translateX(2px); }
  .drawer-header:focus-visible{ outline:2px solid var(--brass-bright); outline-offset:2px; }
  .drawer.open .drawer-header{
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.5),
      0 1px 2px rgba(0,0,0,.3);
  }

  .tab-plate{
    position:relative;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:15.5px;
    color:#fbf3df;
    text-shadow: 0 1px 1px rgba(0,0,0,.4);
    padding-left:6px;
  }
  .screw{
    display:none;
  }

  .chevron{
    font-size:18px;
    color:#fbf3df;
    transform: rotate(0deg);
    transition: transform .2s ease;
  }
  .drawer.open .chevron{ transform: rotate(90deg); }

  .drawer-panel{
    margin-top:6px;
    padding-left:10px;
    border-left:2px dashed rgba(201,162,39,.35);
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .file-card{
    all:unset;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:10px 12px;
    background: var(--paper);
    border-radius:3px;
    box-shadow: 0 2px 0 var(--paper-shadow), 0 3px 6px rgba(0,0,0,.35);
    border-left:4px solid var(--accent, var(--brass-dark));
  }
  .drawer .file-card{ --accent: inherit; }
  .file-card:hover{ transform: translateX(2px); }
  .file-card:focus-visible{ outline:2px solid var(--brass-bright); outline-offset:2px; }
  .file-card.active{
    background: linear-gradient(0deg, var(--paper), #fff7e6);
    box-shadow: 0 2px 0 var(--brass), 0 3px 8px rgba(0,0,0,.4);
  }
  .file-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
  }
  .file-name{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }

  .loading, .empty, .error{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:#d8c9a3;
    padding:8px 4px;
  }
  .error{ color:#e8a37a; }

  /* ---------- VISOR (derecha) ---------- */
  .viewer-wrap{
    position:relative;
    background:
      radial-gradient(ellipse at top, #4a3626, #241a14 70%);
    padding:22px;
    display:flex;
  }
  #viewer{
    flex:1;
    background:var(--paper);
    border-radius:4px;
    box-shadow: 0 12px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.08);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #viewer iframe{
    width:100%;
    height:100%;
    border:0;
  }
  .placeholder{
    text-align:center;
    color:var(--ink-soft);
    padding:40px;
    max-width:340px;
  }
  .placeholder .glyph{
    font-family:'Fraunces', serif;
    font-size:44px;
    color:var(--brass-dark);
    margin-bottom:10px;
  }
  .placeholder h2{
    font-family:'Fraunces', serif;
    font-size:20px;
    color:var(--ink);
    margin:0 0 8px;
  }
  .placeholder p{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    line-height:1.5;
    margin:0;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  @media (max-width: 780px){
    .app{ grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
    .catalog{ border-right:none; border-bottom:6px solid var(--wood-seam); }
    .viewer-wrap{ padding:12px; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="catalog">
    <div class="catalog-header">
      <span class="eyebrow">Saicolandia</span>
      <h1>Fichero de apuntes</h1>
    </div>
    <div id="accordion-list">
      <div class="loading">Abriendo el fichero…</div>
    </div>
  </aside>

  <main class="viewer-wrap">
    <div id="viewer">
      <div class="placeholder">
        <div class="glyph">§</div>
        <h2>Elegí una ficha</h2>
        <p>Abrí una carpeta a la izquierda y tocá un archivo para leerlo acá.</p>
      </div>
    </div>
  </main>

</div>

<script>
(function(){
  // ---------- CONFIGURACIÓN ----------
  const CONFIG = {
    owner: 'saicolandia',
    repo: 'saicolandia.github.io',
    branch: 'main',
    root: 'chiches'
  };

  const API_BASE  = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
  const SITE_BASE = `https://${CONFIG.owner}.github.io`;

  const PALETTE = [
    '#8c3a3a', '#2f6f6f', '#c98a2b', '#4d6a80', '#6b4570',
    '#3f6b4a', '#a5522d', '#5b6b73', '#b8860b', '#7a4b3a', '#4a6b5a'
  ];

  const list = document.getElementById('accordion-list');

  function humanize(name){
    return name
      .replace(/\.html?$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  async function loadRoot(){
    try{
      const res = await fetch(`${API_BASE}/${CONFIG.root}?ref=${CONFIG.branch}`);
      if(!res.ok) throw new Error(`GitHub API respondió ${res.status}`);
      const items = await res.json();
      const folders = items.filter(i => i.type === 'dir');
      const rootFiles = items.filter(i => i.type === 'file' && /\.html?$/i.test(i.name));

      list.innerHTML = '';

      if(!folders.length && !rootFiles.length){
        list.innerHTML = `<div class="empty">La carpeta "${CONFIG.root}" está vacía.</div>`;
        return;
      }

      folders.forEach((folder, idx) => {
        list.appendChild(buildDrawer(folder, PALETTE[idx % PALETTE.length]));
      });

      if(rootFiles.length){
        list.appendChild(buildDrawer({ name: '(General)', path: CONFIG.root, _looseFiles: rootFiles }, '#7d5f18'));
      }
    }catch(err){
      list.innerHTML = `<div class="error">No se pudo leer el fichero (${err.message}). Revisá que el repo sea público y que exista la carpeta "${CONFIG.root}".</div>`;
    }
  }

  function buildDrawer(folder, color){
    const wrapper = document.createElement('div');
    wrapper.className = 'drawer';
    wrapper.style.setProperty('--accent', color);

    const header = document.createElement('button');
    header.className = 'drawer-header';
    header.setAttribute('aria-expanded', 'false');
    header.innerHTML = `<span class="tab-plate">${humanize(folder.name)}</span><span class="chevron">›</span>`;

    const panel = document.createElement('div');
    panel.className = 'drawer-panel';
    panel.hidden = true;

    let loaded = false;

    header.addEventListener('click', async () => {
      const expanded = header.getAttribute('aria-expanded') === 'true';
      header.setAttribute('aria-expanded', String(!expanded));
      wrapper.classList.toggle('open', !expanded);
      panel.hidden = expanded;

      if(!expanded && !loaded){
        loaded = true;
        if(folder._looseFiles){
          renderFiles(panel, CONFIG.root, folder._looseFiles, color);
        } else {
          await populateFolder(folder, panel, color);
        }
      }
    });

    wrapper.appendChild(header);
    wrapper.appendChild(panel);
    return wrapper;
  }

  async function populateFolder(folder, panel, color){
    panel.innerHTML = `<div class="loading">Buscando fichas…</div>`;
    try{
      const res = await fetch(`${API_BASE}/${CONFIG.root}/${encodeURIComponent(folder.name)}?ref=${CONFIG.branch}`);
      if(!res.ok) throw new Error(`GitHub API respondió ${res.status}`);
      const items = await res.json();
      const files = items.filter(i => i.type === 'file' && /\.html?$/i.test(i.name));

      if(!files.length){
        panel.innerHTML = `<div class="empty">Todavía no hay fichas acá.</div>`;
        return;
      }
      renderFiles(panel, `${CONFIG.root}/${folder.name}`, files, color);
    }catch(err){
      panel.innerHTML = `<div class="error">No se pudo abrir esta carpeta (${err.message}).</div>`;
    }
  }

  function renderFiles(panel, folderPath, files, color){
    panel.innerHTML = '';
    files.forEach(file => {
      const url = `${SITE_BASE}/${folderPath}/${file.name}`;

      const card = document.createElement('button');
      card.className = 'file-card';
      card.style.setProperty('--accent', color);
      card.innerHTML = `
        <span class="file-title">${humanize(file.name)}</span>
        <span class="file-name">${file.name}</span>
      `;
      card.addEventListener('click', () => openFile(url, card));

      // Intenta reemplazar el título humanizado por el <title> real del HTML
      fetch(url).then(r => r.text()).then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const t = doc.title && doc.title.trim();
        if(t) card.querySelector('.file-title').textContent = t;
      }).catch(() => {});

      panel.appendChild(card);
    });
  }

  function openFile(url, card){
    document.querySelectorAll('.file-card.active').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    document.getElementById('viewer').innerHTML = `<iframe src="${url}" title="Ficha de estudio"></iframe>`;
  }

  loadRoot();
})();
</script>

</body>
</html>

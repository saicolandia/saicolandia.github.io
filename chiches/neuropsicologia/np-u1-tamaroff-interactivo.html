<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Modelo de Tamaroff — Interactivo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
  }
  .wrap {
    max-width: 900px;
    width: 100%;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 18px;
    color: #333;
    margin-bottom: 4px;
  }
  p.hint {
    text-align: center;
    font-size: 13px;
    color: #777;
    margin-top: 0;
    margin-bottom: 16px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    background: #ffffff;
    border: 1px solid #ddd;
    border-radius: 8px;
  }
  .toggle-text {
    cursor: pointer;
    transition: fill 0.2s ease;
  }
  .toggle-text:hover {
    fill: #999999 !important;
  }
  .reset-btn {
    display: block;
    margin: 16px auto 0;
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
  }
  .reset-btn:hover {
    background: #f0f0f0;
  }
</style>
</head>
<body>

  <button class="reset-btn" onclick="resetAll()">Ocultar todo</button>

<script>
  document.querySelectorAll('.toggle-text').forEach(function (g) {
    g.addEventListener('click', function () {
      var isHidden = g.style.fill === 'rgb(255, 255, 255)' || g.style.fill === '#ffffff' || g.style.fill === '';
      g.style.fill = isHidden ? '#000000' : '#ffffff';
    });
  });

  function resetAll() {
    document.querySelectorAll('.toggle-text').forEach(function (g) {
      g.style.fill = '#ffffff';
    });
  }
</script>
</body>
</html>

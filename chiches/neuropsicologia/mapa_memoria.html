<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa neuronal de la Memoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080B14;
    --bg2:#0D1220;
    --ink:#F3F1EA;
    --muted:#9AA3C0;
    --line:rgba(255,255,255,0.08);
    --a:#8B7CF6; /* Fundamentos - violeta */
    --b:#4FD1E8; /* Tipos por duración - cian */
    --c:#FF7B92; /* Sistema declarativo - coral */
    --d:#34D399; /* Sistema no declarativo - esmeralda */
    --e:#FBBF66; /* Bases neurales y caso clínico - ámbar */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Inter',sans-serif;color:var(--ink);}
  #app{position:relative;width:100vw;height:100vh;}

  /* ---------- background texture ---------- */
  #bgtex{
    position:absolute;inset:0;z-index:0;
    background-image:
      radial-gradient(circle at 12% 15%, rgba(139,124,246,0.16), transparent 32%),
      radial-gradient(circle at 82% 12%, rgba(79,209,232,0.14), transparent 30%),
      radial-gradient(circle at 20% 78%, rgba(52,211,153,0.12), transparent 30%),
      radial-gradient(circle at 85% 82%, rgba(251,191,102,0.14), transparent 32%),
      radial-gradient(circle at 55% 50%, rgba(255,123,146,0.10), transparent 40%),
      radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1.4px);
    background-size:100% 100%,100% 100%,100% 100%,100% 100%,100% 100%,26px 26px;
    background-color:var(--bg);
  }

  /* ---------- viewport / canvas ---------- */
  #viewport{position:absolute;inset:0;z-index:1;overflow:hidden;cursor:grab;}
  #viewport.dragging{cursor:grabbing;}
  #canvas{position:absolute;top:0;left:0;width:2500px;height:2050px;transform-origin:0 0;will-change:transform;}
  #canvas.anim{transition:transform .68s cubic-bezier(.22,.9,.28,1);}

  svg#path{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}
  .pulseDot{filter:drop-shadow(0 0 6px #fff);}

  .zone-label{
    position:absolute;display:flex;align-items:center;gap:10px;
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink);opacity:.85;white-space:nowrap;
    pointer-events:none;
  }
  .zone-label .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 12px currentColor;}
  .zone-label.a{color:var(--a);} .zone-label.b{color:var(--b);} .zone-label.c{color:var(--c);}
  .zone-label.d{color:var(--d);} .zone-label.e{color:var(--e);}

  /* ---------- cards ---------- */
  .card{
    position:absolute;width:340px;height:480px;border-radius:26px;
    padding:22px 22px 18px;
    background:linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
    backdrop-filter:blur(2px);
    border:1px solid var(--line);
    box-shadow:0 20px 45px -18px rgba(0,0,0,0.65);
    display:flex;flex-direction:column;
    cursor:pointer;transition:box-shadow .35s ease, border-color .35s ease, transform .35s ease;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:26px;padding:1px;
    background:linear-gradient(160deg, var(--accent), transparent 55%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none;
  }
  .card.zone-a{--accent:var(--a);} .card.zone-b{--accent:var(--b);} .card.zone-c{--accent:var(--c);}
  .card.zone-d{--accent:var(--d);} .card.zone-e{--accent:var(--e);}

  .card .badge{
    position:absolute;top:18px;right:20px;font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--muted);letter-spacing:.05em;
  }
  .emoji-wrap{
    width:74px;height:74px;border-radius:20px;display:flex;align-items:center;justify-content:center;
    font-size:38px;margin-bottom:14px;
    background:radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 55%, transparent), color-mix(in srgb, var(--accent) 12%, transparent));
    box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent) inset, 0 12px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .card h3{margin:0 0 10px;font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.15;color:var(--ink);}
  .card p.def{margin:0 0 14px;font-size:13px;line-height:1.5;color:#DADFF2;}
  .card .divider{height:1px;background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 60%, transparent), transparent);margin-bottom:10px;}
  .card .row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
  .card .row .ico{font-size:15px;line-height:1.4;flex:0 0 auto;filter:saturate(1.3);}
  .card .row .txt{font-size:12px;line-height:1.48;color:var(--muted);}
  .card .row .lbl{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:2px;}

  .card.focused{border-color:color-mix(in srgb, var(--accent) 70%, transparent);box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 60px -8px color-mix(in srgb, var(--accent) 55%, transparent), 0 25px 50px -18px rgba(0,0,0,.7);}
  .card.dim{opacity:.55;}

  /* ---------- top bar ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 22px;pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:12px;pointer-events:auto;}
  .brand .logo{font-size:26px;}
  .brand h1{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0;}
  .brand p{margin:0;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.03em;}

  .controls{display:flex;align-items:center;gap:8px;pointer-events:auto;background:rgba(13,18,32,0.72);border:1px solid var(--line);backdrop-filter:blur(10px);padding:7px;border-radius:16px;}
  .controls button{
    all:unset;display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:11px;color:var(--ink);font-size:16px;cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .controls button:hover{background:rgba(255,255,255,0.09);}
  .controls button:active{transform:scale(.92);}
  .controls .sep{width:1px;height:20px;background:var(--line);margin:0 2px;}
  .controls .zoomlabel{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);min-width:38px;text-align:center;}
  .controls .fitbtn{width:auto;padding:0 12px;gap:6px;font-size:12px;font-family:'Inter',sans-serif;font-weight:600;}

  /* ---------- bottom bar ---------- */
  .bottombar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 20px 20px;pointer-events:none;}
  .cardname{pointer-events:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;align-items:center;gap:8px;background:rgba(13,18,32,0.72);border:1px solid var(--line);padding:6px 14px;border-radius:100px;backdrop-filter:blur(10px);}
  .cardname strong{color:var(--ink);font-family:'Inter',sans-serif;font-weight:600;letter-spacing:0;}
  .dots{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:90vw;}
  .dots button{all:unset;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.18);cursor:pointer;transition:all .25s ease;}
  .dots button.active{width:22px;border-radius:5px;background:var(--accentdot,#fff);}

  .navarrows{position:absolute;top:50%;transform:translateY(-50%);z-index:5;pointer-events:auto;}
  .navarrows.left{left:16px;} .navarrows.right{right:16px;}
  .navarrows button{
    all:unset;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(13,18,32,0.72);border:1px solid var(--line);backdrop-filter:blur(10px);color:var(--ink);
    font-size:18px;cursor:pointer;transition:background .2s ease, transform .15s ease;
  }
  .navarrows button:hover{background:rgba(255,255,255,0.1);}
  .navarrows button:active{transform:scale(.9);}

  .hint{
    position:absolute;left:50%;top:88px;transform:translateX(-50%);z-index:6;
    background:rgba(13,18,32,0.82);border:1px solid var(--line);backdrop-filter:blur(10px);
    padding:9px 16px;border-radius:100px;font-size:12px;color:var(--muted);
    display:flex;gap:8px;align-items:center;transition:opacity .5s ease, transform .5s ease;pointer-events:none;
  }
  .hint.hide{opacity:0;transform:translate(-50%,-8px);}
  .hint kbd{font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,0.08);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:11px;color:var(--ink);}

  @media (max-width:640px){
    .brand p{display:none;}
    .hint{max-width:88vw;white-space:normal;text-align:center;top:80px;}
    .navarrows button{width:40px;height:40px;font-size:16px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="bgtex"></div>

  <div id="viewport">
    <div id="canvas">
      <svg id="path" width="2500" height="2050"></svg>
    </div>
  </div>

  <div class="topbar">
    <div class="brand">
      <span class="logo">🧠</span>
      <div>
        <h1>Mapa neuronal de la Memoria</h1>
        <p>Neuropsicología · Aprendizaje → Caso H.M.</p>
      </div>
    </div>
    <div class="controls">
      <button id="zoomOut" title="Alejar">−</button>
      <span class="zoomlabel" id="zoomLabel">100%</span>
      <button id="zoomIn" title="Acercar">+</button>
      <div class="sep"></div>
      <button class="fitbtn" id="fitAll" title="Ver todo">⤢ Ver todo</button>
    </div>
  </div>

  <div class="hint" id="hint">Usá <kbd>←</kbd> <kbd>→</kbd> para navegar, arrastrá para mover el lienzo y la rueda del mouse (o los botones) para hacer zoom</div>

  <div class="navarrows left"><button id="prevBtn">←</button></div>
  <div class="navarrows right"><button id="nextBtn">→</button></div>

  <div class="bottombar">
    <div class="cardname" id="cardname">Vista general — <strong>17 conceptos</strong></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
/* =========================================================
   DATA
========================================================= */
const ZONES = {
  a:{label:'Fundamentos del proceso mnésico', color:'var(--a)', hex:'#8B7CF6'},
  b:{label:'Tipos según duración',            color:'var(--b)', hex:'#4FD1E8'},
  c:{label:'Sistema declarativo (explícito)', color:'var(--c)', hex:'#FF7B92'},
  d:{label:'Sistema no declarativo (implícito)', color:'var(--d)', hex:'#34D399'},
  e:{label:'Bases neurales y caso clínico',   color:'var(--e)', hex:'#FBBF66'},
};

const CARD_W=340, CARD_H=480;

const CARDS = [
  // ---- Zona A · Fundamentos (fila 1, izq -> der) ----
  {zone:'a', emoji:'🧠', title:'Memoria', cx:260, cy:400,
    def:'Capacidad para codificar, almacenar y recuperar información.',
    carac:'Proceso activo y dinámico; es la base del aprendizaje.',
    comp:'Se diferencia del aprendizaje: éste produce cambios; la memoria los conserva.',
    apli:'Permite comprender cómo el cerebro adquiere y mantiene información.'},
  {zone:'a', emoji:'🌱', title:'Aprendizaje', cx:680, cy:400,
    def:'Cambio relativamente permanente producido por la experiencia.',
    carac:'Requiere plasticidad neuronal.',
    comp:'El aprendizaje genera información; la memoria la almacena.',
    apli:'Explica la rehabilitación neuropsicológica.'},
  {zone:'a', emoji:'🔐', title:'Codificación', cx:1100, cy:400,
    def:'Transformación de la información para poder almacenarla.',
    carac:'Depende de la atención y el procesamiento.',
    comp:'Se diferencia del almacenamiento y la recuperación.',
    apli:'Su alteración dificulta formar nuevos recuerdos.'},
  {zone:'a', emoji:'🗄️', title:'Almacenamiento', cx:1520, cy:400,
    def:'Conservación de la información a lo largo del tiempo.',
    carac:'Puede ser breve o prolongado.',
    comp:'Es posterior a la codificación.',
    apli:'Fundamental para la consolidación mnésica.'},
  {zone:'a', emoji:'🔍', title:'Recuperación', cx:1940, cy:400,
    def:'Acceso a la información previamente almacenada.',
    carac:'Puede ser libre o mediante claves.',
    comp:'Puede fallar aun cuando el recuerdo esté almacenado.',
    apli:'Explica algunos trastornos de memoria.'},

  // ---- Zona B · Tipos según duración (fila 2, der -> izq) ----
  {zone:'b', emoji:'⚡', title:'Memoria sensorial', cx:2150, cy:1020,
    def:'Retención muy breve de la información sensorial.',
    carac:'Dura de milisegundos a segundos.',
    comp:'Precede a la memoria de trabajo.',
    apli:'Primer nivel del procesamiento de la información.'},
  {zone:'b', emoji:'🧮', title:'Memoria de trabajo', cx:1730, cy:1020,
    def:'Sistema que mantiene y manipula información de forma temporal.',
    carac:'Capacidad limitada; relacionada con las funciones ejecutivas.',
    comp:'Sustituye al concepto clásico de memoria a corto plazo.',
    apli:'Fundamental para el razonamiento y la resolución de problemas.'},
  {zone:'b', emoji:'🏛️', title:'Memoria a largo plazo', cx:1310, cy:1020,
    def:'Almacenamiento relativamente permanente de información.',
    carac:'Gran capacidad y duración.',
    comp:'Se divide en memoria declarativa y no declarativa.',
    apli:'Es el principal objeto de estudio de las amnesias.'},

  // ---- Zona C · Sistema declarativo (fila 2, continúa der -> izq) ----
  {zone:'c', emoji:'💬', title:'Memoria declarativa (explícita)', cx:890, cy:1020,
    def:'Recuerdo consciente de hechos y acontecimientos.',
    carac:'Incluye la memoria episódica y la semántica.',
    comp:'Se diferencia de la memoria implícita.',
    apli:'Depende del lóbulo temporal medial.'},
  {zone:'c', emoji:'📖', title:'Memoria episódica', cx:470, cy:1020,
    def:'Recuerdo de experiencias personales vividas.',
    carac:'Incluye contexto temporal y espacial.',
    comp:'Se diferencia de la memoria semántica.',
    apli:'Se altera precozmente en muchas amnesias.'},
  {zone:'c', emoji:'📚', title:'Memoria semántica', cx:50, cy:1020,
    def:'Conocimiento general del mundo.',
    carac:'No depende del contexto en que fue aprendido.',
    comp:'Se diferencia de la memoria episódica.',
    apli:'Puede preservarse en algunas amnesias.'},

  // ---- Zona D · Sistema no declarativo (fila 3, izq -> der) ----
  {zone:'d', emoji:'🌀', title:'Memoria no declarativa (implícita)', cx:50, cy:1640,
    def:'Aprendizajes que no requieren recuerdo consciente.',
    carac:'Incluye hábitos, habilidades, condicionamiento y priming.',
    comp:'No depende del hipocampo como la memoria declarativa.',
    apli:'Explica por qué algunos pacientes aprenden sin recordar.'},
  {zone:'d', emoji:'🚴', title:'Memoria procedimental', cx:470, cy:1640,
    def:'Aprendizaje de habilidades motoras y cognitivas.',
    carac:'Automática y muy resistente al olvido.',
    comp:'Es un tipo de memoria implícita (no declarativa).',
    apli:'Se conserva en muchos pacientes amnésicos.'},

  // ---- Zona E · Bases neurales y caso clínico (fila 3, continúa izq -> der) ----
  {zone:'e', emoji:'💎', title:'Consolidación', cx:890, cy:1640,
    def:'Estabilización de los recuerdos después del aprendizaje.',
    carac:'Requiere tiempo y estructuras temporales mediales.',
    comp:'Se diferencia de la recuperación.',
    apli:'Fundamental para comprender las amnesias.'},
  {zone:'e', emoji:'🐴', title:'Hipocampo', cx:1310, cy:1640,
    def:'Estructura clave para consolidar la memoria declarativa.',
    carac:'No almacena todos los recuerdos de forma permanente.',
    comp:'Se diferencia de los ganglios basales y el cerebelo.',
    apli:'Sus lesiones producen amnesia anterógrada.'},
  {zone:'e', emoji:'🧩', title:'Lóbulo temporal medial', cx:1730, cy:1640,
    def:'Región que incluye el hipocampo y estructuras relacionadas.',
    carac:'Participa en la consolidación de recuerdos.',
    comp:'Se diferencia de la corteza prefrontal.',
    apli:'Su lesión produce graves alteraciones mnésicas.'},
  {zone:'e', emoji:'🗝️', title:'Caso H.M.', cx:2150, cy:1640,
    def:'Paciente con resección bilateral del lóbulo temporal medial.',
    carac:'Conservó la memoria procedimental, pero perdió la capacidad de formar nuevos recuerdos episódicos.',
    comp:'Demostró la existencia de sistemas múltiples de memoria.',
    apli:'Caso fundamental en la historia de la Neuropsicología.'},
];

const ZONE_LABEL_POS = [
  {zone:'a', x:260,  y:120},
  {zone:'b', x:1730, y:740},
  {zone:'c', x:470,  y:740},
  {zone:'d', x:260,  y:1360},
  {zone:'e', x:1520, y:1360},
];

/* =========================================================
   BUILD DOM
========================================================= */
const canvas = document.getElementById('canvas');
const viewport = document.getElementById('viewport');
const dotsWrap = document.getElementById('dots');
const cardnameEl = document.getElementById('cardname');
const hintEl = document.getElementById('hint');

CARDS.forEach((c,i)=>{
  const el = document.createElement('div');
  el.className = `card zone-${c.zone}`;
  el.style.left = (c.cx - CARD_W/2)+'px';
  el.style.top  = (c.cy - CARD_H/2)+'px';
  el.dataset.idx = i;
  el.innerHTML = `
    <span class="badge">${String(i+1).padStart(2,'0')} / ${CARDS.length}</span>
    <div class="emoji-wrap">${c.emoji}</div>
    <h3>${c.title}</h3>
    <p class="def">${c.def}</p>
    <div class="divider"></div>
    <div class="row"><span class="ico">🧬</span><span class="txt"><span class="lbl">Características</span>${c.carac}</span></div>
    <div class="row"><span class="ico">🔀</span><span class="txt"><span class="lbl">Comparación</span>${c.comp}</span></div>
    <div class="row"><span class="ico">🎯</span><span class="txt"><span class="lbl">Aplicación</span>${c.apli}</span></div>
  `;
  el.addEventListener('click', ()=>focusCard(i));
  canvas.appendChild(el);

  const dot = document.createElement('button');
  dot.style.setProperty('--accentdot', ZONES[c.zone].hex);
  dot.title = c.title;
  dot.addEventListener('click', ()=>focusCard(i));
  dotsWrap.appendChild(dot);
});

ZONE_LABEL_POS.forEach(z=>{
  const el = document.createElement('div');
  el.className = `zone-label ${z.zone}`;
  el.style.left = z.x+'px';
  el.style.top = z.y+'px';
  const num = {a:'1',b:'2',c:'3',d:'4',e:'5'}[z.zone];
  el.innerHTML = `<span class="dot" style="background:currentColor"></span>${num} · ${ZONES[z.zone].label}`;
  canvas.appendChild(el);
});

/* connecting path (order = narrative order = CARDS order) */
const svg = document.getElementById('path');
const pts = CARDS.map(c=>[c.cx,c.cy]);
let d = `M ${pts[0][0]} ${pts[0][1]} `;
for(let i=1;i<pts.length;i++){
  const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
  const mx=(x0+x1)/2, my=(y0+y1)/2;
  d += `Q ${x0} ${y0} ${mx} ${my} `;
}
d += `T ${pts[pts.length-1][0]} ${pts[pts.length-1][1]}`;
svg.innerHTML = `
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${ZONES.a.hex}"/>
      <stop offset="30%" stop-color="${ZONES.b.hex}"/>
      <stop offset="55%" stop-color="${ZONES.c.hex}"/>
      <stop offset="78%" stop-color="${ZONES.d.hex}"/>
      <stop offset="100%" stop-color="${ZONES.e.hex}"/>
    </linearGradient>
  </defs>
  <path d="${d}" fill="none" stroke="url(#lg)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.55"/>
  <circle r="6" fill="#fff" class="pulseDot">
    <animateMotion dur="14s" repeatCount="indefinite" path="${d}"/>
  </circle>
`;

/* =========================================================
   PAN / ZOOM ENGINE
========================================================= */
let scale=1, tx=0, ty=0;
let currentIndex = -1; // -1 = overview
let dragging=false, dragStart={x:0,y:0}, txStart=0, tyStart=0, moved=false;

function apply(animate){
  canvas.classList.toggle('anim', !!animate);
  canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  document.getElementById('zoomLabel').textContent = Math.round(scale*100)+'%';
}

function vw(){return viewport.clientWidth;}
function vh(){return viewport.clientHeight;}

function fitAll(animate=true){
  const s = Math.min(vw()/2500, vh()/2050) * 0.94;
  scale = s;
  tx = (vw() - 2500*s)/2;
  ty = (vh() - 2050*s)/2;
  currentIndex = -1;
  apply(animate);
  updateUI();
}

function focusCard(i, animate=true){
  currentIndex = i;
  const c = CARDS[i];
  const maxS = Math.min(vw()/(CARD_W+140), vh()/(CARD_H+180));
  scale = Math.min(1.05, maxS);
  tx = vw()/2 - c.cx*scale;
  ty = vh()/2 - c.cy*scale;
  apply(animate);
  updateUI();
}

function updateUI(){
  document.querySelectorAll('.card').forEach((el,i)=>{
    el.classList.toggle('focused', i===currentIndex);
    el.classList.toggle('dim', currentIndex!==-1 && i!==currentIndex);
  });
  document.querySelectorAll('.dots button').forEach((el,i)=>{
    el.classList.toggle('active', i===currentIndex);
  });
  if(currentIndex===-1){
    cardnameEl.innerHTML = `Vista general — <strong>${CARDS.length} conceptos</strong>`;
  }else{
    const c = CARDS[currentIndex];
    cardnameEl.innerHTML = `${c.emoji} ${String(currentIndex+1).padStart(2,'0')}/${CARDS.length} — <strong>${c.title}</strong>`;
  }
  hintEl.classList.add('hide');
}

function next(){ focusCard(currentIndex>=CARDS.length-1 ? CARDS.length-1 : currentIndex+1); }
function prev(){
  if(currentIndex<=0){ fitAll(); } else { focusCard(currentIndex-1); }
}

/* keyboard */
window.addEventListener('keydown', e=>{
  if(['ArrowRight','ArrowDown'].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Escape'){ fitAll(); }
  else if(e.key==='+' || e.key==='='){ zoomBy(1.2); }
  else if(e.key==='-'){ zoomBy(1/1.2); }
});

/* buttons */
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('fitAll').addEventListener('click', ()=>fitAll());

function zoomBy(factor, cx, cy){
  cx = cx ?? vw()/2; cy = cy ?? vh()/2;
  const wx = (cx - tx)/scale, wy = (cy - ty)/scale;
  scale = Math.min(2.2, Math.max(0.28, scale*factor));
  tx = cx - wx*scale; ty = cy - wy*scale;
  apply(true);
}
document.getElementById('zoomIn').addEventListener('click', ()=>zoomBy(1.25));
document.getElementById('zoomOut').addEventListener('click', ()=>zoomBy(1/1.25));

/* wheel zoom centered at pointer */
viewport.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const cx = e.clientX-rect.left, cy = e.clientY-rect.top;
  const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
  canvas.classList.remove('anim');
  zoomBy(factor, cx, cy);
}, {passive:false});

/* drag to pan */
viewport.addEventListener('mousedown', e=>{
  dragging=true; moved=false; viewport.classList.add('dragging');
  dragStart={x:e.clientX,y:e.clientY}; txStart=tx; tyStart=ty;
  canvas.classList.remove('anim');
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
  if(Math.abs(dx)+Math.abs(dy) > 4) moved=true;
  tx = txStart+dx; ty = tyStart+dy;
  apply(false);
});
window.addEventListener('mouseup', ()=>{
  dragging=false; viewport.classList.remove('dragging');
});

/* touch drag */
viewport.addEventListener('touchstart', e=>{
  if(e.touches.length!==1) return;
  dragging=true; moved=false;
  dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; txStart=tx; tyStart=ty;
  canvas.classList.remove('anim');
}, {passive:true});
viewport.addEventListener('touchmove', e=>{
  if(!dragging || e.touches.length!==1) return;
  const dx=e.touches[0].clientX-dragStart.x, dy=e.touches[0].clientY-dragStart.y;
  if(Math.abs(dx)+Math.abs(dy) > 4) moved=true;
  tx = txStart+dx; ty = tyStart+dy;
  apply(false);
}, {passive:true});
viewport.addEventListener('touchend', ()=>{ dragging=false; });

/* click on empty canvas returns to overview */
viewport.addEventListener('click', e=>{
  if(moved) return;
  if(e.target === viewport || e.target.id === 'canvas'){ fitAll(); }
});

window.addEventListener('resize', ()=>{
  if(currentIndex===-1) fitAll(false); else focusCard(currentIndex,false);
});

/* init */
fitAll(false);
setTimeout(()=>{ /* keep hint until first interaction */ }, 0);
['keydown','mousedown','touchstart','wheel'].forEach(ev=>{
  window.addEventListener(ev, ()=>hintEl.classList.add('hide'), {once:true});
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Sendero Social · Repaso de Parcial</title>
<style>
  :root{
    --paper:#FBF6EC;
    --paper-dark:#F1E8D4;
    --ink:#2B2A28;
    --ink-soft:#5B564C;
    --path:#D8CBA8;

    --u3:#E0556F;   /* identidad - frambuesa */
    --u3-soft:#FBE0E5;
    --u4:#2E8B7A;   /* actitudes - verde jade */
    --u4-soft:#DCF0E9;
    --u5:#D98B2B;   /* representaciones - ámbar */
    --u5-soft:#FBE9D1;
    --u6:#4A5FC1;   /* influencia - índigo */
    --u6-soft:#E2E5FA;

    --accent: var(--u3);
    --accent-soft: var(--u3-soft);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(216,203,168,0.35), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(216,203,168,0.35), transparent 40%),
      var(--paper);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }

  @font-face{
    font-family:'Fraunces-fallback';
    src:local('Georgia');
  }

  .display{
    font-family: Georgia, 'Iowan Old Style', serif;
    font-weight:800;
    letter-spacing:-0.01em;
  }

  /* ===== TOP BAR ===== */
  .topbar{
    position:sticky; top:0; z-index:50;
    background: rgba(251,246,236,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 2px solid var(--path);
    padding: 14px 20px;
    display:flex; align-items:center; gap:16px;
  }
  .topbar .brand{
    font-size:1.05rem;
    font-weight:800;
    color:var(--ink);
    white-space:nowrap;
  }
  .topbar .brand span{ color: var(--accent); transition: color .4s; }

  .progress-track{
    flex:1;
    height:10px;
    background: var(--paper-dark);
    border-radius:8px;
    overflow:hidden;
    position:relative;
    border: 1.5px solid var(--path);
  }
  .progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--u3), var(--u4), var(--u5), var(--u6));
    background-size: 400% 100%;
    transition: width .5s ease;
  }
  .progress-label{
    font-size:0.78rem;
    color:var(--ink-soft);
    font-family: -apple-system, system-ui, sans-serif;
    white-space:nowrap;
    min-width:64px;
    text-align:right;
  }

  /* ===== MAIN STAGE ===== */
  .stage{
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 140px;
    min-height: 70vh;
    position:relative;
  }

  /* path dots behind */
  .stage::before{
    content:"";
    position:absolute;
    left:50%; top:0; bottom:0;
    width:6px;
    margin-left:-3px;
    background: repeating-linear-gradient(to bottom, var(--path) 0 10px, transparent 10px 20px);
    z-index:0;
    opacity:0.5;
  }

  .unit-banner{
    text-align:center;
    margin: 0 auto 36px;
    position:relative;
    z-index:1;
  }
  .unit-banner .eyebrow{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.72rem;
    letter-spacing: 0.18em;
    text-transform:uppercase;
    color: var(--accent);
    font-weight:700;
    margin-bottom:6px;
  }
  .unit-banner h2{
    font-size:1.5rem;
    margin:0;
    color:var(--ink);
  }
  .unit-banner .sub{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* ===== STATION CARD ===== */
  .station-wrap{
    position:relative;
    z-index:1;
    display:flex;
    justify-content:center;
  }

  .station{
    background: #fff;
    border-radius: 22px;
    padding: 38px 34px 34px;
    width:100%;
    max-width:620px;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.02),
      0 18px 40px -18px rgba(43,42,40,0.25),
      0 2px 6px rgba(43,42,40,0.06);
    border: 2px solid var(--accent);
    position:relative;
    animation: stationIn .45s cubic-bezier(.2,.8,.2,1);
  }

  @keyframes stationIn{
    from{ opacity:0; transform: translateY(18px) scale(0.985); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .station .num{
    position:absolute;
    top:-18px; left:28px;
    background: var(--accent);
    color:#fff;
    font-family: -apple-system, system-ui, sans-serif;
    font-weight:800;
    font-size:0.78rem;
    padding: 6px 14px;
    border-radius: 20px;
    box-shadow: 0 6px 14px -4px rgba(0,0,0,0.35);
  }

  .station .flag{
    position:absolute;
    top:-26px; right:22px;
    font-size:1.8rem;
    transform: rotate(8deg);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }

  .station h3{
    font-size: 1.35rem;
    line-height:1.4;
    margin: 14px 0 22px;
    color: var(--ink);
  }

  .station .answer{
    font-size: 1.02rem;
    line-height:1.75;
    color: var(--ink-soft);
  }

  .term{
    background: var(--accent-soft);
    color: var(--accent);
    border:none;
    border-bottom: 2.5px dashed var(--accent);
    font-weight:700;
    font-family:inherit;
    font-size:1rem;
    padding: 1px 6px 2px;
    border-radius: 6px;
    cursor:pointer;
    transition: all .15s ease;
    position:relative;
  }
  .term:hover, .term:focus{
    background: var(--accent);
    color:#fff;
    transform: translateY(-1px);
  }
  .term::after{
    content:"✦";
    font-size:0.6rem;
    margin-left:3px;
    opacity:0.7;
    vertical-align: super;
  }

  .station .hint{
    margin-top:22px;
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.78rem;
    color: var(--ink-soft);
    opacity:0.75;
    font-style: italic;
  }

  /* footprints connecting line */
  .connector{
    height:54px;
    width:6px;
    margin:0 auto;
    position:relative;
    z-index:1;
  }
  .connector .step{
    position:absolute;
    left:50%;
    width:10px;height:10px;
    border-radius:50%;
    background: var(--path);
  }

  /* ===== NAV BUTTONS ===== */
  .nav-row{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:34px;
    position:relative;
    z-index:1;
  }
  .btn{
    font-family: -apple-system, system-ui, sans-serif;
    font-weight:700;
    font-size:0.95rem;
    padding: 13px 26px;
    border-radius: 999px;
    border:2px solid var(--accent);
    background: #fff;
    color: var(--accent);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition: all .2s ease;
    box-shadow: 0 4px 0 0 var(--accent);
  }
  .btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 0 var(--accent);
  }
  .btn.primary{
    background: var(--accent);
    color:#fff;
  }
  .btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    box-shadow:none;
  }
  .btn .arrow{
    transition: transform .2s;
  }
  .btn.primary:hover .arrow{
    transform: translateX(4px);
  }

  /* ===== INTRO / OUTRO SCREENS ===== */
  .screen-card{
    background:#fff;
    border-radius:24px;
    padding: 52px 40px;
    max-width:600px;
    margin: 40px auto;
    text-align:center;
    box-shadow: 0 20px 50px -20px rgba(43,42,40,0.3);
    border: 2px solid var(--path);
    position:relative;
    z-index:1;
  }
  .screen-card .big-emoji{
    font-size:3.2rem;
    margin-bottom:10px;
    display:block;
  }
  .screen-card h1{
    font-size: 2rem;
    margin: 6px 0 14px;
  }
  .screen-card p{
    font-family: -apple-system, system-ui, sans-serif;
    color: var(--ink-soft);
    line-height:1.6;
    font-size:0.98rem;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin: 26px 0;
  }
  .legend-chip{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.78rem;
    font-weight:700;
    padding:7px 14px;
    border-radius:999px;
    display:flex; align-items:center; gap:6px;
  }
  .legend-chip .dot{ width:9px;height:9px;border-radius:50%; }

  .map-mini{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top: 28px;
    line-height:1.8;
  }

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(43,42,40,0.55);
    backdrop-filter: blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease;
  }
  .modal-overlay.open{
    opacity:1;
    pointer-events:all;
  }
  .modal-box{
    background:#fff;
    border-radius:20px;
    max-width:460px;
    width:100%;
    padding: 30px 28px 26px;
    position:relative;
    transform: scale(0.92) translateY(10px);
    transition: transform .25s cubic-bezier(.2,.9,.3,1.2);
    border: 3px solid var(--accent);
    box-shadow: 0 30px 60px -15px rgba(0,0,0,0.4);
  }
  .modal-overlay.open .modal-box{
    transform: scale(1) translateY(0);
  }
  .modal-box .tag{
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.68rem;
    font-weight:800;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .modal-box h4{
    margin: 0 0 12px;
    font-size:1.3rem;
    color:var(--ink);
  }
  .modal-box .body{
    font-size:0.98rem;
    line-height:1.65;
    color: var(--ink-soft);
  }
  .modal-close{
    position:absolute;
    top:14px; right:14px;
    background: var(--accent-soft);
    color: var(--accent);
    border:none;
    width:32px;height:32px;
    border-radius:50%;
    font-size:1rem;
    font-weight:800;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition: all .15s;
  }
  .modal-close:hover{
    background: var(--accent);
    color:#fff;
    transform: rotate(90deg);
  }
  .modal-seal{
    position:absolute;
    bottom:-16px; right:-12px;
    font-size:2.4rem;
    transform: rotate(-12deg);
    opacity:0.9;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
  }

  /* confetti pop on completion of all terms in a card */
  .confetti-burst{
    position:fixed;
    pointer-events:none;
    z-index:300;
    font-size:1.4rem;
  }

  /* ===== END SCREEN STATS ===== */
  .stats-row{
    display:flex;
    gap:14px;
    justify-content:center;
    margin: 24px 0;
    flex-wrap:wrap;
  }
  .stat-pill{
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--paper-dark);
    border-radius:14px;
    padding: 14px 18px;
    min-width:90px;
  }
  .stat-pill .n{ font-size:1.5rem; font-weight:800; color:var(--accent); }
  .stat-pill .l{ font-size:0.68rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; }

  /* responsive */
  @media (max-width: 600px){
    .station{ padding: 34px 22px 28px; }
    .station h3{ font-size:1.15rem; }
    .screen-card{ padding:40px 24px; }
    .screen-card h1{ font-size:1.6rem; }
    .topbar .brand{ font-size:0.9rem; }
  }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    .station{ animation:none; }
    .modal-box, .modal-overlay{ transition:none; }
  }

  .sr-only{
    position:absolute; width:1px;height:1px;
    overflow:hidden; clip:rect(0,0,0,0);
  }

  footer.credits{
    text-align:center;
    font-family: -apple-system, system-ui, sans-serif;
    font-size:0.72rem;
    color: var(--ink-soft);
    opacity:0.6;
    padding: 10px 0 30px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🧭 El Sendero <span id="brandAccent">Social</span></div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Parada 0/35</div>
</div>

<div class="stage" id="stage">
  <!-- JS renders here -->
</div>

<footer class="credits">Repaso de Psicología Social · Unidades 3 a 6 · hecho para no perderse en el parcial</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    <div class="tag" id="modalTag"></div>
    <h4 id="modalTitle"></h4>
    <div class="body" id="modalBody"></div>
    <div class="modal-seal" id="modalSeal"></div>
  </div>
</div>

<script>
/* =========================================================
   DATA: 35 estaciones agrupadas en 4 unidades
   Cada estación: pregunta (con <span class="term"> insertados manualmente)
   y un diccionario de términos -> {title, body, emoji}
   ========================================================= */

const UNITS = {
  u3: { key:'u3', label:'Unidad 3', title:'Identidad y socialización', sub:'Mead, Berger & Luckmann, Goffman', emoji:'🪞' },
  u4: { key:'u4', label:'Unidad 4', title:'Actitudes, prejuicio y discriminación', sub:'Festinger, Allport, TAR/TCP', emoji:'⚖️' },
  u5: { key:'u5', label:'Unidad 5', title:'Representaciones sociales', sub:'Moscovici, Abric, Jodelet', emoji:'🧩' },
  u6: { key:'u6', label:'Unidad 6', title:'Influencia social', sub:'Asch, Sherif, Milgram, Moscovici, Hollander', emoji:'🌀' },
};

const STATIONS = [
// ---------------- UNIDAD 3 ----------------
{
  unit:'u3', emoji:'👶',
  q: 'Para Mead, ¿qué es el [[mi]] y qué es el [[yo]] dentro del sí mismo?',
  a: 'El [[mi]] es el conjunto de actitudes de los otros, organizadas e incorporadas al individuo: funciona como el reflejo de la estructura social y el mecanismo de control moral. El [[yo]] es la reacción del individuo ante esas actitudes: el principio de acción, impulso y creatividad. La persona completa surge de la dialéctica entre ambos.',
  terms:{
    mi:{title:'El “Mí”', emoji:'🪨', body:'Representa la estructura social internalizada: el conjunto de actitudes de los otros organizadas dentro del individuo. Da estabilidad, responsabilidad y moralidad. Si la persona fuera solo “mí”, sería un mero reflejo pasivo de la sociedad.'},
    yo:{title:'El “Yo”', emoji:'⚡', body:'Es la reacción del individuo ante el “mí”: el principio de la acción, el impulso y la creatividad. Es lo que nunca es del todo predecible, y lo que permite cambiar e innovar la estructura social.'}
  }
},
{
  unit:'u3', emoji:'🎲',
  q:'¿Cuáles son las dos etapas del desarrollo de la identidad según Mead: el [[juego]] y el [[deporte]]?',
  a:'En el [[juego]] (play), el niño adopta roles aislados de personas específicas. En el [[deporte]] (game), debe incorporar la actitud de todos los participantes a la vez, formando el “otro generalizado”: la actitud de la comunidad en su conjunto.',
  terms:{
    juego:{title:'Etapa del Juego (Play)', emoji:'🧸', body:'El niño adopta papeles aislados y sucesivos de otros específicos (jugar al médico, a la mamá). Es una adopción de actitudes de personas concretas que han entrado en su vida, una a la vez.'},
    deporte:{title:'Etapa del Deporte (Game)', emoji:'⚽', body:'El individuo ya no adopta un solo papel, sino que debe sostener dentro de sí la actividad organizada completa, adoptando el papel de todos los demás participantes. Culmina en la formación del “otro generalizado”.'}
  }
},
{
  unit:'u3', emoji:'🗣️',
  q:'¿Qué es el [[gesto vocal]] y cómo se transforma en [[símbolo significante]]?',
  a:'El [[gesto vocal]] es la base del lenguaje: afecta al que lo emite igual que a quien lo escucha. Se vuelve [[símbolo significante]] cuando el individuo logra despertar en sí mismo la misma reacción que provoca en el otro, lo cual le permite “adoptar el papel del otro” y regular su propia conducta.',
  terms:{
    'gesto vocal':{title:'Gesto vocal', emoji:'🔊', body:'Tipo de gesto que afecta a quien lo realiza de la misma manera en que afecta a los demás (uno se oye hablar igual que los otros lo oyen). Es la base biológica que permite el surgimiento del lenguaje.'},
    'símbolo significante':{title:'Símbolo significante', emoji:'💬', body:'Un gesto se vuelve símbolo significante cuando el individuo es capaz de interpretar su propia significación, despertando en sí mismo la misma reacción que provoca en el otro. Permite “adoptar el papel del otro”.'}
  }
},
{
  unit:'u3', emoji:'👨‍👩‍👧',
  q:'¿Qué es la [[socialización primaria]] y cuándo finaliza, según Berger y Luckmann?',
  a:'Es la primera etapa de socialización, vivida en la niñez con fuerte carga afectiva a través de los [[otros significativos]]. Finaliza cuando se forma el “otro generalizado” en la conciencia del niño, quien se siente miembro efectivo de la sociedad.',
  terms:{
    'socialización primaria':{title:'Socialización primaria', emoji:'🌱', body:'Proceso por el cual el niño se convierte en miembro de la sociedad, atravesado por enorme carga emocional. Sin la adhesión afectiva a los otros significativos, el aprendizaje sería casi imposible.'},
    'otros significativos':{title:'Otros significativos', emoji:'👪', body:'Generalmente los padres: encargados de la socialización del niño. No solo seleccionan aspectos del mundo según su ubicación social, sino que también los filtran por sus propias idiosincrasias.'}
  }
},
{
  unit:'u3', emoji:'🏢',
  q:'¿En qué se diferencia la [[socialización secundaria]] de la primaria, y qué es la [[distancia del rol]]?',
  a:'La [[socialización secundaria]] introduce al sujeto ya socializado en submundos institucionales, con anonimato y baja carga afectiva. Permite la [[distancia del rol]]: separar el yo total del yo parcial requerido por un rol, algo que el niño no puede hacer en la primaria.',
  terms:{
    'socialización secundaria':{title:'Socialización secundaria', emoji:'🏛️', body:'Proceso posterior a la niñez que induce a internalizar “submundos” institucionales: vocabularios y rutinas de un área específica. Los roles son anónimos y los funcionarios que los enseñan, intercambiables.'},
    'distancia del rol':{title:'Distancia del rol', emoji:'🎭', body:'Capacidad de separar el “yo total” del “yo parcial” exigido por un rol (por ejemplo, el de empleado). En la socialización primaria esto no es posible: el niño no elige su mundo.'}
  }
},
{
  unit:'u3', emoji:'🌗',
  q:'¿Qué es la [[alternación]] y qué necesita una [[estructura de plausibilidad]]?',
  a:'La [[alternación]] es una transformación radical donde el individuo “permuta mundos” y reinterpreta su biografía entera. Requiere una [[estructura de plausibilidad]] eficaz: una comunidad que actúe como laboratorio de la nueva identidad.',
  terms:{
    'alternación':{title:'Alternación', emoji:'🔄', body:'Caso extremo de resocialización: el individuo cambia casi totalmente su realidad subjetiva. Debe desmantelar su pasado bajo la fórmula “antes creía... ahora sé”, y un aparato legitimador justifica el abandono de las realidades anteriores.'},
    'estructura de plausibilidad':{title:'Estructura de plausibilidad', emoji:'🏗️', body:'Base social (comunidad) segregada del mundo exterior que funciona como “laboratorio” de la transformación radical, sosteniendo la nueva realidad subjetiva del individuo.'}
  }
},
{
  unit:'u3', emoji:'🏷️',
  q:'¿Cuáles son los tres niveles de identidad para Goffman: [[identidad social]], [[identidad personal]] e [[identidad del yo]]?',
  a:'La [[identidad social]] son las categorías que la sociedad asigna; la [[identidad personal]] es la unicidad biográfica del individuo; la [[identidad del yo]] es el sentido subjetivo y reflexivo de la propia continuidad.',
  terms:{
    'identidad social':{title:'Identidad social', emoji:'🏷️', body:'Categorías y atributos que la sociedad asigna. Se divide en virtual (expectativas basadas en apariencias iniciales) y real (atributos que el individuo efectivamente posee). De su discrepancia surge el estigma.'},
    'identidad personal':{title:'Identidad personal', emoji:'🆔', body:'La unicidad del individuo: se construye con marcas (nombre, huellas, imagen) y una historia vital irrepetible. Permite identificar a “esta persona específica”, no solo “un tipo de persona”.'},
    'identidad del yo':{title:'Identidad del yo', emoji:'🌀', body:'Dimensión puramente subjetiva: el sentido que el individuo construye de su propia situación, carácter y continuidad a partir de sus experiencias sociales.'}
  }
},
{
  unit:'u3', emoji:'🩹',
  q:'¿Qué es el [[estigma]] y qué es un [[contacto mixto]] para Goffman?',
  a:'El [[estigma]] surge de la discrepancia entre la identidad social virtual y la real. Cuando aparece, la interacción se vuelve un [[contacto mixto]], donde el sujeto debe gestionar la información sobre su atributo desacreditador.',
  terms:{
    'estigma':{title:'Estigma', emoji:'🩹', body:'Atributo que vuelve al individuo diferente de lo esperado y lo reduce, en la mente de los demás, a una persona “inficionada y menospreciada”. Surge de la brecha entre identidad social virtual y real.'},
    'contacto mixto':{title:'Contacto mixto', emoji:'🤝', body:'Interacción entre una persona estigmatizada y una “normal”, donde el estigmatizado debe gestionar activamente la información sobre su defecto para evitar el menosprecio.'}
  }
},
{
  unit:'u3', emoji:'☀️',
  q:'¿Por qué la vida cotidiana es la [[suprema realidad]] y qué significa la [[actitud natural]]?',

/* =========================================================
   STATE & RENDER
   ========================================================= */

let current = -1; // -1 = intro screen
const total = STATIONS.length;
const seenTerms = new Set(); // global count of terms opened, just for fun stat
let lastUnitShown = null;

const stage = document.getElementById('stage');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const brandAccent = document.getElementById('brandAccent');

function setAccent(unitKey){
  const map = { u3:'--u3', u4:'--u4', u5:'--u5', u6:'--u6' };
  const soft = { u3:'--u3-soft', u4:'--u4-soft', u5:'--u5-soft', u6:'--u6-soft' };
  const root = document.documentElement;
  root.style.setProperty('--accent', `var(${map[unitKey]})`);
  root.style.setProperty('--accent-soft', `var(${soft[unitKey]})`);
}

function parseQA(raw){
  // returns array of {type:'text'|'term', value}
  const parts = [];
  const regex = /\[\[(.+?)\]\]/g;
  let lastIndex = 0, m;
  while((m = regex.exec(raw)) !== null){
    if(m.index > lastIndex) parts.push({type:'text', value: raw.slice(lastIndex, m.index)});
    parts.push({type:'term', value: m[1]});
    lastIndex = regex.lastIndex;
  }
  if(lastIndex < raw.length) parts.push({type:'text', value: raw.slice(lastIndex)});
  return parts;
}

function renderInline(raw, terms, unitKey){
  const parts = parseQA(raw);
  const frag = document.createDocumentFragment();
  parts.forEach(p=>{
    if(p.type === 'text'){
      frag.appendChild(document.createTextNode(p.value));
    } else {
      const btn = document.createElement('button');
      btn.className = 'term';
      btn.type = 'button';
      btn.textContent = p.value;
      btn.addEventListener('click', ()=> openModal(terms[p.value], unitKey));
      frag.appendChild(btn);
    }
  });
  return frag;
}

function renderIntro(){
  setAccent('u3');
  stage.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'screen-card';
  card.innerHTML = `
    <span class="big-emoji">🧭</span>
    <h1 class="display">El Sendero Social</h1>
    <p>Un recorrido por las cuatro unidades del parcial. En cada parada vas a encontrar una pregunta con palabras subrayadas: tocalas para abrir la definición completa. Cuando termines de leer, segui camino con la flecha.</p>
    <div class="legend">
      <span class="legend-chip" style="background:var(--u3-soft); color:var(--u3);"><span class="dot" style="background:var(--u3);"></span>U3 · Identidad</span>
      <span class="legend-chip" style="background:var(--u4-soft); color:var(--u4);"><span class="dot" style="background:var(--u4);"></span>U4 · Actitudes</span>
      <span class="legend-chip" style="background:var(--u5-soft); color:var(--u5);"><span class="dot" style="background:var(--u5);"></span>U5 · Representaciones</span>
      <span class="legend-chip" style="background:var(--u6-soft); color:var(--u6);"><span class="dot" style="background:var(--u6);"></span>U6 · Influencia</span>
    </div>
    <div class="nav-row">
      <button class="btn primary" id="startBtn">Empezar el recorrido <span class="arrow">→</span></button>
    </div>
    <div class="map-mini" id="introTotal">paradas en total · podés volver atrás cuando quieras</div>
  `;
  stage.appendChild(card);
  document.getElementById('startBtn').addEventListener('click', ()=> goTo(0));
  document.getElementById('introTotal').textContent = `${total} paradas en total · podés volver atrás cuando quieras`;
  updateProgress();
}

function renderOutro(){
  setAccent('u6');
  stage.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'screen-card';
  card.innerHTML = `
    <span class="big-emoji">🏁</span>
    <h1 class="display">¡Llegaste a la meta!</h1>
    <p id="outroIntro">Repasá las que sientas más flojas y volvé a abrir los términos que se te escaparon.</p>
    <div class="stats-row">
      <div class="stat-pill"><div class="n" id="statTotal">0</div><div class="l">Paradas</div></div>
      <div class="stat-pill"><div class="n" id="termsOpened">0</div><div class="l">Términos abiertos</div></div>
      <div class="stat-pill"><div class="n">4</div><div class="l">Unidades</div></div>
    </div>
    <div class="nav-row">
      <button class="btn" id="restartBtn">↺ Recorrer de nuevo</button>
    </div>
  `;
  stage.appendChild(card);
  document.getElementById('termsOpened').textContent = seenTerms.size;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('outroIntro').textContent = `Recorriste las ${total} paradas del sendero. Repasá las que sientas más flojas y volvé a abrir los términos que se te escaparon.`;
  document.getElementById('restartBtn').addEventListener('click', ()=> { goTo(0); });
  updateProgress();
}

function renderStation(i){
  const s = STATIONS[i];
  const unit = UNITS[s.unit];
  setAccent(s.unit);
  brandAccent.textContent = unit.title.split(/[ ,]/)[0];

  stage.innerHTML = '';

  // unit banner only if changed
  if(lastUnitShown !== s.unit){
    const banner = document.createElement('div');
    banner.className = 'unit-banner';
    banner.innerHTML = `
      <div class="eyebrow">${unit.label}</div>
      <h2 class="display">${unit.emoji} ${unit.title}</h2>
      <div class="sub">${unit.sub}</div>
    `;
    stage.appendChild(banner);
  }
  lastUnitShown = s.unit;

  const wrap = document.createElement('div');
  wrap.className = 'station-wrap';

  const card = document.createElement('div');
  card.className = 'station';

  const numEl = document.createElement('div');
  numEl.className = 'num';
  numEl.textContent = `Parada ${i+1} de ${total}`;
  card.appendChild(numEl);

  const flag = document.createElement('div');
  flag.className = 'flag';
  flag.textContent = s.emoji;
  card.appendChild(flag);

  const h3 = document.createElement('h3');
  h3.appendChild(renderInline(s.q, s.terms, s.unit));
  card.appendChild(h3);

  const hr = document.createElement('div');
  hr.style.height = '1px';
  hr.style.background = 'var(--accent-soft)';
  hr.style.margin = '4px 0 18px';
  card.appendChild(hr);

  const ans = document.createElement('div');
  ans.className = 'answer';
  ans.appendChild(renderInline(s.a, s.terms, s.unit));
  card.appendChild(ans);

  const hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = '✦ Tocá las palabras resaltadas para ver la definición completa.';
  card.appendChild(hint);

  wrap.appendChild(card);
  stage.appendChild(wrap);

  const nav = document.createElement('div');
  nav.className = 'nav-row';
  nav.innerHTML = `
    <button class="btn" id="prevBtn" ${i===0 ? 'disabled' : ''}>← Atrás</button>
    <button class="btn primary" id="nextBtn">${i === total-1 ? 'Llegar a la meta' : 'Siguiente parada'} <span class="arrow">→</span></button>
  `;
  stage.appendChild(nav);

  document.getElementById('prevBtn').addEventListener('click', ()=> goTo(i-1));
  document.getElementById('nextBtn').addEventListener('click', ()=> goTo(i+1));

  updateProgress();
}

function updateProgress(){
  const shown = current < 0 ? 0 : current+1;
  const pct = current < 0 ? 0 : ((current+1)/total)*100;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = current < 0 ? `Parada 0/${total}` : (current >= total ? `¡Listo! ${total}/${total}` : `Parada ${shown}/${total}`);
}

function goTo(i){
  if(i < 0){ current = -1; renderIntro(); return; }
  if(i >= total){ current = total; renderOutro(); return; }
  current = i;
  renderStation(i);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* =========================================================
   MODAL
   ========================================================= */
const overlay = document.getElementById('modalOverlay');
const modalBox = document.getElementById('modalBox');
const modalTag = document.getElementById('modalTag');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalSeal = document.getElementById('modalSeal');
const modalClose = document.getElementById('modalClose');

function openModal(termData, unitKey){
  if(!termData) return;
  seenTerms.add(termData.title);
  const unit = UNITS[unitKey];
  modalTag.textContent = unit.label + ' · Definición clave';
  modalTitle.textContent = termData.title;
  modalBody.textContent = termData.body;
  modalSeal.textContent = termData.emoji || '✦';
  overlay.classList.add('open');
}
function closeModal(){
  overlay.classList.remove('open');
}
modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeModal();
  if(overlay.classList.contains('open')) return;
  if(current >= 0 && current < total){
    if(e.key === 'ArrowRight') goTo(current+1);
    if(e.key === 'ArrowLeft') goTo(current-1);
  }
});

/* init */
renderInline; // keep linter quiet
goTo(-1);
</script>
